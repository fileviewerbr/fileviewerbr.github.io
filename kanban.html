<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestJobs — Sistema de Gerenciamento</title>
    <style>
        /* ============ RESET & BASE ============ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-sidebar: #1e293b;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --success: #059669;
            --success-bg: #d1fae5;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --info: #0284c7;
            --info-bg: #e0f2fe;
            --purple: #7c3aed;
            --purple-bg: #ede9fe;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .app-container { display: flex; width: 100%; min-height: 100vh; }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            border-right: 1px solid #334155;
        }

        .sidebar-brand {
            padding: 22px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .brand-text h2 { font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.3px; }
        .brand-text p { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }

        .sidebar-section {
            padding: 18px 16px 8px;
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .sidebar-nav { flex: 1; padding: 4px 12px; overflow-y: auto; }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.15s;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 2px;
            user-select: none;
        }

        .nav-item:hover { background: #334155; color: #f1f5f9; }
        .nav-item.active { background: var(--primary); color: #ffffff; }
        .nav-item svg { margin-right: 10px; width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }

        .sidebar-footer { padding: 16px; border-top: 1px solid #334155; }

        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }

        .user-details { flex: 1; min-width: 0; }
        .user-details .name { font-size: 13px; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-details .role { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; }

        /* ============ MAIN ============ */
        .main-content { flex: 1; margin-left: 240px; padding: 24px 28px; min-height: 100vh; min-width: 0; }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; }
        .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* ============ BUTTONS ============ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.15s;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn svg { width: 14px; height: 14px; stroke-width: 2.2; }

        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }

        .btn-secondary { background: white; color: var(--text-primary); border-color: var(--border); }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }

        .btn-success { background: var(--success); color: white; border-color: var(--success); }
        .btn-success:hover { background: #047857; }

        .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }

        .btn-ghost { background: transparent; color: var(--text-secondary); border-color: transparent; padding: 6px 8px; }
        .btn-ghost:hover { background: #f1f5f9; color: var(--text-primary); }

        .btn-sm { padding: 6px 10px; font-size: 12px; }
        .btn-xs { padding: 4px 7px; font-size: 11px; }
        .btn-xs svg { width: 12px; height: 12px; }
        .btn-block { width: 100%; justify-content: center; }

        /* ============ FORMS ============ */
        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.1px;
        }

        .form-group label .required { color: var(--danger); margin-left: 2px; }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13.5px;
            font-family: inherit;
            color: var(--text-primary);
            background: white;
            transition: all 0.15s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .form-control:disabled { background: #f8fafc; color: var(--text-muted); cursor: not-allowed; }
        textarea.form-control { min-height: 80px; resize: vertical; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .form-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.15s;
        }

        .stat-card:hover { box-shadow: 0 4px 12px rgba(15,23,42,0.06); border-color: #cbd5e1; }

        .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .stat-label {
            font-size: 11.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        .stat-icon {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        .stat-icon svg { width: 15px; height: 15px; stroke-width: 2; }

        .stat-number { font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.8px; line-height: 1.1; }
        .stat-footer { margin-top: 8px; font-size: 12px; color: var(--text-muted); }

        /* ============ KANBAN ============ */
        .kanban-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .kanban-toolbar .form-control { width: auto; min-width: 150px; padding: 7px 10px; font-size: 13px; }
        .kanban-toolbar label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-right: -6px; }

        .kanban-scroll { overflow-x: auto; padding-bottom: 12px; }

        .kanban-user-block {
            margin-bottom: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .kanban-user-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
        }

        .kanban-user-header .user-avatar { width: 30px; height: 30px; font-size: 12px; border-radius: 6px; }
        .kanban-user-header .user-name { font-weight: 600; font-size: 13.5px; color: var(--text-primary); }
        .kanban-user-header .user-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

        .kanban-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(180px, 1fr));
            gap: 1px;
            background: var(--border);
        }

        .kanban-col {
            background: #fafbfc;
            padding: 8px;
            min-height: 140px;
            transition: background 0.15s;
        }

        .kanban-col.drag-over {
            background: var(--info-bg);
            outline: 2px dashed var(--primary-light);
            outline-offset: -4px;
        }

        .kanban-col-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 8px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .kanban-col-header .day-abbr { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; }
        .kanban-col-header .day-num { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .kanban-col-header.today .day-abbr { color: var(--primary); }
        .kanban-col-header.today .day-num { color: var(--primary); font-weight: 700; }

        /* ============ CARD ============ */
        .activity-card {
            background: white;
            border-radius: 6px;
            padding: 9px 10px;
            margin-bottom: 6px;
            cursor: grab;
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary-light);
            transition: all 0.15s;
            position: relative;
        }

        .activity-card:hover { box-shadow: 0 2px 8px rgba(15,23,42,0.08); border-color: #cbd5e1; }
        .activity-card:active { cursor: grabbing; }
        .activity-card.dragging { opacity: 0.4; }

        .activity-card.status-pendente { border-left-color: var(--warning); }
        .activity-card.status-em_processo { border-left-color: var(--info); }
        .activity-card.status-concluido { border-left-color: var(--success); opacity: 0.75; }
        .activity-card.status-concluido .activity-title { text-decoration: line-through; color: var(--text-muted); }

        .activity-title { font-size: 12.5px; font-weight: 600; color: var(--text-primary); line-height: 1.35; margin-bottom: 5px; word-break: break-word; }

        .activity-job {
            font-size: 10.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .activity-job svg { width: 11px; height: 11px; flex-shrink: 0; }

        .activity-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }

        .tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .tag-direcao { background: var(--purple-bg); color: var(--purple); }
        .tag-redacao { background: var(--success-bg); color: var(--success); }
        .tag-design { background: var(--warning-bg); color: var(--warning); }
        .tag-outro { background: #f1f5f9; color: var(--text-secondary); }

        .tag-status { text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.5px; }
        .tag-status.pendente { background: var(--warning-bg); color: var(--warning); }
        .tag-status.em_processo { background: var(--info-bg); color: var(--info); }
        .tag-status.concluido { background: var(--success-bg); color: var(--success); }

        .activity-actions {
            display: flex;
            gap: 2px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .activity-card:hover .activity-actions { opacity: 1; }

        .activity-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            transition: all 0.15s;
        }

        .activity-actions button:hover { background: #f1f5f9; color: var(--text-primary); }
        .activity-actions svg { width: 12px; height: 12px; stroke-width: 2.2; }

        /* ============ TABLES ============ */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .data-table thead th {
            background: #f8fafc;
            padding: 11px 14px;
            text-align: left;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .data-table tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-primary);
            vertical-align: middle;
        }

        .data-table tbody tr:last-child td { border-bottom: none; }
        .data-table tbody tr:hover td { background: #fafbfc; }

        .data-table .cell-strong { font-weight: 600; }
        .data-table .cell-muted { color: var(--text-muted); font-size: 12.5px; }
        .data-table .cell-actions { display: flex; gap: 4px; }

        /* ============ MODAL ============ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.55);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 20px 60px rgba(15,23,42,0.3);
            animation: modalIn 0.2s ease;
            overflow: hidden;
        }

        .modal.modal-lg { max-width: 820px; }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }

        .modal-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
        .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

        .modal-close {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .modal-close:hover { background: #e2e8f0; color: var(--text-primary); }
        .modal-close svg { width: 16px; height: 16px; stroke-width: 2.2; }

        .modal-body { padding: 22px 24px; max-height: 65vh; overflow-y: auto; }

        .modal-footer {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            background: #f8fafc;
        }

        /* ============ MODAL CONTEXT BANNER ============ */
        .context-banner {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .context-banner .icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .context-banner .icon-wrap svg { width: 16px; height: 16px; stroke-width: 2.2; }

        .context-banner .text { flex: 1; min-width: 0; }
        .context-banner .text strong { font-size: 13px; color: var(--primary-dark); display: block; }
        .context-banner .text span { font-size: 12px; color: var(--text-secondary); }

        /* ============ SECTION TITLE ============ */
        .section-title {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin: 20px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .section-title:first-child { margin-top: 0; }

        /* ============ LOGIN ============ */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 36px 32px;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
        }

        .login-brand { text-align: center; margin-bottom: 28px; }

        .login-brand .brand-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 14px;
            font-size: 18px;
            border-radius: 10px;
        }

        .login-brand h1 { font-size: 19px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; }
        .login-brand p { color: var(--text-muted); font-size: 12.5px; margin-top: 4px; }

        .login-error {
            color: var(--danger);
            font-size: 12.5px;
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--danger-bg);
            border-radius: 6px;
            display: none;
        }

        /* ============ CHARTS ============ */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }

        .chart-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title svg { width: 14px; height: 14px; color: var(--text-muted); }

        .bar-chart { display: flex; flex-direction: column; gap: 10px; }

        .bar-item { display: flex; align-items: center; gap: 10px; }

        .bar-label {
            font-size: 12px;
            color: var(--text-secondary);
            width: 130px;
            flex-shrink: 0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track { flex: 1; height: 22px; background: #f1f5f9; border-radius: 6px; overflow: hidden; position: relative; }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 11px;
            color: white;
            font-weight: 700;
            min-width: 28px;
        }

        .bar-value { font-size: 12px; font-weight: 700; color: var(--text-primary); min-width: 30px; text-align: right; }

        /* ============ TOAST ============ */
        .toast-container { position: fixed; top: 18px; right: 18px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }

        .toast {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(15,23,42,0.15);
            animation: toastIn 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 260px;
            max-width: 380px;
            background: white;
            border-left: 4px solid var(--info);
            color: var(--text-primary);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .toast.toast-success { border-left-color: var(--success); }
        .toast.toast-error { border-left-color: var(--danger); }
        .toast.toast-warning { border-left-color: var(--warning); }
        .toast.toast-info { border-left-color: var(--info); }

        .toast svg { width: 16px; height: 16px; flex-shrink: 0; }
        .toast.toast-success svg { color: var(--success); }
        .toast.toast-error svg { color: var(--danger); }
        .toast.toast-warning svg { color: var(--warning); }
        .toast.toast-info svg { color: var(--info); }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: white;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        .empty-state svg { width: 40px; height: 40px; color: #cbd5e1; margin-bottom: 12px; stroke-width: 1.5; }
        .empty-state h3 { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; }
        .empty-state p { font-size: 13px; }

        /* ============ STAGE SELECTOR (status modal) ============ */
        .stage-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stage-option {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            background: white;
        }

        .stage-option:hover { border-color: var(--primary-light); }

        .stage-option.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .stage-option .stage-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stage-option.pendente .stage-label { color: var(--warning); }
        .stage-option.em_processo .stage-label { color: var(--info); }
        .stage-option.concluido .stage-label { color: var(--success); }

        .stage-option .stage-desc { font-size: 10.5px; color: var(--text-muted); }

        /* ============ CLASSIFICATION SELECTOR ============ */
        .classification-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }

        .classification-option {
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            background: white;
            font-size: 12.5px;
            font-weight: 600;
        }

        .classification-option:hover { border-color: var(--primary-light); }
        .classification-option.selected { border-color: var(--primary); background: #eff6ff; }

        .classification-option.tag-direcao { color: var(--purple); }
        .classification-option.tag-redacao { color: var(--success); }
        .classification-option.tag-design { color: var(--warning); }
        .classification-option.tag-outro { color: var(--text-secondary); }

        /* ============ UTILITIES ============ */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .mt-1 { margin-top: 8px; }
        .mt-2 { margin-top: 16px; }
        .mb-2 { margin-bottom: 16px; }
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }
        .gap-1 { gap: 8px; }
        .gap-2 { gap: 16px; }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 900px) {
            .sidebar { width: 60px; }
            .sidebar-brand { padding: 16px 10px; justify-content: center; }
            .brand-text, .sidebar-section, .sidebar-footer .user-info .user-details, .nav-item span:not(.nav-icon) { display: none; }
            .nav-item { justify-content: center; padding: 12px; }
            .nav-item svg { margin: 0; }
            .main-content { margin-left: 60px; padding: 16px; }
            .form-row { grid-template-columns: 1fr; }
            .stage-options { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .content-header { flex-direction: column; align-items: flex-start; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .kanban-grid { grid-template-columns: repeat(7, minmax(150px, 1fr)); }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ============ LOGIN ============ -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="login-brand">
            <div class="brand-logo">GJ</div>
            <h1>GestJobs</h1>
            <p>Sistema de Gerenciamento</p>
        </div>
        <div class="form-group">
            <label>Nome de Usuário</label>
            <input type="text" class="form-control" id="loginUsername" placeholder="Digite seu usuário" autocomplete="off" autofocus>
        </div>
        <button class="btn btn-primary btn-block" onclick="fazerLogin()">Entrar no Sistema</button>
        <div class="login-error" id="loginError"></div>
        <p style="margin-top:18px; font-size:11.5px; color:var(--text-muted); text-align:center; line-height:1.5;">
            Acesso inicial com usuário <strong>admin</strong>
        </p>
    </div>
</div>

<!-- ============ APP ============ -->
<div class="app-container hidden" id="appContainer">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">GJ</div>
            <div class="brand-text">
                <h2>GestJobs</h2>
                <p>Gerenciamento</p>
            </div>
        </div>
        <div class="sidebar-section" id="sidebarSectionLabel">Navegação</div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div class="user-details">
                    <div class="name" id="userNameDisplay">Admin</div>
                    <div class="role" id="userRoleDisplay">Administrador</div>
                </div>
            </div>
            <button class="btn btn-secondary btn-sm btn-block" onclick="fazerLogout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sair
            </button>
        </div>
    </aside>
    <main class="main-content" id="mainContent"></main>
</div>

<script>
// ============================================================================
// CONFIG
// ============================================================================
const FIREBASE_URL = "https://kanban-7e762-default-rtdb.firebaseio.com";

const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const DIAS_ABREV = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

const CLASSIFICACOES_PADRAO = [
    { id: 'class_1', nome: 'Direção de Arte', cor: 'tag-direcao' },
    { id: 'class_2', nome: 'Redação', cor: 'tag-redacao' },
    { id: 'class_3', nome: 'Design', cor: 'tag-design' },
    { id: 'class_4', nome: 'Outro', cor: 'tag-outro' }
];

const STATUS_LABEL = {
    'pendente': 'Pendente',
    'em_processo': 'Em Processo',
    'concluido': 'Concluído'
};

// ============================================================================
// ICONS
// ============================================================================
const ICONS = {
    dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
    kanban: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18"/><rect x="10" y="3" width="6" height="12"/><rect x="17" y="3" width="4" height="8"/></svg>',
    jobs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    tags: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
    filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
    arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
};

// ============================================================================
// STATE
// ============================================================================
const state = {
    currentUser: null,
    users: [],
    jobs: [],          // Jobs = Atividades (unificados)
    classifications: [],
    currentPage: 'dashboard',
    draggedJob: null,
    filters: {
        classification: 'all',
        startDate: '',
        endDate: '',
        status: 'all'
    }
};

// ============================================================================
// INIT
// ============================================================================
document.addEventListener('DOMContentLoaded', () => {
    const savedUser = sessionStorage.getItem('gestjobs_user');
    if (savedUser) {
        state.currentUser = JSON.parse(savedUser);
        iniciarApp();
    }
    document.getElementById('loginUsername').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') fazerLogin();
    });
});

// ============================================================================
// LOGIN
// ============================================================================
async function fazerLogin() {
    const username = document.getElementById('loginUsername').value.trim().toLowerCase();
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';

    if (!username) {
        errEl.textContent = 'Digite um nome de usuário.';
        errEl.style.display = 'block';
        return;
    }

    try {
        const response = await fetch(`${FIREBASE_URL}/usuarios.json`);
        const data = await response.json();

        if (!data) {
            if (username === 'admin') {
                const adminUser = {
                    id: 'user_admin',
                    nome: 'Administrador',
                    username: 'admin',
                    tipo: 'admin',
                    ativo: true,
                    criadoEm: new Date().toISOString()
                };
                await salvarUsuarioFirebase(adminUser);
                state.currentUser = adminUser;
                state.users = [adminUser];
                sessionStorage.setItem('gestjobs_user', JSON.stringify(adminUser));
                iniciarApp();
                mostrarToast('Bem-vindo, Administrador', 'success');
                return;
            }
            errEl.textContent = 'Nenhum usuário cadastrado. Utilize "admin" para criar o administrador.';
            errEl.style.display = 'block';
            return;
        }

        const users = Object.values(data);
        let foundUser = users.find(u => u.username && u.username.toLowerCase() === username);
        if (!foundUser) foundUser = users.find(u => u.nome && u.nome.toLowerCase() === username);

        if (foundUser) {
            if (foundUser.ativo === false) {
                errEl.textContent = 'Usuário inativo. Contate o administrador.';
                errEl.style.display = 'block';
                return;
            }
            state.currentUser = foundUser;
            state.users = users;
            sessionStorage.setItem('gestjobs_user', JSON.stringify(foundUser));
            iniciarApp();
            mostrarToast(`Bem-vindo, ${foundUser.nome}`, 'success');
        } else {
            errEl.textContent = 'Usuário não encontrado.';
            errEl.style.display = 'block';
        }
    } catch (error) {
        console.error('Erro no login:', error);
        errEl.textContent = 'Erro ao conectar com o servidor.';
        errEl.style.display = 'block';
    }
}

function fazerLogout() {
    sessionStorage.removeItem('gestjobs_user');
    state.currentUser = null;
    state.users = [];
    state.jobs = [];
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginError').style.display = 'none';
}

async function iniciarApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContainer').classList.remove('hidden');
    atualizarSidebar();
    await carregarDados();
    if (state.currentUser.tipo === 'admin') {
        navegarPara('dashboard');
    } else {
        navegarPara('kanban');
    }
}

// ============================================================================
// DATA
// ============================================================================
async function carregarDados() {
    try {
        const [usersResp, jobsResp, classResp] = await Promise.all([
            fetch(`${FIREBASE_URL}/usuarios.json`),
            fetch(`${FIREBASE_URL}/jobs.json`),
            fetch(`${FIREBASE_URL}/classificacoes.json`)
        ]);

        const usersData = await usersResp.json();
        const jobsData = await jobsResp.json();
        const classData = await classResp.json();

        state.users = usersData ? Object.values(usersData) : [];
        state.jobs = jobsData ? Object.values(jobsData) : [];
        state.classifications = classData ? Object.values(classData) : [];

        if (!classData) {
            for (const c of CLASSIFICACOES_PADRAO) {
                await fetch(`${FIREBASE_URL}/classificacoes/${c.id}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(c)
                });
            }
            state.classifications = [...CLASSIFICACOES_PADRAO];
        }

        if (!state.users.find(u => u.tipo === 'admin')) {
            const adminUser = {
                id: 'user_admin',
                nome: 'Administrador',
                username: 'admin',
                tipo: 'admin',
                ativo: true,
                criadoEm: new Date().toISOString()
            };
            await salvarUsuarioFirebase(adminUser);
            state.users.push(adminUser);
        }
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        mostrarToast('Erro ao carregar dados', 'error');
    }
}

async function salvarUsuarioFirebase(user) {
    await fetch(`${FIREBASE_URL}/usuarios/${user.id}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
    });
}

// ============================================================================
// NAV
// ============================================================================
function navegarPara(page) {
    state.currentPage = page;
    atualizarSidebar();
    renderizarPagina();
}

function atualizarSidebar() {
    const nav = document.getElementById('sidebarNav');
    const label = document.getElementById('sidebarSectionLabel');
    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';

    let items = [];
    if (isAdmin) {
        label.textContent = 'Administração';
        items = [
            { id: 'dashboard', icon: ICONS.dashboard, label: 'Dashboard' },
            { id: 'kanban', icon: ICONS.kanban, label: 'Kanban' },
            { id: 'jobs', icon: ICONS.jobs, label: 'Jobs' },
            { id: 'usuarios', icon: ICONS.users, label: 'Usuários' },
            { id: 'classificacoes', icon: ICONS.tags, label: 'Classificações' }
        ];
    } else {
        label.textContent = 'Meu Trabalho';
        items = [
            { id: 'kanban', icon: ICONS.kanban, label: 'Minhas Atividades' }
        ];
    }

    nav.innerHTML = items.map(item => `
        <div class="nav-item ${state.currentPage === item.id ? 'active' : ''}" onclick="navegarPara('${item.id}')">
            ${item.icon}
            <span>${item.label}</span>
        </div>
    `).join('');

    if (state.currentUser) {
        const inicial = (state.currentUser.nome || 'U').charAt(0).toUpperCase();
        document.getElementById('userAvatar').textContent = inicial;
        document.getElementById('userNameDisplay').textContent = state.currentUser.nome || 'Usuário';
        document.getElementById('userRoleDisplay').textContent = state.currentUser.tipo === 'admin' ? 'Administrador' : 'Colaborador';
    }
}

// ============================================================================
// ROUTER
// ============================================================================
function renderizarPagina() {
    const main = document.getElementById('mainContent');
    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';

    switch (state.currentPage) {
        case 'dashboard': if (isAdmin) renderDashboard(main); else renderKanban(main); break;
        case 'kanban': renderKanban(main); break;
        case 'jobs': if (isAdmin) renderJobs(main); break;
        case 'usuarios': if (isAdmin) renderUsuarios(main); break;
        case 'classificacoes': if (isAdmin) renderClassificacoes(main); break;
        default: renderKanban(main);
    }
}

// ============================================================================
// DASHBOARD
// ============================================================================
function renderDashboard(container) {
    const totalJobs = state.jobs.length;
    const pendentes = state.jobs.filter(j => j.status === 'pendente').length;
    const emProcesso = state.jobs.filter(j => j.status === 'em_processo').length;
    const concluidas = state.jobs.filter(j => j.status === 'concluido').length;
    const totalUsuarios = state.users.filter(u => u.tipo !== 'admin').length;

    const hoje = new Date().toISOString().split('T')[0];
    const jobsAtrasados = state.jobs.filter(j => j.prazo && j.prazo < hoje && j.status !== 'concluido').length;

    const statusData = [
        { label: 'Pendentes', value: pendentes, color: '#d97706' },
        { label: 'Em Processo', value: emProcesso, color: '#0284c7' },
        { label: 'Concluídas', value: concluidas, color: '#059669' }
    ];

    const porUsuario = {};
    state.jobs.forEach(j => {
        const u = state.users.find(u => u.id === j.usuarioId);
        const nome = u ? u.nome : 'Não atribuído';
        porUsuario[nome] = (porUsuario[nome] || 0) + 1;
    });
    const usuarioData = Object.entries(porUsuario).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);

    const porClass = {};
    state.jobs.forEach(j => {
        const c = state.classifications.find(c => c.id === j.classificacaoId);
        const nome = c ? c.nome : 'Sem classificação';
        porClass[nome] = (porClass[nome] || 0) + 1;
    });
    const classData = Object.entries(porClass).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);

    const maxStatus = Math.max(...statusData.map(d => d.value), 1);
    const maxUser = Math.max(...usuarioData.map(d => d.value), 1);
    const maxClass = Math.max(...classData.map(d => d.value), 1);

    container.innerHTML = `
        <div class="content-header">
            <div>
                <div class="page-title">Dashboard</div>
                <div class="page-subtitle">Visão geral do sistema</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="carregarDados().then(renderizarPagina)">
                    ${ICONS.refresh} Atualizar
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-label">Jobs Totais</div>
                    <div class="stat-icon">${ICONS.jobs}</div>
                </div>
                <div class="stat-number">${totalJobs}</div>
                <div class="stat-footer">${jobsAtrasados} atrasado(s)</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-label">Pendentes</div>
                    <div class="stat-icon">${ICONS.chart}</div>
                </div>
                <div class="stat-number">${pendentes}</div>
                <div class="stat-footer">Aguardando início</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">

// ============================================================================
// KANBAN
// ============================================================================
function renderKanban(container) {
    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';

    const hoje = new Date();
    const inicioSemana = new Date(hoje);
    inicioSemana.setDate(hoje.getDate() - hoje.getDay());

    const dias = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(inicioSemana);
        d.setDate(inicioSemana.getDate() + i);
        dias.push({
            diaAbrev: DIAS_ABREV[d.getDay()],
            data: d.toISOString().split('T')[0],
            dataFormatada: d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }),
            isToday: d.toDateString() === hoje.toDateString()
        });
    }

    let jobs = [...state.jobs];
    if (!isAdmin) jobs = jobs.filter(j => j.usuarioId === state.currentUser.id);
    if (state.filters.classification !== 'all') jobs = jobs.filter(j => j.classificacaoId === state.filters.classification);
    if (state.filters.status !== 'all') jobs = jobs.filter(j => j.status === state.filters.status);
    if (state.filters.startDate) jobs = jobs.filter(j => j.dataExecucao >= state.filters.startDate);
    if (state.filters.endDate) jobs = jobs.filter(j => j.dataExecucao <= state.filters.endDate);

    const classOptions = state.classifications.map(c => `<option value="${c.id}" ${state.filters.classification === c.id ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`).join('');

    let html = `
        <div class="content-header">
            <div>
                <div class="page-title">${isAdmin ? 'Kanban de Jobs' : 'Minhas Atividades'}</div>
                <div class="page-subtitle">${isAdmin ? 'Visualização por colaborador e dia da semana' : 'Arraste seus cards entre os dias'}</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary btn-sm" onclick="abrirModalJob()">${ICONS.plus} Novo Job</button>
                <button class="btn btn-secondary btn-sm" onclick="carregarDados().then(renderizarPagina)">${ICONS.refresh} Atualizar</button>
            </div>
        </div>

        <div class="kanban-toolbar">
            <span style="display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:12px; font-weight:600;">
                ${ICONS.filter} Filtros
            </span>
            <label>Classificação</label>
            <select class="form-control" onchange="aplicarFiltro('classification', this.value)">
                <option value="all">Todas</option>
                ${classOptions}
            </select>
            <label>Status</label>
            <select class="form-control" onchange="aplicarFiltro('status', this.value)">
                <option value="all" ${state.filters.status === 'all' ? 'selected' : ''}>Todos</option>
                <option value="pendente" ${state.filters.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                <option value="em_processo" ${state.filters.status === 'em_processo' ? 'selected' : ''}>Em Processo</option>
                <option value="concluido" ${state.filters.status === 'concluido' ? 'selected' : ''}>Concluído</option>
            </select>
            <label>De</label>
            <input type="date" class="form-control" value="${state.filters.startDate}" onchange="aplicarFiltro('startDate', this.value)">
            <label>Até</label>
            <input type="date" class="form-control" value="${state.filters.endDate}" onchange="aplicarFiltro('endDate', this.value)">
            <button class="btn btn-ghost btn-sm" onclick="limparFiltros()">Limpar</button>
        </div>
    `;

    if (isAdmin) {
        const usuarios = state.users.filter(u => u.tipo !== 'admin' && u.ativo !== false);
        if (usuarios.length === 0) {
            html += `<div class="empty-state">${ICONS.users}<h3>Nenhum colaborador cadastrado</h3><p>Cadastre usuários para começar</p></div>`;
        } else {
            usuarios.forEach(user => {
                const jobsUser = jobs.filter(j => j.usuarioId === user.id);
                html += `
                    <div class="kanban-user-block">
                        <div class="kanban-user-header">
                            <div class="user-avatar">${(user.nome || 'U').charAt(0).toUpperCase()}</div>
                            <div class="user-name">${escapeHtml(user.nome)}</div>
                            <div class="user-count">${jobsUser.length} job(s)</div>
                        </div>
                        <div class="kanban-scroll">
                            <div class="kanban-grid">
                                ${dias.map(dia => {
                                    const cards = jobsUser.filter(j => j.dataExecucao === dia.data);
                                    return renderKanbanCol(dia, cards, user.id);
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    } else {
        html += `
            <div class="kanban-scroll">
                <div class="kanban-grid" style="grid-template-columns: repeat(7, minmax(200px, 1fr));">
                    ${dias.map(dia => {
                        const cards = jobs.filter(j => j.dataExecucao === dia.data && j.usuarioId === state.currentUser.id);
                        return renderKanbanCol(dia, cards, state.currentUser.id);
                    }).join('')}
                </div>
            </div>
        `;
    }

    container.innerHTML = html;
}

function renderKanbanCol(dia, cards, userId) {
    return `
        <div class="kanban-col"
             ondragover="permitirDrop(event)" 
             ondragenter="destacarColuna(event)"
             ondragleave="removerDestaque(event)"
             ondrop="soltarJob(event, '${dia.data}', '${userId}')">
            <div class="kanban-col-header ${dia.isToday ? 'today' : ''}">
                <span class="day-abbr">${dia.diaAbrev}</span>
                <span class="day-num">${dia.dataFormatada}</span>
            </div>
            ${cards.map(j => renderCardJob(j)).join('')}
        </div>
    `;
}

function renderCardJob(job) {
    const classificacao = state.classifications.find(c => c.id === job.classificacaoId);
    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';
    const canEdit = isAdmin || job.usuarioId === state.currentUser.id;

    const classTag = classificacao ? `<span class="tag ${classificacao.cor}">${escapeHtml(classificacao.nome)}</span>` : '';
    const statusTag = `<span class="tag tag-status ${job.status}">${STATUS_LABEL[job.status] || job.status}</span>`;

    return `
        <div class="activity-card status-${job.status}" 
             draggable="${canEdit}"
             ondragstart="iniciarDrag(event, '${job.id}')"
             ondragend="finalizarDrag(event)"
             onclick="abrirModalMudancaStatus('${job.id}')">
            <div class="activity-title">${escapeHtml(job.titulo)}</div>
            ${job.descricao ? `<div class="activity-job" style="color:var(--text-muted);">${escapeHtml(job.descricao.substring(0, 60))}${job.descricao.length > 60 ? '...' : ''}</div>` : ''}
            <div class="activity-meta">
                ${classTag}
                ${statusTag}
            </div>
            ${canEdit ? `
                <div class="activity-actions" onclick="event.stopPropagation()">
                    <button title="Avançar etapa" onclick="abrirModalMudancaStatus('${job.id}')">${ICONS.arrowRight}</button>
                    ${isAdmin ? `
                        <button title="Editar" onclick="abrirModalJob('${job.id}')">${ICONS.edit}</button>
                        <button title="Excluir" onclick="excluirJob('${job.id}')">${ICONS.trash}</button>
                    ` : ''}
                </div>
            ` : ''}
        </div>
    `;
}

// ============================================================================
// DRAG & DROP
// ============================================================================
function iniciarDrag(event, jobId) {
    state.draggedJob = jobId;
    event.target.classList.add('dragging');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', jobId);
    event.stopPropagation();
}

function finalizarDrag(event) {
    event.target.classList.remove('dragging');
    document.querySelectorAll('.kanban-col').forEach(col => col.classList.remove('drag-over'));
}

function permitirDrop(event) { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; }
function destacarColuna(event) { event.currentTarget.classList.add('drag-over'); }
function removerDestaque(event) { event.currentTarget.classList.remove('drag-over'); }

async function soltarJob(event, novaData, userId) {
    event.preventDefault();
    event.currentTarget.classList.remove('drag-over');

    const jobId = event.dataTransfer.getData('text/plain') || state.draggedJob;
    if (!jobId) return;

    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';
    if (!isAdmin && job.usuarioId !== state.currentUser.id) {
        mostrarToast('Você só pode mover seus próprios jobs', 'warning');
        return;
    }

    if (job.dataExecucao === novaData && job.usuarioId === userId) return;

    const dataAnterior = job.dataExecucao;
    const userAnterior = job.usuarioId;

    job.dataExecucao = novaData;
    if (isAdmin && userId) job.usuarioId = userId;

    try {
        await fetch(`${FIREBASE_URL}/jobs/${jobId}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                dataExecucao: novaData,
                usuarioId: job.usuarioId
            })
        });
        mostrarToast('Job movido', 'success');
        renderizarPagina();
    } catch (error) {
        console.error('Erro ao mover:', error);
        job.dataExecucao = dataAnterior;
        job.usuarioId = userAnterior;
        mostrarToast('Erro ao mover job', 'error');
    }
    state.draggedJob = null;
}

// ============================================================================
// MODAL: MUDANÇA DE ETAPA (status + classificação + usuário)
// ============================================================================
function abrirModalMudancaStatus(jobId) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';
    const canEdit = isAdmin || job.usuarioId === state.currentUser.id;
    
    if (!canEdit) {
        mostrarToast('Você não pode alterar este job', 'warning');
        return;
    }

    const classifAtual = state.classifications.find(c => c.id === job.classificacaoId);
    const userAtual = state.users.find(u => u.id === job.usuarioId);

    const classOptions = state.classifications.map(c => `
        <div class="classification-option ${c.cor} ${job.classificacaoId === c.id ? 'selected' : ''}" 
             data-class="${c.id}" onclick="selecionarClassificacao('${c.id}')">
            ${escapeHtml(c.nome)}
        </div>
    `).join('');

    const userOptions = state.users.filter(u => u.tipo !== 'admin' && u.ativo !== false).map(u => 
        `<option value="${u.id}" ${job.usuarioId === u.id ? 'selected' : ''}>${escapeHtml(u.nome)}</option>`
    ).join('');

    const modalHtml = `
        <div class="modal-overlay active" id="modalStatus">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <div>
                        <div class="modal-title">${escapeHtml(job.titulo)}</div>
                        <div class="modal-subtitle">Avançar etapa do processo</div>
                    </div>
                    <button class="modal-close" onclick="fecharModal('modalStatus')">${ICONS.close}</button>
                </div>
                <div class="modal-body">
                    ${classifAtual ? `
                        <div class="context-banner">
                            <div class="icon-wrap">${ICONS.arrowRight}</div>
                            <div class="text">
                                <strong>Etapa atual: ${escapeHtml(classifAtual.nome)} — ${STATUS_LABEL[job.status]}</strong>
                                <span>Responsável: ${userAtual ? escapeHtml(userAtual.nome) : 'Não atribuído'}</span>
                            </div>
                        </div>
                    ` : ''}

                    <div class="section-title">Novo Status</div>
                    <div class="stage-options">
                        <div class="stage-option pendente ${job.status === 'pendente' ? 'selected' : ''}" 
                             data-status="pendente" onclick="selecionarStatus('pendente')">
                            <div class="stage-label">Pendente</div>
                            <div class="stage-desc">Aguardando início</div>
                        </div>
                        <div class="stage-option em_processo ${job.status === 'em_processo' ? 'selected' : ''}" 
                             data-status="em_processo" onclick="selecionarStatus('em_processo')">
                            <div class="stage-label">Em Processo</div>
                            <div class="stage-desc">Em execução</div>
                        </div>
                        <div class="stage-option concluido ${job.status === 'concluido' ? 'selected' : ''}" 
                             data-status="concluido" onclick="selecionarStatus('concluido')">
                            <div class="stage-label">Concluído</div>
                            <div class="stage-desc">Finalizado</div>
                        </div>
                    </div>

                    <div class="section-title">Nova Classificação</div>
                    <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
                        Ao concluir uma etapa, você pode encaminhar o job para outro setor. Ex: Redação → Direção de Arte.
                    </p>
                    <div class="classification-options">
                        <div class="classification-option tag-outro ${!job.classificacaoId ? 'selected' : ''}" 
                             data-class="" onclick="selecionarClassificacao('')">
                            Sem classificação
                        </div>
                        ${classOptions}
                    </div>

                    ${isAdmin ? `
                        <div class="section-title">Reatribuir Responsável</div>
                        <div class="form-group">
                            <select class="form-control" id="mudancaUsuario">
                                ${userOptions}
                            </select>
                            <div class="form-hint">O job passará a aparecer para o novo responsável no kanban.</div>
                        </div>
                    ` : ''}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalStatus')">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarMudancaStatus('${job.id}')">
                        ${ICONS.check} Confirmar Alteração
                    </button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    window._mudancaStatus = { status: job.status, classificacaoId: job.classificacaoId || '' };
}

function selecionarStatus(status) {
    window._mudancaStatus.status = status;
    document.querySelectorAll('.stage-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.status === status);
    });
}

function selecionarClassificacao(classId) {
    window._mudancaStatus.classificacaoId = classId;
    document.querySelectorAll('.classification-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.class === classId);
    });
}

async function salvarMudancaStatus(jobId) {
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    const novoStatus = window._mudancaStatus.status;
    const novaClassif = window._mudancaStatus.classificacaoId;
    const isAdmin = state.currentUser && state.currentUser.tipo === 'admin';

    const updates = {
        status: novoStatus,
        classificacaoId: novaClassif || null,
        atualizadoEm: new Date().toISOString()
    };

    if (isAdmin) {
        const userSelect = document.getElementById('mudancaUsuario');
        if (userSelect && userSelect.value) {
            updates.usuarioId = userSelect.value;
        }
    }

    try {
        await fetch(`${FIREBASE_URL}/jobs/${jobId}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updates)
        });

        Object.assign(job, updates);

        fecharModal('modalStatus');
        mostrarToast('Job atualizado com sucesso', 'success');
        renderizarPagina();
    } catch (error) {
        console.error('Erro:', error);
        mostrarToast('Erro ao atualizar job', 'error');
    }
}

                </div>
                <div class="modal-body">
                    <div class="section-title">Informações Básicas</div>
                    <div class="form-group">
                        <label>Título <span class="required">*</span></label>
                        <input type="text" class="form-control" id="jobTitulo" value="${job ? escapeHtml(job.titulo) : ''}" placeholder="Ex: Criar banner para redes sociais">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea class="form-control" id="jobDescricao" placeholder="Descreva o job...">${job ? escapeHtml(job.descricao || '') : ''}</textarea>
                    </div>

                    <div class="section-title">Vínculos</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Classificação</label>
                            <select class="form-control" id="jobClassificacao">
                                <option value="">Sem classificação</option>
                                ${classOptions}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Responsável <span class="required">*</span></label>
                            <select class="form-control" id="jobUsuario" ${!isAdmin ? 'disabled' : ''}>
                                <option value="">Selecione</option>
                                ${userOptions}
                            </select>
                            ${!isAdmin ? '<div class="form-hint">Você está criando para si mesmo</div>' : ''}
                        </div>
                    </div>

                    <div class="section-title">Prazos e Status</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Data de Execução <span class="required">*</span></label>
                            <input type="date" class="form-control" id="jobData" value="${job ? job.dataExecucao : new Date().toISOString().split('T')[0]}">
                            <div class="form-hint">Data em que será executado (alterável arrastando o card)</div>
                        </div>
                        <div class="form-group">
                            <label>Prazo (Deadline)</label>
                            <input type="date" class="form-control" id="jobPrazo" value="${job ? (job.prazo || '') : ''}">
                            <div class="form-hint">Prazo final (não muda ao arrastar o card)</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Status</label>
                            <select class="form-control" id="jobStatus">
                                <option value="pendente" ${job && job.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                                <option value="em_processo" ${job && job.status === 'em_processo' ? 'selected' : ''}>Em Processo</option>
                                <option value="concluido" ${job && job.status === 'concluido' ? 'selected' : ''}>Concluído</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalJob')">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarJob('${job ? job.id : ''}')">
                        ${ICONS.check} ${job ? 'Salvar Alterações' : 'Criar Job'}
                    </button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    setTimeout(() => document.getElementById('jobTitulo')?.focus(), 50);
}

async function salvarJob(jobId) {
    const titulo = document.getElementById('jobTitulo').value.trim();
    const descricao = document.getElementById('jobDescricao').value.trim();
    const classificacaoId = document.getElementById('jobClassificacao').value;
    const usuarioId = document.getElementById('jobUsuario').value;
    const dataExecucao = document.getElementById('jobData').value;
    const prazo = document.getElementById('jobPrazo').value;
    const status = document.getElementById('jobStatus').value;

    if (!titulo || !usuarioId || !dataExecucao) {
        mostrarToast('Preencha os campos obrigatórios', 'warning');
        return;
    }

    const job = {
        id: jobId || 'job_' + Date.now(),
        titulo,
        descricao,
        classificacaoId: classificacaoId || null,
        usuarioId,
        dataExecucao,
        prazo: prazo || null,
        status,
        atualizadoEm: new Date().toISOString()
    };

    if (!jobId) {
        job.criadoEm = new Date().toISOString();
        job.criadoPor = state.currentUser.id;
    }

    try {
        await fetch(`${FIREBASE_URL}/jobs/${job.id}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(job)
        });

        const idx = state.jobs.findIndex(j => j.id === job.id);
        if (idx >= 0) state.jobs[idx] = job;
        else state.jobs.push(job);

        fecharModal('modalJob');
        mostrarToast(jobId ? 'Job atualizado' : 'Job criado', 'success');
        renderizarPagina();
    } catch (error) {
        console.error('Erro:', error);
        mostrarToast('Erro ao salvar job', 'error');
    }
}

async function excluirJob(id) {
    if (!confirm('Excluir este job?')) return;
    try {
        await fetch(`${FIREBASE_URL}/jobs/${id}.json`, { method: 'DELETE' });
        state.jobs = state.jobs.filter(j => j.id !== id);
        mostrarToast('Job excluído', 'success');
        renderizarPagina();
    } catch (error) {
        mostrarToast('Erro ao excluir job', 'error');
    }
}

async function salvarUsuarioModal(userId) {
    const nome = document.getElementById('usuarioNome').value.trim();
    const username = document.getElementById('usuarioUsername').value.trim().toLowerCase();
    const tipo = document.getElementById('usuarioTipo').value;
    const ativo = document.getElementById('usuarioAtivo').value === 'true';

    if (!nome || !username) { mostrarToast('Preencha os campos obrigatórios', 'warning'); return; }

    const user = {
        id: userId || 'user_' + Date.now(),
        nome, username, tipo, ativo,
        atualizadoEm: new Date().toISOString()
    };
    if (!userId) user.criadoEm = new Date().toISOString();

    try {
        await fetch(`${FIREBASE_URL}/usuarios/${user.id}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user)
        });

        const idx = state.users.findIndex(u => u.id === user.id);
        if (idx >= 0) state.users[idx] = user;
        else state.users.push(user);

        fecharModal('modalUsuario');
        mostrarToast(userId ? 'Usuário atualizado' : 'Usuário criado', 'success');
        renderizarPagina();
    } catch (error) {
        mostrarToast('Erro ao salvar usuário', 'error');
    }
}

async function excluirUsuario(id) {
    if (!confirm('Excluir este usuário?')) return;
    try {
        await fetch(`${FIREBASE_URL}/usuarios/${id}.json`, { method: 'DELETE' });

        mostrarToast('Usuário excluído', 'success');
        renderizarPagina();
    } catch (error) {
        mostrarToast('Erro ao excluir', 'error');

// ============================================================================
// FILTERS

function aplicarFiltro(tipo, valor) {
    state.filters[tipo] = valor;
    renderizarPagina();
}

function limparFiltros() {
    state.filters = { classification: 'all', startDate: '', endDate: '', status: 'all' };
    renderizarPagina();
}

// ============================================================================
// UTILS
// ============================================================================
function fecharModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.remove();
}

function mostrarToast(mensagem, tipo = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;

    const icons = { success: ICONS.check, error: ICONS.close, warning: ICONS.alert, info: ICONS.info };
    toast.innerHTML = `${icons[tipo] || ICONS.info}<span>${escapeHtml(mensagem)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(40px)';
        toast.style.transition = 'all 0.25s';
        setTimeout(() => toast.remove(), 250);
    }, 2800);
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) e.target.remove();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    }
});
</script>
