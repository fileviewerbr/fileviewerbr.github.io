    const modalHtml = `
        <div class="modal-overlay active" id="modalJob">
            <div class="modal">
                <div class="modal-header">
                    <div>
                        <div class="modal-title">${job ? 'Editar Job' : 'Novo Job'}</div>
                        <div class="modal-subtitle">${job ? 'Atualize as informações do job' : 'Cadastre um novo job'}</div>
                    </div>
                    <button class="modal-close" onclick="fecharModal('modalJob')">${ICONS.close}</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Título <span class="required">*</span></label>
                        <input type="text" class="form-control" id="jobTitulo" value="${job ? escapeHtml(job.titulo) : ''}" placeholder="Ex: Campanha de Marketing">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea class="form-control" id="jobDescricao" placeholder="Descrição detalhada do job...">${job ? escapeHtml(job.descricao || '') : ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Prazo do Job</label>
                        <input type="date" class="form-control" id="jobPrazo" value="${job ? (job.prazo || '') : ''}">
                        <div class="form-hint">O prazo do job é independente das datas das atividades</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalJob')">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarJob('${job ? job.id : ''}')">
                        ${ICONS.check} ${job ? 'Salvar' : 'Criar Job'}
                    </button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    setTimeout(() => document.getElementById('jobTitulo')?.focus(), 50);
}

async function salvarJob(jobId) {
    const titulo = document.getElementById('jobTitulo').value.trim();
    const descricao = document.getElementById('jobDescricao').value.trim();
    const prazo = document.getElementById('jobPrazo').value;

    if (!titulo) { mostrarToast('Digite o título do job', 'warning'); return; }

    const job = {
        id: jobId || 'job_' + Date.now(),
        titulo,
        descricao,
        prazo: prazo || null,
        atualizadoEm: new Date().toISOString()
    };

    if (!jobId) {
        job.criadoEm = new Date().toISOString();
        job.criadoPor = state.currentUser.id;
    }

    try {
        await fetch(`${FIREBASE_URL}/jobs/${job.id}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(job)
        });

        const idx = state.jobs.findIndex(j => j.id === job.id);
        if (idx >= 0) state.jobs[idx] = job;
        else state.jobs.push(job);

        fecharModal('modalJob');
        mostrarToast(jobId ? 'Job atualizado' : 'Job criado', 'success');
        renderizarPagina();
    } catch (error) {
        mostrarToast('Erro ao salvar job', 'error');
    }
}

async function excluirJob(id) {
    const atvs = state.activities.filter(a => a.jobId === id);
    let msg = 'Excluir este job?';
    if (atvs.length > 0) msg = `Este job possui ${atvs.length} atividade(s) vinculada(s). Excluir mesmo assim? As atividades também serão removidas.`;
    if (!confirm(msg)) return;

    try {
        for (const a of atvs) {
            await fetch(`${FIREBASE_URL}/atividades/${a.id}.json`, { method: 'DELETE' });
        }
        state.activities = state.activities.filter(a => a.jobId !== id);
        await fetch(`${FIREBASE_URL}/jobs/${id}.json`, { method: 'DELETE' });
        state.jobs = state.jobs.filter(j => j.id !== id);
        mostrarToast('Job excluído', 'success');
        renderizarPagina();
    } catch (error) {
        mostrarToast('Erro ao excluir job', 'error');
    }
}

function verJob(jobId) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    const atvs = state.activities.filter(a => a.jobId === jobId);
    const membros = [...new Set(atvs.map(a => a.usuarioId))];

    const modalHtml = `
        <div class="modal-overlay active" id="modalVerJob">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <div>
                        <div class="modal-title">${escapeHtml(job.titulo)}</div>
                        <div class="modal-subtitle">Visualização do job e atividades vinculadas</div>
                    </div>
                    <button class="modal-close" onclick="fecharModal('modalVerJob')">${ICONS.close}</button>
                </div>
                <div class="modal-body">
                    <div class="section-title">Descrição</div>
                    <p style="font-size:13.5px; color:var(--text-secondary); margin-bottom:16px;">${escapeHtml(job.descricao || 'Sem descrição')}</p>

                    <div class="section-title">Prazo</div>
                    <p style="font-size:13.5px; color:var(--text-secondary); margin-bottom:16px;">${job.prazo || 'Sem prazo definido'}</p>

                    <div class="section-title">Membros Responsáveis (${membros.length})</div>
                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;">
                        ${membros.length === 0 ? '<p class="text-muted" style="font-size:12.5px;">Nenhum membro atribuído</p>' : 
                            membros.map(m => {
                                const u = state.users.find(u => u.id === m);
                                return `<span class="chip">${escapeHtml(u ? u.nome : 'Desconhecido')}</span>`;
                            }).join('')}
                    </div>

                    <div class="section-title">Atividades (${atvs.length})</div>
                    ${atvs.length === 0 ? '<p class="text-muted" style="font-size:12.5px;">Nenhuma atividade vinculada</p>' : `
                        <table class="data-table">
                            <thead>
                                <tr><th>Nome</th><th>Responsável</th><th>Execução</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                                ${atvs.map(a => {
                                    const u = state.users.find(u => u.id === a.usuarioId);
                                    return `<tr>
                                        <td>${escapeHtml(a.nome)}</td>
                                        <td>${u ? escapeHtml(u.nome) : '—'}</td>
                                        <td>${a.dataExecucao}</td>
                                        <td><span class="tag tag-status ${a.status}">${STATUS_LABEL[a.status]}</span></td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    `}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalVerJob')">Fechar</button>
                    <button class="btn btn-primary" onclick="fecharModal('modalVerJob'); novaAtividadeDoJob('${job.id}')">
                        ${ICONS.plus} Nova Atividade neste Job
                    </button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

        id: userId || 'user_' + Date.now(),

        username,
        tipo,
        ativo,
        atualizadoEm: new Date().toISOString()
    };
    if (!userId) user.criadoEm = new Date().toISOString();

    try {
        await fetch(`${FIREBASE_URL}/usuarios/${user.id}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user)
        });

        const idx = state.users.findIndex(u => u.id === user.id);
        if (idx >= 0) state.users[idx] = user;

        fecharModal('modalUsuario');
        mostrarToast(userId ? 'Usuário atualizado' : 'Usuário criado', 'success');

// FILTROS
// ============================================================================
function aplicarFiltro(tipo, valor) {
    state.filters[tipo] = valor;
    renderizarPagina();
}

function limparFiltros() {
    state.filters = { job: 'all', classification: 'all', startDate: '', endDate: '', status: 'all' };
    renderizarPagina();
}

// ============================================================================
// UTILITÁRIOS
// ============================================================================
function fecharModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.remove();
}

function mostrarToast(mensagem, tipo = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;

    const icons = { success: ICONS.check, error: ICONS.close, warning: ICONS.alert, info: ICONS.info };
    toast.innerHTML = `${icons[tipo] || ICONS.info}<span>${escapeHtml(mensagem)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(40px)';
        toast.style.transition = 'all 0.25s';
        setTimeout(() => toast.remove(), 250);
    }, 2800);
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

// Fechar modais clicando fora e com ESC
document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) e.target.remove();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    }
});
</script>
