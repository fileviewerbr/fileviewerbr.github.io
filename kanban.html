// PÁGINA JOBS
// ============================================================================
function renderJobs(container) {
    let jobsFiltrados = [...state.jobs];
    if (state.jobsFilters.classification !== 'all') jobsFiltrados = jobsFiltrados.filter(j => j.classificacaoId === state.jobsFilters.classification);
    if (state.jobsFilters.status !== 'all') jobsFiltrados = jobsFiltrados.filter(j => j.status === state.jobsFilters.status);
    if (state.jobsFilters.gestor !== 'all') jobsFiltrados = jobsFiltrados.filter(j => j.gestorId === state.jobsFilters.gestor);
    jobsFiltrados.sort((a, b) => (b.dataExecucao || '').localeCompare(a.dataExecucao || ''));

    const classOptions = state.classifications.map(c => `<option value="${c.id}" ${state.jobsFilters.classification === c.id ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`).join('');
    const gestores = getGestores();
    const gestorOptions = gestores.map(g => `<option value="${g.id}" ${state.jobsFilters.gestor === g.id ? 'selected' : ''}>${escapeHtml(g.nome)}</option>`).join('');

    container.innerHTML = `
        <div class="content-header">
            <div>
                <div class="page-title">Jobs</div>
                <div class="page-subtitle">Todos os jobs (${jobsFiltrados.length} de ${state.jobs.length})</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary btn-sm" onclick="abrirModalJobFromCalendar('${formatISODate(new Date())}')">${ICONS.plus} Novo Job</button>
                <button class="btn btn-secondary btn-sm" onclick="recarregar()">${ICONS.refresh} Atualizar</button>
            </div>
        </div>

        <div class="calendar-toolbar">
            <span style="display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:12px; font-weight:600;">${ICONS.filter} Filtros</span>
            <label>Classificação</label>
            <select class="form-control" onchange="aplicarFiltroJobs('classification', this.value)">
                <option value="all">Todas</option>
                ${classOptions}
            </select>
            <label>Status</label>
            <select class="form-control" onchange="aplicarFiltroJobs('status', this.value)">
                <option value="all" ${state.jobsFilters.status === 'all' ? 'selected' : ''}>Todos</option>
                <option value="pendente" ${state.jobsFilters.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                <option value="concluido" ${state.jobsFilters.status === 'concluido' ? 'selected' : ''}>Concluído</option>
            </select>
            <label>Gestor</label>
            <select class="form-control" onchange="aplicarFiltroJobs('gestor', this.value)">
                <option value="all">Todos</option>
                ${gestorOptions}
            </select>
            <button class="btn btn-ghost btn-sm" onclick="limparFiltrosJobs()">Limpar</button>
        </div>

        ${jobsFiltrados.length === 0 ? `
            <div class="empty-state">${ICONS.jobs}<h3>Nenhum job encontrado</h3><p>Ajuste os filtros ou cadastre um novo job</p></div>
        ` : `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Profissional</th>
                        <th>Gestor</th>
                        <th>Classificação</th>
                        <th>Status</th>
                        <th style="width:150px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    ${jobsFiltrados.map(job => {
                        const prof = state.users.find(u => u.id === job.usuarioId);
                        const gestor = state.users.find(u => u.id === job.gestorId);
                        const classif = state.classifications.find(c => c.id === job.classificacaoId);
                        const dur = parseFloat(job.duracaoHoras) || 0;
                        const fim = (parseFloat(job.horaInicio) || 0) + dur;
                        return `
                            <tr>
                                <td class="cell-muted">${job.numero ? '#' + escapeHtml(job.numero) : '—'}</td>
                                <td class="cell-strong">
                                    ${escapeHtml(job.titulo)}
                                    ${job.isCopy ? `<span class="tag tag-outro" style="margin-left:6px;">${job.isReopen ? 'Reaberto' : 'Cópia'}</span>` : ''}
                                </td>
                                <td>${job.dataExecucao || '—'}</td>
                                <td>${formatHour(job.horaInicio)} - ${formatHour(fim)}</td>
                                <td>${prof ? escapeHtml(prof.nome) : '—'}</td>
                                <td class="cell-muted">${gestor ? escapeHtml(gestor.nome) : '—'}</td>
                                <td>${classif ? `<span class="tag ${classif.cor}">${escapeHtml(classif.nome)}</span>` : '<span class="cell-muted">—</span>'}</td>
                                <td><span class="tag tag-status ${job.status}">${STATUS_LABEL[job.status]}</span></td>
                                <td>
                                    <div class="cell-actions">
                                        <button class="btn btn-xs btn-secondary" onclick="abrirAcaoJob('${job.id}')" title="Abrir">${ICONS.eye}</button>
                                        <button class="btn btn-xs btn-primary" onclick="abrirModalJob('${job.id}')" title="Editar">${ICONS.edit}</button>
                                        <button class="btn btn-xs btn-danger" onclick="excluirJob('${job.id}')" title="Excluir">${ICONS.trash}</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `}
    `;
}

function aplicarFiltroJobs(tipo, valor) { state.jobsFilters[tipo] = valor; renderizarPagina(); }
function limparFiltrosJobs() { state.jobsFilters = { classification: 'all', status: 'all', gestor: 'all' }; renderizarPagina(); }

                            <td>${u.ativo !== false ? '<span class="tag" style="background:var(--success-bg); color:var(--success);">Ativo</span>' : '<span class="tag" style="background:var(--danger-bg); color:var(--danger);">Inativo</span>'}</td>
                            <td>

                                    ${u.tipo !== 'admin' ? `<button class="btn btn-xs btn-danger" onclick="excluirUsuario('${u.id}')">${ICONS.trash}</button>` : ''}
                                </div>

        container.innerHTML = state.classifications.length === 0 ? `

        ` : `
            <table class="data-table">

                                </div>

                    `).join('')}

        `;
    }
}

                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nome Completo <span class="required">*</span></label>

                    <div class="form-group">
                        <label>Cargo / Função</label>

                            <option value="Redação" ${user && user.cargo === 'Redação' ? 'selected' : ''}>Redação</option>
                            <option value="Design" ${user && user.cargo === 'Design' ? 'selected' : ''}>Design</option>
                            <option value="Outro" ${user && user.cargo === 'Outro' ? 'selected' : ''}>Outro</option>
                            <option value="Atendimento" ${user && user.cargo === 'Atendimento' ? 'selected' : ''}>Atendimento</option>
                            <option value="Administrador" ${user && user.cargo === 'Administrador' ? 'selected' : ''}>Administrador</option>

                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select class="form-control" id="usuarioAtivo">
                            <option value="true" ${!user || user.ativo !== false ? 'selected' : ''}>Ativo</option>
                            <option value="false" ${user && user.ativo === false ? 'selected' : ''}>Inativo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalUsuario')">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarUsuarioModal('${user ? user.id : ''}')">${ICONS.check} Salvar</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    setTimeout(() => document.getElementById('usuarioNome')?.focus(), 50);
}

async function salvarUsuarioModal(userId) {
    const nome = document.getElementById('usuarioNome').value.trim();
    const username = document.getElementById('usuarioUsername').value.trim().toLowerCase();
    const tipo = document.getElementById('usuarioTipo').value;
    const cargo = document.getElementById('usuarioCargo').value.trim();
    const ativo = document.getElementById('usuarioAtivo').value === 'true';

    if (!nome || !username) { mostrarToast('Preencha os campos obrigatórios', 'warning'); return; }

    await comLoading(async () => {
        const user = {
            id: userId || 'user_' + Date.now(),
            nome, username, cargo, tipo, ativo,
            atualizadoEm: new Date().toISOString()
        };
        if (!userId) user.criadoEm = new Date().toISOString();

        try {
            await fetch(`${FIREBASE_URL}/usuarios/${user.id}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });
            fecharModal('modalUsuario');
            await carregarDados();
            renderizarPagina();
            mostrarToast(userId ? 'Usuário atualizado' : 'Usuário criado', 'success');
        } catch (error) {
            mostrarToast('Erro ao salvar usuário', 'error');
        }
    });
}

async function excluirUsuario(id) {
    if (!confirm('Excluir este usuário?')) return;
    await comLoading(async () => {
        try {
            await fetch(`${FIREBASE_URL}/usuarios/${id}.json`, { method: 'DELETE' });
            await carregarDados();
            renderizarPagina();
            mostrarToast('Usuário excluído', 'success');
        } catch (error) {
            mostrarToast('Erro ao excluir', 'error');
        }
    });
}

async function salvarClassificacao(classId) {
    const nome = document.getElementById('classNome').value.trim();
    const cor = document.getElementById('classCor').value;
    if (!nome) { mostrarToast('Digite o nome', 'warning'); return; }

    await comLoading(async () => {
        const classif = { id: classId || 'class_' + Date.now(), nome, cor };
        try {
            await fetch(`${FIREBASE_URL}/classificacoes/${classif.id}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(classif)
            });
            fecharModal('modalClassificacao');
            await carregarDados();
            renderizarPagina();
            mostrarToast(classId ? 'Classificação atualizada' : 'Classificação criada', 'success');
        } catch (error) {
            mostrarToast('Erro ao salvar', 'error');
        }
    });
}

async function excluirClassificacao(id) {
    if (!confirm('Excluir esta classificação?')) return;
    await comLoading(async () => {
        try {
            await fetch(`${FIREBASE_URL}/classificacoes/${id}.json`, { method: 'DELETE' });
            await carregarDados();
            renderizarPagina();
            mostrarToast('Classificação excluída', 'success');
        } catch (error) {
            mostrarToast('Erro ao excluir', 'error');
        }
    });
}

// ============================================================================
// UTILS
// ============================================================================
function fecharModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.remove();
}

function mostrarToast(mensagem, tipo = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;
    const icons = { success: ICONS.check, error: ICONS.close, warning: ICONS.alert, info: ICONS.info };
    toast.innerHTML = `${icons[tipo] || ICONS.info}<span>${escapeHtml(mensagem)}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(40px)';
        toast.style.transition = 'all 0.25s';
        setTimeout(() => toast.remove(), 250);
    }, 2800);
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) e.target.remove();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    }
});
</script>
