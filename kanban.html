<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestJobs — Sistema de Gerenciamento</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-sidebar: #1e293b;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --success: #059669;
            --success-bg: #d1fae5;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --info: #0284c7;
            --info-bg: #e0f2fe;
            --purple: #7c3aed;
            --purple-bg: #ede9fe;
            --cal-free: #10b981;
            --cal-partial: #f59e0b;
            --cal-full: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .app-container { display: flex; width: 100%; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            border-right: 1px solid #334155;
        }
        .sidebar-brand { padding: 18px 20px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
        .brand-logo {
            width: 140px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            flex-shrink: 0;
        }
        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .brand-text h2 { font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.3px; }
        .brand-text p { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
        .sidebar-section { padding: 18px 16px 8px; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; }
        .sidebar-nav { flex: 1; padding: 4px 12px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; transition: all 0.15s; border-radius: 6px; color: #cbd5e1; font-size: 13.5px; font-weight: 500; margin-bottom: 2px; user-select: none; }
        .nav-item:hover { background: #334155; color: #f1f5f9; }
        .nav-item.active { background: var(--primary); color: #ffffff; }
        .nav-item svg { margin-right: 10px; width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
        .nav-item.has-sub { justify-content: flex-start; }
        .nav-item .nav-caret { margin-left: auto; transition: transform 0.2s; width: 12px !important; height: 12px !important; }
        .nav-item .nav-caret.open { transform: rotate(90deg); }
        .sub-nav { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; padding-left: 12px; }
        .sub-nav.open { max-height: 200px; }
        .sub-nav-item { display: flex; align-items: center; padding: 8px 12px 8px 40px; cursor: pointer; transition: all 0.15s; border-radius: 6px; color: #94a3b8; font-size: 13px; font-weight: 500; margin-bottom: 2px; user-select: none; position: relative; }
        .sub-nav-item::before { content: ''; position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 4px; height: 4px; border-radius: 50%; background: #475569; }
        .sub-nav-item:hover { background: #334155; color: #f1f5f9; }
        .sub-nav-item.active { background: #334155; color: #ffffff; }
        .sub-nav-item.active::before { background: var(--primary-light); }
        .sidebar-footer { padding: 16px; border-top: 1px solid #334155; }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .user-avatar { width: 34px; height: 34px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: white; flex-shrink: 0; }
        .user-details { flex: 1; min-width: 0; }
        .user-details .name { font-size: 13px; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-details .role { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; }

        /* MAIN */
        .main-content { flex: 1; margin-left: 240px; padding: 24px 28px; min-height: 100vh; min-width: 0; }
        .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; }
        .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* BUTTONS */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: all 0.15s; white-space: nowrap; text-decoration: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn svg { width: 14px; height: 14px; stroke-width: 2.2; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--text-primary); border-color: var(--border); }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-success { background: var(--success); color: white; border-color: var(--success); }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }
        .btn-ghost { background: transparent; color: var(--text-secondary); border-color: transparent; padding: 6px 8px; }
        .btn-ghost:hover { background: #f1f5f9; color: var(--text-primary); }
        .btn-sm { padding: 6px 10px; font-size: 12px; }
        .btn-xs { padding: 4px 7px; font-size: 11px; }
        .btn-xs svg { width: 12px; height: 12px; }
        .btn-block { width: 100%; justify-content: center; }

        /* FORMS */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.1px; }
        .form-group label .required { color: var(--danger); margin-left: 2px; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px; font-family: inherit; color: var(--text-primary); background: white; transition: all 0.15s; }
        .form-control:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-control:disabled { background: #f8fafc; color: var(--text-muted); cursor: not-allowed; }
        textarea.form-control { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

        /* TABLES */
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); font-size: 13px; }
        .data-table thead th { background: #f8fafc; padding: 11px 14px; text-align: left; font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        .data-table tbody td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: var(--text-primary); vertical-align: middle; }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .data-table tbody tr:hover td { background: #fafbfc; }
        .data-table .cell-strong { font-weight: 600; }
        .data-table .cell-muted { color: var(--text-muted); font-size: 12.5px; }
        .data-table .cell-actions { display: flex; gap: 4px; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: flex-start; padding: 40px 16px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(15,23,42,0.3); animation: modalIn 0.2s ease; overflow: hidden; }
        .modal.modal-lg { max-width: 900px; }
        .modal.modal-xl { max-width: 1200px; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .modal-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
        .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .modal-close { background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .modal-close:hover { background: #e2e8f0; color: var(--text-primary); }
        .modal-close svg { width: 16px; height: 16px; stroke-width: 2.2; }
        .modal-body { padding: 22px 24px; max-height: 70vh; overflow-y: auto; }
        .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: #f8fafc; }

        .section-title { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .section-title:first-child { margin-top: 0; }

        /* CONTEXT BANNER */
        .context-banner { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .context-banner.warn { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-color: #fcd34d; }
        .context-banner.success { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-color: #6ee7b7; }
        .context-banner.danger { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); border-color: #fca5a5; }
        .context-banner .icon-wrap { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .context-banner.warn .icon-wrap { background: var(--warning); }
        .context-banner.success .icon-wrap { background: var(--success); }
        .context-banner.danger .icon-wrap { background: var(--danger); }
        .context-banner .icon-wrap svg { width: 16px; height: 16px; stroke-width: 2.2; }
        .context-banner .text { flex: 1; min-width: 0; }
        .context-banner .text strong { font-size: 13px; color: var(--primary-dark); display: block; }
        .context-banner.warn .text strong { color: #92400e; }
        .context-banner.success .text strong { color: #065f46; }
        .context-banner.danger .text strong { color: #991b1b; }
        .context-banner .text span { font-size: 12px; color: var(--text-secondary); }

        /* LOGIN */
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); padding: 20px; }
        .login-box { background: white; padding: 36px 32px; border-radius: 14px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); width: 100%; max-width: 380px; }
        .login-brand { text-align: center; margin-bottom: 28px; }
        .login-brand .brand-logo { width: 160px; height: 60px; margin: 0 auto 14px; background: #0f172a; }
        .login-brand h1 { font-size: 19px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; }
        .login-brand p { color: var(--text-muted); font-size: 12.5px; margin-top: 4px; }
        .login-error { color: var(--danger); font-size: 12.5px; margin-top: 10px; padding: 8px 12px; background: var(--danger-bg); border-radius: 6px; display: none; }

        /* TOAST */
        .toast-container { position: fixed; top: 18px; right: 18px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(15,23,42,0.15); animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 380px; background: white; border-left: 4px solid var(--info); color: var(--text-primary); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.toast-success { border-left-color: var(--success); }
        .toast.toast-error { border-left-color: var(--danger); }
        .toast.toast-warning { border-left-color: var(--warning); }
        .toast.toast-info { border-left-color: var(--info); }
        .toast svg { width: 16px; height: 16px; flex-shrink: 0; }
        .toast.toast-success svg { color: var(--success); }
        .toast.toast-error svg { color: var(--danger); }
        .toast.toast-warning svg { color: var(--warning); }
        .toast.toast-info svg { color: var(--info); }

        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); background: white; border: 1px dashed var(--border); border-radius: 10px; }
        .empty-state svg { width: 40px; height: 40px; color: #cbd5e1; margin-bottom: 12px; stroke-width: 1.5; }
        .empty-state h3 { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; }
        .empty-state p { font-size: 13px; }

        /* TAGS */
        .tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; letter-spacing: 0.2px; white-space: nowrap; }
        .tag-direcao { background: var(--purple-bg); color: var(--purple); }
        .tag-redacao { background: var(--success-bg); color: var(--success); }
        .tag-design { background: var(--warning-bg); color: var(--warning); }
        .tag-outro { background: #f1f5f9; color: var(--text-secondary); }
        .tag-status { text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.5px; }
        .tag-status.pendente { background: var(--warning-bg); color: var(--warning); }
        .tag-status.concluido { background: var(--success-bg); color: var(--success); }

        /* CALENDÁRIO */
        .calendar-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; padding: 12px 16px; background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); }
        .calendar-toolbar .form-control { width: auto; min-width: 150px; padding: 7px 10px; font-size: 13px; }
        .calendar-toolbar label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-right: -6px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 14px 20px; background: white; border: 1px solid var(--border); border-radius: 10px; }
        .calendar-month-label { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; text-transform: capitalize; min-width: 200px; text-align: center; }
        .calendar-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--text-secondary); }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
        .legend-dot.free { background: var(--cal-free); }
        .legend-dot.partial { background: var(--cal-partial); }
        .legend-dot.full { background: var(--cal-full); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .calendar-weekday { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 0; }
        .calendar-day { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 130px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .calendar-day:hover { box-shadow: 0 6px 16px rgba(15,23,42,0.1); transform: translateY(-2px); border-color: #cbd5e1; }
        .calendar-day.other-month { background: #fafbfc; opacity: 0.5; }
        .calendar-day.today { border-color: var(--primary); border-width: 2px; padding: 11px; }
        .calendar-day .day-number { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .calendar-day.other-month .day-number { color: var(--text-muted); }
        .calendar-day .day-hours { font-size: 11px; color: var(--text-secondary); font-weight: 600; margin-top: auto; display: flex; flex-direction: column; gap: 3px; }
        .calendar-day .day-hours .hours-value { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
        .calendar-day .day-hours .hours-line { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 2px 0; }
        .calendar-day .day-hours .hours-line .label { font-size: 10.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .calendar-day .day-hours .hours-line .value { font-size: 11.5px; font-weight: 700; }
        .calendar-day .day-hours .hours-line.redacao .value { color: var(--success); }
        .calendar-day .day-hours .hours-line.direcao .value { color: var(--purple); }
        .calendar-day .day-status-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; }
        .calendar-day.status-free .day-status-bar { background: var(--cal-free); }
        .calendar-day.status-partial .day-status-bar { background: var(--cal-partial); }
        .calendar-day.status-full .day-status-bar { background: var(--cal-full); }
        .calendar-day .day-jobs-count { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #f1f5f9; color: var(--text-secondary); margin-bottom: 4px; align-self: flex-start; }
        .calendar-day.status-free .day-jobs-count { background: var(--success-bg); color: var(--success); }
        .calendar-day.status-partial .day-jobs-count { background: var(--warning-bg); color: var(--warning); }
        .calendar-day.status-full .day-jobs-count { background: var(--danger-bg); color: var(--danger); }

        /* GRADE DO DIA */
        .day-schedule { display: grid; grid-template-columns: 80px repeat(var(--pros-count, 1), minmax(130px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 12px; }
        .day-schedule-cell { background: white; padding: 8px 10px; min-height: 42px; position: relative; }
        .day-schedule-header {
            background: #f8fafc;
            font-weight: 700;
            font-size: 11.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 6px;
        }
        .day-schedule-header.cargo-group-0 { background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%); color: var(--text-secondary); }
        .day-schedule-header.cargo-group-1 { background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%); color: var(--text-primary); }
        .day-schedule-header.cargo-divider-left { border-left: 2px solid #64748b; }
        .day-schedule-time { background: #f8fafc; font-weight: 700; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 11.5px; letter-spacing: 0.3px; }
        .day-schedule-time.lunch { background: #fef3c7; color: #92400e; font-style: italic; }
        .schedule-job { background: #eff6ff; border-left: 3px solid var(--primary); padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--primary-dark); cursor: pointer; line-height: 1.3; transition: all 0.15s; position: relative; }
        .schedule-job:hover { background: #dbeafe; }
        .schedule-job.status-pendente { background: var(--warning-bg); border-left-color: var(--warning); color: #92400e; }
        .schedule-job.status-concluido { background: var(--success-bg); border-left-color: var(--success); color: #065f46; }
        .schedule-job.is-copy::after { content: 'CÓPIA'; position: absolute; top: 4px; right: 4px; background: rgba(124,58,237,0.15); color: var(--purple); font-size: 8px; font-weight: 800; padding: 1px 5px; border-radius: 3px; letter-spacing: 0.5px; }
        .schedule-job-title { font-size: 11px; font-weight: 700; display: block; }
        .schedule-job-numero { font-size: 9.5px; opacity: 0.75; font-weight: 600; display: block; margin-bottom: 2px; }
        .schedule-job-hours { font-size: 10px; opacity: 0.8; font-weight: 600; display: block; margin-top: 2px; }

        /* JOB PICKER */
        .job-picker-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: #fafbfc; }
        .job-picker-item { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 12px; }
        .job-picker-item:hover { border-color: var(--primary-light); box-shadow: 0 2px 6px rgba(59,130,246,0.1); }
        .job-picker-item.selected { border-color: var(--primary); background: #eff6ff; }
        .job-picker-item .job-info { flex: 1; min-width: 0; }
        .job-picker-item .job-titulo { font-weight: 700; font-size: 13px; color: var(--text-primary); }

const state = {

// ============================================================================
// LOADING / TRAVA 2s
// ============================================================================
let _loadingActive = false;
function mostrarLoading() {
    _loadingActive = true;
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.classList.remove('hidden');
}
function esconderLoading() {
    _loadingActive = false;
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.classList.add('hidden');
}

// Executa ação bloqueando a UI por no mínimo 2s
async function comLoading(fn) {
    if (_loadingActive) return;
    mostrarLoading();
    const inicio = Date.now();
    let resultado;
    try {
        resultado = await fn();
    } catch (err) {
        console.error('Erro durante ação com loading:', err);
        mostrarToast('Erro na operação', 'error');
    } finally {
        const decorrido = Date.now() - inicio;
        const restante = Math.max(0, 2000 - decorrido);
        setTimeout(() => {
            esconderLoading();
        }, restante);
    }
    return resultado;
}

// ============================================================================
// HELPERS
// ============================================================================
function formatISODate(date) {
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseISODate(str) {
    if (!str) return null;
    const p = str.split('-');
    if (p.length !== 3) return null;
    const d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
    d.setHours(0,0,0,0);
    return d;
}
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function formatHour(h) {
    const hour = Math.floor(h);
    const min = Math.round((h - hour) * 60);
    return `${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}
function isAdmin() { return state.currentUser && state.currentUser.tipo === 'admin'; }

function isAlocavel(user) {
    if (!user) return false;
    if (user.tipo === 'admin') return false;
    if (user.tipo === 'atendimento') return false;
    if (user.ativo === false) return false;
    return true;
}
function getProfissionaisAlocaveis() { return state.users.filter(isAlocavel); }
function getGestores() { return state.users.filter(u => u.tipo === 'admin' && u.ativo !== false); }

function isDirecaoArte(usuario) {
    const c = (usuario && usuario.cargo || '').toLowerCase();
    return c.includes('direção') || c.includes('direcao');
}
function isRedacao(usuario) {
    const c = (usuario && usuario.cargo || '').toLowerCase();
    return c.includes('redação') || c.includes('redacao');
}

// Total de horas disponíveis no dia por cargo
function getHorasDisponiveisPorCargo() {
    const profissionais = getProfissionaisAlocaveis();
    const countDirecao = profissionais.filter(isDirecaoArte).length;
    const countRedacao = profissionais.filter(isRedacao).length;
    return {
        direcao: countDirecao * HOURS_PER_DAY,
        redacao: countRedacao * HOURS_PER_DAY,
        total: (countDirecao + countRedacao) * HOURS_PER_DAY
    };
}

// Horas alocadas no dia por cargo (classificação da job)
function getHorasAlocadasPorCargo(jobs) {
    let direcao = 0, redacao = 0;
    jobs.forEach(j => {
        const dur = parseFloat(j.duracaoHoras) || 0;
        const classif = state.classifications.find(c => c.id === j.classificacaoId);
        const nome = (classif && classif.nome || '').toLowerCase();
        if (nome.includes('direção') || nome.includes('direcao')) direcao += dur;
        else if (nome.includes('redação') || nome.includes('redacao')) redacao += dur;
    });
    return { direcao, redacao };
}

    document.getElementById('loginUsername').addEventListener('keydown', (e) => {

});

// ============================================================================
// LOGIN
// ============================================================================
async function fazerLogin() {
    const username = document.getElementById('loginUsername').value.trim().toLowerCase();
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if (!username) { errEl.textContent = 'Digite um nome de usuário.'; errEl.style.display = 'block'; return; }

    await comLoading(async () => {
        try {
            const response = await fetch(`${FIREBASE_URL}/usuarios.json`);
            const data = await response.json();

            if (!data) {
                if (username === 'admin') {
                    const adminUser = {
                        id: 'user_admin', nome: 'Administrador', username: 'admin',
                        tipo: 'admin', cargo: 'Administrador', ativo: true,
                        criadoEm: new Date().toISOString()
                    };
                    await salvarUsuarioFirebase(adminUser);
                    state.currentUser = adminUser;
                    state.users = [adminUser];
                    sessionStorage.setItem('gestjobs_user', JSON.stringify(adminUser));
                    await iniciarApp();
                    mostrarToast('Bem-vindo, Administrador', 'success');
                    return;
                }
                errEl.textContent = 'Nenhum usuário cadastrado. Utilize "admin" para criar o administrador.';
                errEl.style.display = 'block';
                return;
            }

            const users = Object.values(data);
            let foundUser = users.find(u => u.username && u.username.toLowerCase() === username);
            if (!foundUser) foundUser = users.find(u => u.nome && u.nome.toLowerCase() === username);

            if (foundUser) {
                if (foundUser.ativo === false) {
                    errEl.textContent = 'Usuário inativo. Contate o administrador.';
                    errEl.style.display = 'block';
                    return;
                }
                state.currentUser = foundUser;
                state.users = users;
                sessionStorage.setItem('gestjobs_user', JSON.stringify(foundUser));
                await iniciarApp();
                mostrarToast(`Bem-vindo, ${foundUser.nome}`, 'success');
            } else {
                errEl.textContent = 'Usuário não encontrado.';
                errEl.style.display = 'block';
            }
        } catch (error) {
            console.error('Erro no login:', error);
            errEl.textContent = 'Erro ao conectar com o servidor.';
            errEl.style.display = 'block';
        }
    });
}

function fazerLogout() {
    sessionStorage.removeItem('gestjobs_user');
    state.currentUser = null;
    state.users = [];
    state.jobs = [];
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginError').style.display = 'none';
}

async function iniciarApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContainer').classList.remove('hidden');
    atualizarSidebar();
    await carregarDados();
    navegarPara('calendar');
}

// ============================================================================
// DATA
// ============================================================================
async function carregarDados() {
    try {
        const [usersResp, jobsResp, classResp] = await Promise.all([
            fetch(`${FIREBASE_URL}/usuarios.json`),
            fetch(`${FIREBASE_URL}/jobs.json`),
            fetch(`${FIREBASE_URL}/classificacoes.json`)
        ]);
        const usersData = await usersResp.json();
        const jobsData = await jobsResp.json();
        const classData = await classResp.json();

        state.users = usersData ? Object.values(usersData) : [];
        state.jobs = jobsData ? Object.values(jobsData) : [];
        state.classifications = classData ? Object.values(classData) : [];

        if (!classData) {
            for (const c of CLASSIFICACOES_PADRAO) {
                await fetch(`${FIREBASE_URL}/classificacoes/${c.id}.json`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(c)
                });
            }
            state.classifications = [...CLASSIFICACOES_PADRAO];
        }
        if (!state.users.find(u => u.tipo === 'admin')) {
            const adminUser = {
                id: 'user_admin', nome: 'Administrador', username: 'admin',
                tipo: 'admin', cargo: 'Administrador', ativo: true,
                criadoEm: new Date().toISOString()
            };
            await salvarUsuarioFirebase(adminUser);
            state.users.push(adminUser);
        }
    } catch (error) {
        console.error('Erro ao carregar dados:', error);
        mostrarToast('Erro ao carregar dados', 'error');
    }
}

async function salvarUsuarioFirebase(user) {
    await fetch(`${FIREBASE_URL}/usuarios/${user.id}.json`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
    });
}

    } else {
        label.textContent = 'Visualização';
        html += `<div class="nav-item ${state.currentPage === 'calendar' ? 'active' : ''}" onclick="navegarPara('calendar')">${ICONS.calendar}<span>Calendário</span></div>`;
    }
    nav.innerHTML = html;
    if (state.currentUser) {
        const inicial = (state.currentUser.nome || 'U').charAt(0).toUpperCase();
        document.getElementById('userAvatar').textContent = inicial;
        document.getElementById('userNameDisplay').textContent = state.currentUser.nome || 'Usuário';
        const roleLabel = state.currentUser.cargo || (state.currentUser.tipo === 'admin' ? 'Administrador' : 'Atendimento');
        document.getElementById('userRoleDisplay').textContent = roleLabel;
    }
}

// ============================================================================
// ROUTER
// ============================================================================
function renderizarPagina() {
    const main = document.getElementById('mainContent');
    switch (state.currentPage) {
        case 'calendar': renderCalendar(main); break;
        case 'jobs': if (isAdmin()) renderJobs(main); break;
        case 'cadastros': if (isAdmin()) renderCadastros(main); break;
        default: renderCalendar(main);
    }
}

// ============================================================================
// CALENDÁRIO
// ============================================================================
function renderCalendar(container) {
    const month = state.calendarMonth;
    const year = month.getFullYear();
    const monthIndex = month.getMonth();

    let jobs = filterJobsForCalendar(state.jobs);
    const jobsByDay = {};
    jobs.forEach(j => {
        if (!j.dataExecucao) return;
        if (!jobsByDay[j.dataExecucao]) jobsByDay[j.dataExecucao] = [];
        jobsByDay[j.dataExecucao].push(j);
    });

    const firstDay = new Date(year, monthIndex, 1);
    const startOffset = firstDay.getDay();
    const gridStart = new Date(year, monthIndex, 1 - startOffset);
    const cells = [];
    for (let i = 0; i < 42; i++) {
        const d = new Date(gridStart);
        d.setDate(gridStart.getDate() + i);
        cells.push(d);
    }

    const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const monthLabel = `${monthNames[monthIndex]} de ${year}`;

    const classOptions = state.classifications.map(c => `<option value="${c.id}" ${state.filters.classification === c.id ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`).join('');
    const gestores = getGestores();
    const gestorOptions = gestores.map(g => `<option value="${g.id}" ${state.filters.gestor === g.id ? 'selected' : ''}>${escapeHtml(g.nome)}</option>`).join('');

    container.innerHTML = `
        <div class="content-header">
            <div>
                <div class="page-title">Calendário</div>
                <div class="page-subtitle">Horário comercial 09:00-12:00 · 13:30-18:30</div>
            </div>
            <div class="header-actions">
                ${isAdmin() ? `<button class="btn btn-primary btn-sm" onclick="abrirModalJobFromCalendar('${formatISODate(new Date())}')">${ICONS.plus} Novo Job</button>` : ''}
                <button class="btn btn-secondary btn-sm" onclick="recarregar()">${ICONS.refresh} Atualizar</button>
            </div>
        </div>

        <div class="calendar-toolbar">
            <span style="display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:12px; font-weight:600;">${ICONS.filter} Filtros</span>
            <label>Classificação</label>
            <select class="form-control" onchange="aplicarFiltroCalendar('classification', this.value)">
                <option value="all">Todas</option>
                ${classOptions}
            </select>
            <label>Status</label>
            <select class="form-control" onchange="aplicarFiltroCalendar('status', this.value)">
                <option value="all" ${state.filters.status === 'all' ? 'selected' : ''}>Todos</option>
                <option value="pendente" ${state.filters.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                <option value="concluido" ${state.filters.status === 'concluido' ? 'selected' : ''}>Concluído</option>
            </select>
            <label>Gestor</label>
            <select class="form-control" onchange="aplicarFiltroCalendar('gestor', this.value)">
                <option value="all">Todos</option>
                ${gestorOptions}
            </select>
            <button class="btn btn-ghost btn-sm" onclick="limparFiltrosCalendar()">Limpar</button>
        </div>

        <div class="calendar-header">
            <button class="btn btn-ghost btn-sm" onclick="mudarMes(-1)">${ICONS.chevronLeft}</button>
            <span class="calendar-month-label">${monthLabel}</span>
            <button class="btn btn-ghost btn-sm" onclick="mudarMes(1)">${ICONS.chevronRight}</button>
            <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="irParaMesAtual()">Hoje</button>
            <div class="calendar-legend" style="margin-left:auto;">
                <div class="legend-item"><span class="legend-dot free"></span> Livre</div>
                <div class="legend-item"><span class="legend-dot partial"></span> Parcial</div>
                <div class="legend-item"><span class="legend-dot full"></span> Cheio</div>
            </div>
        </div>

        <div class="calendar-grid">
            <div class="calendar-weekday">Dom</div>
            <div class="calendar-weekday">Seg</div>
            <div class="calendar-weekday">Ter</div>
            <div class="calendar-weekday">Qua</div>
            <div class="calendar-weekday">Qui</div>
            <div class="calendar-weekday">Sex</div>
            <div class="calendar-weekday">Sáb</div>
            ${cells.map(d => renderCalendarDay(d, monthIndex, jobsByDay)).join('')}
        </div>
    `;
}

function filterJobsForCalendar(jobs) {
    let result = [...jobs];
    if (state.filters.classification !== 'all') result = result.filter(j => j.classificacaoId === state.filters.classification);
    if (state.filters.status !== 'all') result = result.filter(j => j.status === state.filters.status);
    if (state.filters.gestor !== 'all') result = result.filter(j => j.gestorId === state.filters.gestor);
    return result;
}

function renderCalendarDay(date, currentMonthIndex, jobsByDay) {
    const iso = formatISODate(date);
    const isOtherMonth = date.getMonth() !== currentMonthIndex;
    const isToday = isSameDay(date, new Date());

    const jobs = jobsByDay[iso] || [];
    const jobsCount = jobs.length;

    // Cálculo por cargo
    const disp = getHorasDisponiveisPorCargo();
    const aloc = getHorasAlocadasPorCargo(jobs);
    const livreDirecao = Math.max(0, disp.direcao - aloc.direcao);
    const livreRedacao = Math.max(0, disp.redacao - aloc.redacao);

    const totalHorasDisponiveis = disp.total;
    const totalHorasAlocadas = aloc.direcao + aloc.redacao;
    const totalLivre = livreDirecao + livreRedacao;

    let statusClass = 'status-free';
    if (jobsCount > 0) {
        if (totalHorasDisponiveis > 0 && totalLivre <= 0) statusClass = 'status-full';
        else statusClass = 'status-partial';
    }

    return `
        <div class="calendar-day ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${statusClass}"
             onclick="abrirDiaModal('${iso}')">
            <div class="day-number">${date.getDate()}</div>
            ${jobsCount > 0 ? `<span class="day-jobs-count">${jobsCount} job${jobsCount > 1 ? 's' : ''}</span>` : ''}
            <div class="day-hours">
                <div class="hours-line redacao">
                    <span class="label">Redação</span>
                    <span class="value">${livreRedacao.toFixed(1)}h</span>
                </div>
                <div class="hours-line direcao">
                    <span class="label">Dir. Arte</span>
                    <span class="value">${livreDirecao.toFixed(1)}h</span>
                </div>
            </div>
            <div class="day-status-bar"></div>
        </div>
    `;
}

function mudarMes(delta) {
    const novo = new Date(state.calendarMonth);
    novo.setMonth(novo.getMonth() + delta);
    state.calendarMonth = novo;
    renderizarPagina();
}
function irParaMesAtual() { state.calendarMonth = new Date(); renderizarPagina(); }
function aplicarFiltroCalendar(tipo, valor) { state.filters[tipo] = valor; renderizarPagina(); }
function limparFiltrosCalendar() { state.filters = { classification: 'all', status: 'all', gestor: 'all' }; renderizarPagina(); }

async function recarregar() {
    await comLoading(async () => {
        await carregarDados();
        renderizarPagina();
        mostrarToast('Dados atualizados', 'success');
    });
}

// ============================================================================
// MODAL DO DIA
// ============================================================================
function abrirDiaModal(isoDate) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());

    const dateObj = parseISODate(isoDate);
    const dateLabel = dateObj.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    const profissionais = getProfissionaisAlocaveis();
    const todosJobsDoDia = filterJobsForCalendar(state.jobs).filter(j => j.dataExecucao === isoDate);

    const disp = getHorasDisponiveisPorCargo();
    const aloc = getHorasAlocadasPorCargo(todosJobsDoDia);
    const livreDirecao = Math.max(0, disp.direcao - aloc.direcao);
    const livreRedacao = Math.max(0, disp.redacao - aloc.redacao);

    const modalHtml = `
        <div class="modal-overlay active" id="modalDia">
            <div class="modal modal-xl">
                <div class="modal-header">
                    <div>
                        <div class="modal-title">${dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1)}</div>
                        <div class="modal-subtitle">${todosJobsDoDia.length} job(s) · Redação: ${livreRedacao.toFixed(1)}h livres · Dir. Arte: ${livreDirecao.toFixed(1)}h livres</div>
                    </div>
                    <button class="modal-close" onclick="fecharModal('modalDia')">${ICONS.close}</button>
                </div>
                <div class="modal-body">
                    ${isAdmin() ? `
                        <div class="flex gap-1 mb-2" style="justify-content:flex-end; flex-wrap:wrap;">
                            <button class="btn btn-secondary btn-sm" onclick="abrirModalAlocarExistente('${isoDate}')">${ICONS.copy} Alocar job pendente</button>
                            <button class="btn btn-secondary btn-sm" onclick="abrirModalReabrirJob('${isoDate}')">${ICONS.redo} Reabrir job concluída</button>
                            <button class="btn btn-primary btn-sm" onclick="abrirModalJobFromCalendar('${isoDate}')">${ICONS.plus} Novo Job neste dia</button>
                        </div>
                    ` : ''}

                    <div class="section-title">Grade do dia · Profissionais × Horários</div>
                    ${renderDiaGrid(profissionais, isoDate, todosJobsDoDia)}

                    <div class="section-title">Detalhes do dia</div>
                    ${renderDiaDetalhes(isoDate, todosJobsDoDia)}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalDia')">Fechar</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function renderDiaGrid(profissionais, isoDate, jobsDoDia) {
    if (profissionais.length === 0) return `<div class="empty-state">${ICONS.users}<h3>Nenhum profissional alocável cadastrado</h3><p>Cadastre usuários do tipo Direção de Arte, Redação, Design ou Outro</p></div>`;

    const getOrder = (c) => {
        if (!c) return 5;
        const k = c.toLowerCase();
        if (k.includes('direção') || k.includes('direcao')) return 1;
        if (k.includes('redação') || k.includes('redacao')) return 2;
        if (k.includes('design')) return 3;
        return 4;
    };
    const profissionaisOrdenados = [...profissionais].sort((a, b) => {
        const oa = getOrder(a.cargo);
        const ob = getOrder(b.cargo);
        if (oa !== ob) return oa - ob;
        return (a.nome || '').localeCompare(b.nome || '');
    });

    let cargoAnterior = null;
    let grupoIdx = 0;
    const headerCells = profissionaisOrdenados.map(p => {
        const cargoKey = (p.cargo || 'outro').toLowerCase();
        const isNewGroup = cargoAnterior !== null && cargoAnterior !== cargoKey;
        if (isNewGroup) grupoIdx = (grupoIdx + 1) % 2;
        cargoAnterior = cargoKey;
        const groupClass = `cargo-group-${grupoIdx}`;
        const dividerClass = isNewGroup ? 'cargo-divider-left' : '';
        return `<div class="day-schedule-header ${groupClass} ${dividerClass}">${escapeHtml(p.nome.split(' ')[0])}${p.cargo ? '<br><span style="font-weight:500; font-size:9.5px; opacity:0.8;">' + escapeHtml(p.cargo) + '</span>' : ''}</div>`;
    }).join('');

    let html = `<div class="day-schedule" style="--pros-count:${profissionaisOrdenados.length};">
        <div class="day-schedule-header">Horário</div>
        ${headerCells}
    `;

    TIME_SLOTS.forEach(slot => {
        const isLunch = slot === 12 || slot === 13;
        const timeLabel = slot === 12 ? '12:00' : slot === 13 ? '13:00' : formatHour(slot);
        html += `<div class="day-schedule-time ${isLunch ? 'lunch' : ''}">${timeLabel}${slot === 12 ? ' 🍽' : ''}</div>`;

        profissionaisOrdenados.forEach(prof => {
            if (isLunch) { html += `<div class="day-schedule-cell" style="background:#fef3c7;"></div>`; return; }

            const jobsNoSlot = jobsDoDia.filter(j => {
                if (j.usuarioId !== prof.id) return false;
                const inicio = parseFloat(j.horaInicio);
                return Math.abs(inicio - slot) < 0.01;
            });

            if (jobsNoSlot.length > 0) {
                const j = jobsNoSlot[0];
                const dur = parseFloat(j.duracaoHoras) || 0;
                const isCopy = j.isCopy === true;
                html += `<div class="day-schedule-cell" style="padding:4px;">
                    <div class="schedule-job status-${j.status} ${isCopy ? 'is-copy' : ''}" onclick="abrirAcaoJob('${j.id}')">
                        ${j.numero ? `<span class="schedule-job-numero">#${escapeHtml(j.numero)}</span>` : ''}
                        <span class="schedule-job-title">${escapeHtml(j.titulo)}</span>
                        <span class="schedule-job-hours">${formatHour(j.horaInicio)} - ${formatHour(parseFloat(j.horaInicio) + dur)} · ${dur}h</span>
                    </div>
                </div>`;
            } else {
                const isOccupied = jobsDoDia.some(j => {
                    if (j.usuarioId !== prof.id) return false;
                    const inicio = parseFloat(j.horaInicio);
                    const fim = inicio + (parseFloat(j.duracaoHoras) || 0);
                    return slot >= inicio && slot < fim;
                });
                html += `<div class="day-schedule-cell" ${isOccupied ? 'style="background:#f1f5f9;"' : ''}></div>`;
            }
        });
    });

    html += `</div>`;
    return html;
}

function renderDiaDetalhes(isoDate, jobsDoDia) {
    if (jobsDoDia.length === 0) return `<p class="text-muted" style="font-size:13px;">Nenhum job alocado neste dia.</p>`;
    return `
        <table class="data-table">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Título</th>

                    <th>Gestor</th>
                    <th>Horário</th>
                    <th>Duração</th>
                    <th>Classificação</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                ${jobsDoDia.map(j => {
                    const prof = state.users.find(u => u.id === j.usuarioId);
                    const gestor = state.users.find(u => u.id === j.gestorId);
                    const classif = state.classifications.find(c => c.id === j.classificacaoId);
                    const dur = parseFloat(j.duracaoHoras) || 0;
                    const fim = (parseFloat(j.horaInicio) || 0) + dur;
                    return `
                        <tr>
                            <td class="cell-muted">${j.numero ? '#' + escapeHtml(j.numero) : '—'}</td>
                            <td class="cell-strong">
                                ${escapeHtml(j.titulo)}
                                ${j.isCopy ? '<span class="tag tag-outro" style="margin-left:6px;">Cópia</span>' : ''}
                            </td>
                            <td>${prof ? escapeHtml(prof.nome) : '—'}</td>
                            <td class="cell-muted">${gestor ? escapeHtml(gestor.nome) : '—'}</td>
                            <td>${formatHour(j.horaInicio)} - ${formatHour(fim)}</td>
                            <td>${dur}h</td>
                            <td>${classif ? `<span class="tag ${classif.cor}">${escapeHtml(classif.nome)}</span>` : '<span class="cell-muted">—</span>'}</td>
                            <td><span class="tag tag-status ${j.status}">${STATUS_LABEL[j.status]}</span></td>
                            <td>
                                <div class="cell-actions">
                                    <button class="btn btn-xs btn-secondary" onclick="abrirAcaoJob('${j.id}')" title="Abrir">${ICONS.eye}</button>
                                    ${isAdmin() ? `<button class="btn btn-xs btn-primary" onclick="abrirModalJob('${j.id}')" title="Editar">${ICONS.edit}</button>` : ''}
                                    ${isAdmin() ? `<button class="btn btn-xs btn-danger" onclick="excluirJob('${j.id}')" title="Excluir">${ICONS.trash}</button>` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
    `;
}

function abrirModalAlocarExistente(isoDate) {
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    if (!isAdmin()) return;

    const jobsPendentes = state.jobs.filter(j => j.status === 'pendente');
    if (jobsPendentes.length === 0) {
        mostrarToast('Nenhum job pendente para alocar', 'warning');
        return;
    }

    const dateObj = parseISODate(isoDate);
    const dateLabel = dateObj.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    const profissionais = getProfissionaisAlocaveis();
    const jobsOrdenados = [...jobsPendentes].sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));

    const horariosOptions = (() => {
        const opts = [];
        for (let h = WORK_HOURS_MORNING_START; h < WORK_HOURS_MORNING_END; h += 0.5) opts.push(h);
        for (let h = WORK_HOURS_AFTERNOON_START; h < WORK_HOURS_AFTERNOON_END; h += 0.5) opts.push(h);
        return opts;
    })();

    const modalHtml = `
        <div class="modal-overlay active" id="modalAlocar">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <div>
                        <div class="modal-title">Alocar job pendente</div>
                        <div class="modal-subtitle">${dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1)}</div>
                    </div>
                    <button class="modal-close" onclick="fecharModal('modalAlocar')">${ICONS.close}</button>
                </div>
                <div class="modal-body">
                    <div class="context-banner">
                        <div class="icon-wrap">${ICONS.copy}</div>
                        <div class="text">
                            <strong>Criar cópia de job pendente</strong>
                            <span>Uma nova alocação será gerada. O job original continua pendente no dia dele.</span>
                        </div>
                    </div>

                    <div class="section-title">1. Selecione o job pendente</div>
                    <div class="form-group">
                        <input type="text" class="form-control" id="alocarSearch" placeholder="Buscar por título ou número..." oninput="filtrarJobsAlocar(this.value)">
                    </div>
                    <div class="job-picker-list" id="jobPickerList">
                        ${jobsOrdenados.map(j => {
                            const prof = state.users.find(u => u.id === j.usuarioId);
                            const gestor = state.users.find(u => u.id === j.gestorId);
                            return `
                                <div class="job-picker-item" data-id="${j.id}"
                                     data-titulo="${escapeHtml(j.titulo.toLowerCase())}"
                                     data-numero="${escapeHtml((j.numero || '').toLowerCase())}"
                                     onclick="selecionarJobAlocar('${j.id}')">
                                    <div class="job-info">
                                        <div class="job-titulo">${j.numero ? '#' + escapeHtml(j.numero) + ' · ' : ''}${escapeHtml(j.titulo)}</div>
                                        <div class="job-meta">Original em ${j.dataExecucao} · ${formatHour(j.horaInicio)} (${j.duracaoHoras}h) · Prof: ${prof ? escapeHtml(prof.nome) : '—'}${gestor ? ' · Gestor: ' + escapeHtml(gestor.nome) : ''}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div id="alocarConfig" class="hidden">
                        <div class="section-title">2. Configure a nova alocação</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Data de execução <span class="required">*</span></label>
                                <input type="date" class="form-control" id="alocarData" value="${isoDate}">
                            </div>
                            <div class="form-group">
                                <label>Profissional responsável <span class="required">*</span></label>
                                <select class="form-control" id="alocarUsuario">
                                    ${profissionais.map(u => `<option value="${u.id}">${escapeHtml(u.nome)}${u.cargo ? ' · ' + escapeHtml(u.cargo) : ''}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Horário de início <span class="required">*</span></label>
                                <select class="form-control" id="alocarHoraInicio">
                                    ${horariosOptions.map(h => `<option value="${h}">${formatHour(h)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Duração (horas) <span class="required">*</span></label>
                                <select class="form-control" id="alocarDuracao">
                                    ${[0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8].map(d => `<option value="${d}">${d}h</option>`).join('')}
                                </select>
                            </div>

                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalAlocar')">Cancelar</button>

                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    window._alocarState = { jobId: null };
}

function filtrarJobsAlocar(termo) {
    const t = termo.toLowerCase().trim();
    document.querySelectorAll('#jobPickerList .job-picker-item').forEach(el => {
        const titulo = el.dataset.titulo || '';
        const numero = el.dataset.numero || '';
        el.style.display = (!t || titulo.includes(t) || numero.includes(t)) ? '' : 'none';
    });
}

function selecionarJobAlocar(jobId) {
    document.querySelectorAll('#jobPickerList .job-picker-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === jobId);
    });
    window._alocarState.jobId = jobId;
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;
    document.getElementById('alocarUsuario').value = job.usuarioId || '';
    document.getElementById('alocarHoraInicio').value = job.horaInicio || 9;
    document.getElementById('alocarDuracao').value = job.duracaoHoras || 1;
    document.getElementById('alocarConfig').classList.remove('hidden');
    document.getElementById('btnAlocar').disabled = false;
}

async function confirmarAlocarJob() {
    const jobId = window._alocarState.jobId;
    if (!jobId) return;
    const jobOriginal = state.jobs.find(j => j.id === jobId);
    if (!jobOriginal) return;

    const novaData = document.getElementById('alocarData').value;
    const novoUsuarioId = document.getElementById('alocarUsuario').value;
    const novaHoraInicio = parseFloat(document.getElementById('alocarHoraInicio').value);
    const novaDuracao = parseFloat(document.getElementById('alocarDuracao').value);

    if (!novaData || !novoUsuarioId || isNaN(novaHoraInicio) || isNaN(novaDuracao)) {
        mostrarToast('Preencha todos os campos', 'warning'); return;
    }

    const fim = novaHoraInicio + novaDuracao;
    if (novaHoraInicio < WORK_HOURS_MORNING_END && fim > WORK_HOURS_MORNING_END) {
        mostrarToast('O job não pode atravessar o almoço (12:00 - 13:30)', 'warning'); return;
    }
    if (novaHoraInicio >= 12 && novaHoraInicio < 13.5) {
        mostrarToast('Não é possível alocar durante o almoço (12:00 - 13:30)', 'warning'); return;
    }
    if (fim > WORK_HOURS_AFTERNOON_END) {
        mostrarToast('O job ultrapassa o horário de encerramento (18:30)', 'warning'); return;
    }

    const conflitos = state.jobs.filter(j => 
        j.usuarioId === novoUsuarioId && j.dataExecucao === novaData && j.status !== 'concluido'
    ).filter(j => {
        const inicioEx = parseFloat(j.horaInicio);
        const fimEx = inicioEx + (parseFloat(j.duracaoHoras) || 0);
        return (novaHoraInicio < fimEx && fim > inicioEx);
    });
    if (conflitos.length > 0) {
        mostrarToast(`Conflito com "${conflitos[0].titulo}"`, 'warning'); return;
    }

    await comLoading(async () => {
        const agora = new Date().toISOString();
        const novoJob = {
            id: 'job_' + Date.now(),
            numero: jobOriginal.numero || null,
            titulo: jobOriginal.titulo,
            descricao: jobOriginal.descricao,
            dataExecucao: novaData,
            usuarioId: novoUsuarioId,
            horaInicio: novaHoraInicio,
            duracaoHoras: novaDuracao,
            classificacaoId: jobOriginal.classificacaoId || null,
            prazo: jobOriginal.prazo || null,
            status: 'pendente',
            gestorId: state.currentUser.id,
            gestorNome: state.currentUser.nome,
            parentJobId: jobOriginal.id,
            isCopy: true,
            criadoEm: agora,
            atualizadoEm: agora,
            historico: [{
                tipo: 'criacao',
                usuarioId: state.currentUser.id,
                usuarioNome: state.currentUser.nome,
                observacao: `Cópia alocada a partir do job ${jobOriginal.numero || jobOriginal.id}`,
                data: agora, status: 'pendente'
            }]
        };

        try {
            await fetch(`${FIREBASE_URL}/jobs/${novoJob.id}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novoJob)
            });
            state.jobs.push(novoJob);
            fecharModal('modalAlocar');
            fecharModal('modalDia');
            await carregarDados();
            renderizarPagina();
            mostrarToast('Cópia do job pendente alocada', 'success');
        } catch (error) {
            console.error('Erro:', error);
            mostrarToast('Erro ao alocar job', 'error');
        }
    });
}

function filtrarJobsReabrir(termo) {
    const t = termo.toLowerCase().trim();
    document.querySelectorAll('#reabrirPickerList .job-picker-item').forEach(el => {
        const titulo = el.dataset.titulo || '';
        const numero = el.dataset.numero || '';
        el.style.display = (!t || titulo.includes(t) || numero.includes(t)) ? '' : 'none';
    });
}

function selecionarJobReabrir(jobId) {
    document.querySelectorAll('#reabrirPickerList .job-picker-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === jobId);
    });
    window._reabrirState.jobId = jobId;
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;
    document.getElementById('reabrirUsuario').value = job.usuarioId || '';
    document.getElementById('reabrirHoraInicio').value = job.horaInicio || 9;
    document.getElementById('reabrirDuracao').value = job.duracaoHoras || 1;
    document.getElementById('reabrirConfig').classList.remove('hidden');
    document.getElementById('btnReabrir').disabled = false;
}

async function salvarJob(jobId) {
    const numero = document.getElementById('jobNumero').value.trim();
    const titulo = document.getElementById('jobTitulo').value.trim();
    const descricao = document.getElementById('jobDescricao').value.trim();
    const dataExecucao = document.getElementById('jobData').value;
    const usuarioId = document.getElementById('jobUsuario').value;
    const horaInicio = parseFloat(document.getElementById('jobHoraInicio').value);
    const duracaoHoras = parseFloat(document.getElementById('jobDuracao').value);
    const classificacaoId = document.getElementById('jobClassificacao').value;
    const prazo = document.getElementById('jobPrazo').value;
    const status = document.getElementById('jobStatus').value;

    if (!titulo || !dataExecucao || !usuarioId || isNaN(horaInicio) || isNaN(duracaoHoras) || !classificacaoId) {
        mostrarToast('Preencha os campos obrigatórios (incluindo classificação)', 'warning'); return;
    }

    const userAlocado = state.users.find(u => u.id === usuarioId);
    if (!userAlocado || !isAlocavel(userAlocado)) {
        mostrarToast('Usuário selecionado não pode ser alocado em jobs', 'warning'); return;
    }

    const fim = horaInicio + duracaoHoras;
    if (horaInicio < WORK_HOURS_MORNING_END && fim > WORK_HOURS_MORNING_END) {
        mostrarToast('O job não pode atravessar o almoço (12:00 - 13:30)', 'warning'); return;
    }
    if (horaInicio >= 12 && horaInicio < 13.5) {
        mostrarToast('Não é possível alocar durante o almoço (12:00 - 13:30)', 'warning'); return;
    }
    if (fim > WORK_HOURS_AFTERNOON_END) {
        mostrarToast('Ultrapassa o horário de encerramento (18:30)', 'warning'); return;
    }

    const conflitos = state.jobs.filter(j => 
        j.id !== jobId && j.usuarioId === usuarioId && j.dataExecucao === dataExecucao && j.status !== 'concluido'
    ).filter(j => {
        const inicioEx = parseFloat(j.horaInicio);
        const fimEx = inicioEx + (parseFloat(j.duracaoHoras) || 0);
        return (horaInicio < fimEx && fim > inicioEx);
    });
    if (conflitos.length > 0) {
        mostrarToast(`Conflito com "${conflitos[0].titulo}"`, 'warning'); return;
    }

    await comLoading(async () => {
        const jobExistente = jobId ? state.jobs.find(j => j.id === jobId) : null;
        const job = {
            id: jobId || 'job_' + Date.now(),
            numero: numero || null, titulo, descricao,
            dataExecucao, usuarioId, horaInicio, duracaoHoras,
            classificacaoId,
            prazo: prazo || null, status,
            gestorId: jobExistente ? jobExistente.gestorId : state.currentUser.id,
            gestorNome: jobExistente ? jobExistente.gestorNome : state.currentUser.nome,
            atualizadoEm: new Date().toISOString()
        };
        if (!jobId) job.criadoEm = new Date().toISOString();
        else if (jobExistente) {
            if (jobExistente.historico) job.historico = jobExistente.historico;
            if (jobExistente.isCopy) job.isCopy = true;
            if (jobExistente.parentJobId) job.parentJobId = jobExistente.parentJobId;
            if (jobExistente.isReopen) job.isReopen = true;
            if (jobExistente.concluidoEm) job.concluidoEm = jobExistente.concluidoEm;
        }

        try {
            await fetch(`${FIREBASE_URL}/jobs/${job.id}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(job)
            });
            const idx = state.jobs.findIndex(j => j.id === job.id);
            if (idx >= 0) state.jobs[idx] = job;
            else state.jobs.push(job);
            fecharModal('modalJob');
            fecharModal('modalDia');
            await carregarDados();
            renderizarPagina();
            mostrarToast(jobId ? 'Job atualizado' : 'Job criado', 'success');
        } catch (error) {
            console.error('Erro:', error);
            mostrarToast('Erro ao salvar job', 'error');
        }
    });
}

async function excluirJob(id) {
    if (!confirm('Excluir este job?')) return;
    await comLoading(async () => {
        try {
            await fetch(`${FIREBASE_URL}/jobs/${id}.json`, { method: 'DELETE' });
            state.jobs = state.jobs.filter(j => j.id !== id);
            fecharModal('modalDia');
            await carregarDados();
            renderizarPagina();
            mostrarToast('Job excluído', 'success');
        } catch (error) {
            mostrarToast('Erro ao excluir', 'error');
        }
    });
}

    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    const classifAtual = state.classifications.find(c => c.id === job.classificacaoId);
    const userAtual = state.users.find(u => u.id === job.usuarioId);
    const gestor = state.users.find(u => u.id === job.gestorId);
    const dur = parseFloat(job.duracaoHoras) || 0;
    const fim = (parseFloat(job.horaInicio) || 0) + dur;
    const isAdminUser = isAdmin();

    const modalHtml = `
        <div class="modal-overlay active" id="modalAcao">
            <div class="modal">
                <div class="modal-header">
                    <div>
                        <div class="modal-title">${job.numero ? '#' + escapeHtml(job.numero) + ' · ' : ''}${escapeHtml(job.titulo)}</div>
                        <div class="modal-subtitle">${job.dataExecucao} · ${formatHour(job.horaInicio)} - ${formatHour(fim)} (${dur}h)</div>
                    </div>
                    <button class="modal-close" onclick="fecharModal('modalAcao')">${ICONS.close}</button>
                </div>
                <div class="modal-body">
                    ${job.isCopy ? `
                        <div class="context-banner">
                            <div class="icon-wrap">${ICONS.copy}</div>
                            <div class="text">
                                <strong>${job.isReopen ? 'Job reaberto' : 'Cópia de job'}</strong>
                                <span>Original: ${job.parentJobId ? '#' + (state.jobs.find(x => x.id === job.parentJobId)?.numero || job.parentJobId) : '—'}</span>
                            </div>
                        </div>
                    ` : ''}

                    ${job.descricao ? `
                        <div class="section-title">Descrição</div>
                        <p style="font-size:13.5px; color:var(--text-secondary); margin-bottom:16px;">${escapeHtml(job.descricao)}</p>
                    ` : ''}

                    <div class="section-title">Informações</div>
                    <div class="context-banner">
                        <div class="icon-wrap">${ICONS.info}</div>
                        <div class="text">
                            <strong>${classifAtual ? escapeHtml(classifAtual.nome) : 'Sem classificação'} — ${STATUS_LABEL[job.status]}</strong>
                            <span>Profissional: ${userAtual ? escapeHtml(userAtual.nome) : '—'} · Gestor: ${gestor ? escapeHtml(gestor.nome) : '—'}</span>
                        </div>
                    </div>

                    ${job.historico && job.historico.length > 0 ? `
                        <div class="section-title">Histórico</div>
                        <div style="max-height:180px; overflow-y:auto;">
                            ${job.historico.map(h => `
                                <div style="padding:8px 12px; border-left:2px solid var(--border); margin-bottom:6px;">
                                    <div style="font-size:11px; color:var(--text-muted); margin-bottom:3px;">
                                        ${escapeHtml(h.usuarioNome || '')} · ${new Date(h.data).toLocaleString('pt-BR')}
                                    </div>
                                    ${h.observacao ? `<div style="font-size:12.5px; color:var(--text-secondary); white-space:pre-wrap;">${escapeHtml(h.observacao)}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    ${isAdminUser ? `
                        <div class="section-title">Ações</div>
                        <div style="display:flex; flex-direction:column; gap:8px;">
                            ${job.status === 'pendente' ? `
                                <button class="btn btn-success" style="justify-content:flex-start;" onclick="fecharModal('modalAcao'); concluirJob('${job.id}')">
                                    ${ICONS.check} Concluir job
                                </button>
                            ` : ''}
                            ${job.status === 'concluido' ? `
                                <button class="btn btn-secondary" style="justify-content:flex-start;" onclick="fecharModal('modalAcao'); reabrirJobSimples('${job.id}')">
                                    ${ICONS.refresh} Reabrir job
                                </button>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="fecharModal('modalAcao')">Fechar</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

async function concluirJob(jobId) {
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    await comLoading(async () => {
        const historico = job.historico || [];
        historico.push({
            tipo: 'conclusao',
            usuarioId: state.currentUser.id,
            usuarioNome: state.currentUser.nome,
            observacao: 'Job concluído',
            data: new Date().toISOString(),
            status: 'concluido'
        });

        try {
            const agora = new Date().toISOString();
            await fetch(`${FIREBASE_URL}/jobs/${jobId}.json`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'concluido', historico, atualizadoEm: agora, concluidoEm: agora })
            });
            fecharModal('modalDia');
            await carregarDados();
            renderizarPagina();
            mostrarToast('Job concluído', 'success');
        } catch (error) {
            mostrarToast('Erro ao concluir job', 'error');
        }
    });
}

async function reabrirJobSimples(jobId) {
    const job = state.jobs.find(j => j.id === jobId);
    if (!job) return;

    await comLoading(async () => {
        const historico = job.historico || [];
        historico.push({
            tipo: 'reabertura',
            usuarioId: state.currentUser.id,
            usuarioNome: state.currentUser.nome,
            observacao: 'Job reaberto',
            data: new Date().toISOString(),
            status: 'pendente'
        });

        try {
            await fetch(`${FIREBASE_URL}/jobs/${jobId}.json`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'pendente', historico, atualizadoEm: new Date().toISOString(), concluidoEm: null })
            });
            fecharModal('modalDia');
            await carregarDados();
            renderizarPagina();
            mostrarToast('Job reaberto', 'success');
        } catch (error) {
            mostrarToast('Erro ao reabrir job', 'error');
        }
    });
}
