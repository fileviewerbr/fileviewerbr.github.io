<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Logomarca - Cartão de Visita</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    body {
   

    justify-content: center;
    align-items: center;
margin: 0 auto;
     
        }

        .container {
            margin: 0 auto;
            text-align: ce;
            width: 100%;
            max-width: 500px;
        
        }

        /* HEADER */
        .header {
            align-items: center;

            height: 100%;
            padding: 6px;

              margin-top: 40px;
      background-color: #2f959a;    

        width: 70%;
        }

        .header-left {
            
            padding-left: 30px;
            border-radius: 0 8px 8px 0;
        }

        .header-left h1 {
            color: white;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.2;
        }

        .header-left p {
            color: white;
            font-size: 12px;
            opacity: 0.9;
        }

        .header-right {
            width: 20%;
            display: flex;
            justify-content: flex-end;
        }

        .logo-gerar {
            width: 100px;
            height: 100px;
            background-color: white;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }

        /* CARTÃO CONTAINER */
        .cartao-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .card-container {
            position: relative;
            width: 100%;
            height: 400px;
            max-width: 600px;
            margin: 0 auto 30px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .card-background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .card-background {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .card-element {
            position: absolute;
            z-index: 2;
        }
        
        /* LOGO 1 - NO CANTO SUPERIOR ESQUERDO (NORMAL) */
        .logo-container1 {
            left: 180px;
            top: 140px;
            width: 110px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* LOGO 2 - NO CENTRO (NORMAL) */
        .logo-container2 {
            left: 50%;
            top: 30%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* LOGO 3 - NO CANTO INFERIOR DIREITO (PRETO E BRANCO) */
        .logo-container3 {
            right: 50px;
            bottom: 85px;
            width: 100px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-pb {
            filter: grayscale(100%) contrast(120%);
        }
        
        .card-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
        
        /* TEXTO DO CARTÃO COM LARGURA FIXA E CORTE */
        .card-name {
            left: 210px;
            bottom: 180px;
            width: 200px;
            font-size: 8px;
            font-weight: bold;
            color: #333;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
            
        .card-nameG {
            left: 40px;
            bottom: 353px;
            width: 280px;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
            background-color: #2d3748;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 2px;
        }
        
        .card-email {
            left: 280px;
            bottom: 152px;
            width: 160px;
            font-size: 7px;
            color: #000000;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .card-tel {
            left: 125px;
            bottom: 152px;
            width: 150px;
            font-size: 7px;
            color: #000000;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BOTÕES DE AÇÃO */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 200px;
        }
        
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #48bb78;
        }
        
        .btn-success:hover {
            background: #38a169;
        }

        .btn-warning {
            background: #ed8936;
        }
        
        .btn-warning:hover {
            background: #dd7711;
        }

        .btn-danger {
            background: #e53e3e;
        }
        
        .btn-danger:hover {
            background: #c53030;
        }

        .btn-primary {
            background: #805ad5;
        }
        
        .btn-primary:hover {
            background: #6b46c1;
        }

        /* BARRA DIVISORA */
        .divider {
            height: 20px;
            background-color: #6B6B6B;
            width: 100%;
            margin: 20px 0;
        }

        /* BOTÃO VOLTAR */
        .voltar-container {
            display: flex;
            justify-content: flex-start;
            margin: 20px 0;
        }

        .voltar-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            color: #3A8F90;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .voltar-btn:hover {
            transform: scale(1.05);
        }

        .voltar-btn .arrow {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* RODAPÉ */
        .footer {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 40px;
            padding: 20px 0;
        }

        .footer-logo {
            width: 90px;
            height: 40px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            border-radius: 4px;
        }

        /* LOADING TEMP */
        .loading-temp {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 10000;
        }

      

       


           .bg-image {
    position: fixed;
    inset: 0;
    z-index: -1; /* fica atrás de tudo */
    display: flex;
    justify-content: center;
    align-items: center;
}


.bg-image img {
    width: 500px; /* controla manualmente */
    height: 700px;
  
}


.logos img{
    margin: 0 auto;
    width: 300px;
    text-align: center;
}

.logos{
    margin: 0 auto;
        text-align: center;

}
    </style>
</head>

    <div class="container">



        <div style="display: flex;"> 
        <header class="header">
            <div class="header-left">
                <h1>Projeto Logomarca</h1>

                <p id="nomeAlunoHeader">Carregando...</p>
            </div>
               
        </header>

         <div class="header-right">
                    <img style="width: 95px; height: 70px; margin-top: 30px; border: 2px solid #817f7f" src="gerar.png" >
                </div>

            </div>

        <!-- CARTÃO -->
        <div class="cartao-container">
            <div class="card-container" id="cardContainer">
                <!-- Template será carregado aqui via JavaScript -->
            </div>
        </div>

        <!-- BOTÕES DE AÇÃO -->
        <div class="action-buttons">
         
        </div>

        <!-- BARRA DIVISORA -->

        <!-- BOTÃO VOLTAR -->
        <div class="voltar-container">
            <button class="voltar-btn" onclick="voltar()">
                <span class="arrow">◀</span>
                <span>Voltar</span>
            </button>
        </div>

      
    </div>





    
        <div class="logos">
            <img src="logos.png">
        </div>

        // Converter para preto e branco
        function converterParaPretoBranco(base64) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const red = data[i];
                        const green = data[i + 1];
                        const blue = data[i + 2];
                        
                        const gray = red * 0.299 + green * 0.587 + blue * 0.114;
                        
                        data[i] = gray;
                        data[i + 1] = gray;
                        data[i + 2] = gray;
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = base64;
            });
        }
        
        // Inicializar editor com template
        function inicializarEditor() {
            cardContainer.innerHTML = `
                <div class="card-background-container">
                    <img src="${templateBase64}" alt="Template" class="card-background">
                </div>

                <div class="card-element card-nameG" id="nameElementG">Nome da Empresa</div>

                <!-- LOGO 1 - CANTO SUPERIOR ESQUERDO (NORMAL) -->
                <div class="card-element logo-container1">
                    <img src="" alt="Logo" class="card-logo" id="cardLogo1" style="display: none;">
                </div>


                <div class="card-element card-name" id="nameElement">Nome da Empresa</div>
                <div class="card-element card-email" id="emailElement">email@empresa.com</div>
                <div class="card-element card-tel" id="telElement">(11) 99999-9999</div>
            `;

            // Atualizar cartão com dados do cliente
            atualizarCartao(clienteAtual);
        }
        
        // Atualizar cartão com dados do cliente
        async function atualizarCartao(cliente) {
            const nameElement = document.getElementById('nameElement');
            const nameElementG = document.getElementById('nameElementG');
            const emailElement = document.getElementById('emailElement');
            const telElement = document.getElementById('telElement');
            const cardLogo1 = document.getElementById('cardLogo1');
            const cardLogo2 = document.getElementById('cardLogo2');
            const cardLogo3 = document.getElementById('cardLogo3');
            
            // Atualizar textos
            const empresaNome = cliente.empresaNome || cliente.nomeFantasia || 'Nome da Empresa';
            nameElement.textContent = `dsdssd ${empresaNome}` ;
            nameElementG.textContent =  empresaNome;


             if (empresaNome.length > 25) {
                // Nome muito longo - esconder os elementos de nome
                nameElement.style.display = 'none';
                nameElementG.style.display = 'none';
                
                // Ajustar posição dos outros elementos para ocupar o espaço
                const emailElement = document.getElementById('emailElement');
                const telElement = document.getElementById('telElement');
                
      
                
                console.log('⚠️ Nome da empresa excede 25 caracteres. Nome ocultado no cartão.');
            } else {
                // Nome dentro do limite - mostrar normalmente
                nameElement.style.display = 'block';
                nameElementG.style.display = 'block';
                nameElement.textContent = empresaNome || 'Nome da Empresa';
                nameElementG.textContent = empresaNome || 'Nome da Empresa';
                
            }



            emailElement.textContent = `📧 ${cliente.email}` || 'email@empresa.com';
            telElement.textContent = `☎️ ${cliente.telefone}` || '(11) 99999-9999';
            
            // VERIFICAR SE TEM LOGO
            if (cliente.logoBase64) {
                // Tem logo - processar normalmente
                logoPBBase64 = await converterParaPretoBranco(cliente.logoBase64);
                
                // Logo 1 e 2 - normais
                cardLogo1.src = cliente.logoBase64;
                cardLogo1.style.display = 'block';
                
                cardLogo2.src = cliente.logoBase64;
                cardLogo2.style.display = 'block';
                
                // Logo 3 - preto e branco
                cardLogo3.src = logoPBBase64;
                cardLogo3.style.display = 'block';
            } else {

                window.location.href = 'semlogo.html';

                // NÃO TEM LOGO - mostrar alerta
                alert('⚠️ ATENÇÃO: Este cliente não possui logo cadastrada!');
                
                // Esconder os elementos de logo
                cardLogo1.style.display = 'none';
                cardLogo2.style.display = 'none';
                cardLogo3.style.display = 'none';
            }
        }

        // FUNÇÃO: Baixar tudo
        function baixarTudo() {
            if (!clienteAtual) return;
            
            const loadingTemp = document.createElement('div');
            loadingTemp.className = 'loading-temp';
            loadingTemp.textContent = 'Preparando todos os arquivos... Aguarde!';
            document.body.appendChild(loadingTemp);

            // Função auxiliar para baixar uma imagem
            function downloadImage(dataUrl, fileName) {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // Sequência de downloads com delay
            setTimeout(() => {
                // Logo original
                if (clienteAtual.logoBase64) {
                    downloadImage(
                        clienteAtual.logoBase64, 
                        `logo-original-${clienteAtual.nome || 'cliente'}.png`
                    );
                }
            }, 100);

            setTimeout(() => {
                // Logo preto e branco
                if (logoPBBase64) {
                    downloadImage(
                        logoPBBase64, 
                        `logo-pb-${clienteAtual.nome || 'cliente'}.png`
                    );
                }
            }, 500);

            setTimeout(() => {
                // PNG do cartão
                baixarCartao();
            }, 900);

            setTimeout(() => {
                // PDF com capa
                baixarPDFComCapa();
                document.body.removeChild(loadingTemp);
            }, 1300);
        }
        
        // Baixar cartão como PNG
        function baixarCartao() {
            if (!clienteAtual) return;
            
            const loadingTemp = document.createElement('div');
            loadingTemp.className = 'loading-temp';
            loadingTemp.textContent = 'Gerando PNG... Aguarde!';
            document.body.appendChild(loadingTemp);
            
            html2canvas(cardContainer, {
                width: 600,
                height: 400,
                scale: 3,
                useCORS: true,
                allowTaint: false,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const imageData = canvas.toDataURL('image/png');
                
                const link = document.createElement('a');
                link.download = `cartao-visita-${clienteAtual.nome || 'cliente'}.png`;
                link.href = imageData;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                document.body.removeChild(loadingTemp);
                
            }).catch(error => {
                console.error('Erro ao gerar PNG:', error);
                alert('Erro ao gerar o PNG. Tente novamente.');
                document.body.removeChild(loadingTemp);
            });
        }

        // PDF com capa
        function baixarPDFComCapa() {
            if (!clienteAtual) return;
            
            const loadingTemp = document.createElement('div');
            loadingTemp.className = 'loading-temp';
            loadingTemp.textContent = 'Gerando PDF com capa... Aguarde!';
            document.body.appendChild(loadingTemp);
            
            html2canvas(cardContainer, {
                width: 600,
                height: 400,
                scale: 3,
                useCORS: true,
                allowTaint: false,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const imageData = canvas.toDataURL('image/png');
                const logoPatrocinador = document.getElementById('logoPatrocinador').src;
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                // PRIMEIRA PÁGINA - CAPA
                // Fundo
                pdf.setFillColor(32, 57, 97);
                pdf.rect(0, 0, 210, 297, 'F');
                
                // Logo do patrocinador
                pdf.addImage(logoPatrocinador, 'PNG', 75, 40, 60, 22);
                
                // Título
                pdf.setFontSize(32);
                pdf.setTextColor(255, 255, 255);
                pdf.setFont('helvetica', 'bold');
                pdf.text('PROJETO LOGOMARCA', 105, 120, { align: 'center' });
                
                // Linha decorativa
                pdf.setDrawColor(255, 255, 255);
                pdf.setLineWidth(1);
                pdf.line(60, 130, 150, 130);
                
                // Informações do cliente
                pdf.setFontSize(20);
                pdf.text('CLIENTE:', 105, 160, { align: 'center' });
                pdf.setFontSize(24);
                pdf.text(clienteAtual.nome || 'Não informado', 105, 175, { align: 'center' });
                
                pdf.setFontSize(16);
                pdf.text('EMPRESA:', 105, 195, { align: 'center' });
                pdf.setFontSize(18);
                pdf.text(clienteAtual.empresaNome || clienteAtual.nomeFantasia || 'Não informado', 105, 210, { align: 'center' });
                
                // SEGUNDA PÁGINA - CARTAO
                pdf.addPage();
                pdf.setPage(2);
                
                // Adicionar o cartão centralizado
                const imgWidth = 180;
                const imgHeight = 120;
                const x = (210 - imgWidth) / 2;
                const y = (297 - imgHeight) / 2;
                
                pdf.addImage(imageData, 'PNG', x, y, imgWidth, imgHeight);
                
                // Informações do cliente na segunda página
                pdf.setFontSize(10);
                pdf.setTextColor(100, 100, 100);
                pdf.text(`Cliente: ${clienteAtual.nome || 'Não informado'}`, 15, 285);
                pdf.text(`Empresa: ${clienteAtual.empresaNome || clienteAtual.nomeFantasia || 'Não informado'}`, 15, 290);

                // Baixar o PDF
                pdf.save(`projeto-logomarca-${clienteAtual.nome || 'cliente'}.pdf`);
                document.body.removeChild(loadingTemp);
                
            }).catch(error => {
                console.error('Erro ao gerar PDF:', error);
                alert('Erro ao gerar o PDF. Tente novamente.');
                document.body.removeChild(loadingTemp);
            });
        }

        // PDF simples (mantida para compatibilidade)
        function baixarPDF() {
            baixarPDFComCapa();
        }
        
        // Visualizar cartão em tela cheia
        function visualizarCartao() {
            if (!clienteAtual) return;
            
            const loadingTemp = document.createElement('div');
            loadingTemp.className = 'loading-temp';
            loadingTemp.textContent = 'Gerando visualização...';
            document.body.appendChild(loadingTemp);
            
            html2canvas(cardContainer, {
                width: 600,
                height: 400,
                scale: 2,
                useCORS: true,
                allowTaint: false,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const imageWindow = window.open();
                imageWindow.document.write(`

                    <html>
                        <head>

                document.body.removeChild(loadingTemp);

                document.body.removeChild(loadingTemp);

        // Voltar para tela anterior
        function voltar() {
            window.location.href = 'visualizacao.html';
        }
