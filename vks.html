<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKS Concept | PDR Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-red: #d90000;
            --card-bg: rgba(15, 15, 15, 0.85);
            --card-border: #222222;
            --card-hover: rgba(30, 30, 30, 0.95);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px 30px 20px;
            
            /* FUNDO NEON VERMELHO REFORÇADO */
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(217, 0, 0, 0.35) 0%, rgba(0, 0, 0, 1) 65%),
                linear-gradient(to bottom, rgba(0,0,0,0) 50%, #050000 100%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
            z-index: 1;
        }

        /* --- CORREÇÃO DA LOGO --- */
        .logo-container {
            margin-bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            width: 200px;
            height: 200px; /* Força um tamanho quadrado */
            object-fit: cover; /* Corta as bordas se necessário */
            /* Esse filtro agressivo transforma qualquer pixel escuro em preto puro para sumir no fundo */
            filter: contrast(1.2) brightness(0.9) drop-shadow(0px 0px 25px rgba(217, 0, 0, 0.6)); 
            /* O blend mode 'screen' vai ignorar o preto e mostrar só o branco/vermelho */
            mix-blend-mode: screen;
        }

        /* Descrição do Serviço */
        .header-text {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .header-text p {
            font-size: 0.85rem;
            color: #cccccc;
            font-weight: 300;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        /* Botões/Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px); 
        }

        .link-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background-color: var(--accent-red);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            border-color: #444;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(217, 0, 0, 0.2);
        }

        .link-card:hover::before {
            transform: scaleY(1);
        }

        .link-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .link-card:hover .link-icon {
            color: var(--accent-red);
        }

        .link-text {
            flex-grow: 1;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            margin-left: 10px;
        }

        .link-text span {
            display: block;
            font-size: 0.75rem;
            color: #888;
            font-weight: 400;
            margin-top: 3px;
            letter-spacing: normal;
        }

        .link-arrow {
            font-size: 1rem;
            color: #555;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .link-card:hover .link-arrow {
            color: var(--text-color);
            transform: translateX(5px);
        }

        /* Botão de WhatsApp Destacado */
        .whatsapp-card {
            background: linear-gradient(135deg, rgba(20, 5, 5, 0.9) 0%, rgba(35, 5, 5, 0.9) 100%);
            border-color: rgba(217, 0, 0, 0.6);
            margin-top: 5px;
        }

        .whatsapp-card .link-icon {
            color: #25D366;
        }

        .whatsapp-card:hover {
            border-color: var(--accent-red);
            box-shadow: 0 5px 25px rgba(217, 0, 0, 0.4);
        }

        .whatsapp-card:hover .link-icon {
            color: #25D366;
        }

        /* Frase Final */
        .slogan {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .slogan p {
            font-family: 'Playfair Display', serif; 
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            line-height: 1.4;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 0.65rem;
            color: #333;
            padding-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .logo-container img { width: 170px; height: 170px; }
            .link-text { font-size: 0.9rem; }
            .slogan p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo da Empresa -->
        <div class="logo-container">
            <!-- Adicionado um estilo inline extra para garantir que o fundo suma -->
            <img src="logo.jpeg" alt="VKS Concept PDR Premium" style="mix-blend-mode: screen; filter: contrast(1.5) brightness(0.8);">
        </div>

        <div class="header-text">
            <p>Martelinho de Ouro & Estética Automotiva<br>de Alta Performance</p>
        </div>

        <div class="links-container">
            
            <a href="https://wa.me/554187531001?text=ola%2C%20%C3%A9%20da%20vks%3F" target="_blank" class="link-card whatsapp-card">
                <i class="fa-brands fa-whatsapp link-icon"></i>
                <div class="link-text">
                    Fale Conosco no WhatsApp
                    <span>Orçamentos e Agendamentos</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://www.instagram.com/vks_martelinho?knvt=MTI4dWhiZWtyb29vYQ%3D%3D&utm_source=qr" target="_blank" class="link-card">
                <i class="fa-brands fa-instagram link-icon"></i>
                <div class="link-text">
                    Instagram
                    <span>@vks_martelinho</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://www.facebook.com/share/1AKEpUnFFT/?mibextid=wwXIfr" target="_blank" class="link-card">
                <i class="fa-brands fa-facebook-f link-icon"></i>
                <div class="link-text">
                    Facebook
                    <span>VKS Martelinho</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://www.tiktok.com/@vks.martelinho" target="_blank" class="link-card">
                <i class="fa-brands fa-tiktok link-icon"></i>
                <div class="link-text">
                    TikTok
                    <span>@vks.martelinho</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

        </div>

        <div class="slogan">
            <p>"Não é um trabalho. É arte”</p>
        </div>

        <div class="footer">
            &copy; <span id="year"></span> VKS Concept.
        </div>
    </div>

        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
