<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKS Concept | PDR Premium</title>
    <!-- Fonte para o visual premium -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- Ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset e Variáveis de Cores */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-red: #cc0000; /* Vermelho baseado na logo */
            --card-bg: #111111;
            --card-border: #222222;
            --card-hover: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at top, #1a0000 0%, #000000 40%);
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* Avatar / Logo Circular */
        .logo-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-red); /* Borda vermelha sutil */
            box-shadow: 0px 0px 20px rgba(204, 0, 0, 0.3); /* Brilho vermelho atrás */
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Fundo preto caso a imagem não preencha tudo */
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Faz a imagem preencher o círculo sem distorcer */
            /* Se a logo tiver muito espaço em branco em volta, use 'contain' em vez de 'cover' */
            /* object-fit: contain; */ 
        }

        /* Título e Descrição */
        .header-text {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-text h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: var(--accent-red);
            margin-bottom: -5px;
            font-weight: 400;
        }

        .header-text h2 {
            font-size: 1rem;
            letter-spacing: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .header-text p {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-top: 10px;
            font-weight: 300;
        }

        /* Botões/Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de borda vermelha ao passar o mouse */
        .link-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: var(--accent-red);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            border-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(204, 0, 0, 0.1);
        }

        .link-card:hover::before {
            transform: scaleY(1);
        }

        /* Ícones dos Links */
        .link-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .link-card:hover .link-icon {
            color: var(--accent-red);
        }

        /* Texto dos Links */
        .link-text {
            flex-grow: 1;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            margin-left: 10px;
        }

        .link-text span {
            display: block;
            font-size: 0.7rem;
            color: #888;
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: normal;
        }

        /* Ícone de seta no final */
        .link-arrow {
            font-size: 1rem;
            color: #555;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .link-card:hover .link-arrow {
            color: var(--text-color);
            transform: translateX(5px);
        }

        /* Botão de WhatsApp Destacado */
        .whatsapp-card {
            background: linear-gradient(135deg, #111111 0%, #1a0505 100%);
            border-color: var(--accent-red);
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .whatsapp-card .link-icon {
            color: #25D366;
        }

        .whatsapp-card:hover {
            background: linear-gradient(135deg, #1a0505 0%, #2a0808 100%);
            box-shadow: 0 5px 20px rgba(204, 0, 0, 0.3);
        }

        .whatsapp-card:hover .link-icon {
            color: #25D366;
        }

        /* Rodapé */
        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            padding-top: 20px;
        }

        .footer a {
            color: #666;
            text-decoration: none;
        }

        /* Animação de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para telas menores */
        @media (max-width: 480px) {
            .logo-container { width: 110px; height: 110px; } /* Diminui um pouco mais no celular */
            .header-text h1 { font-size: 2.2rem; }
            .header-text h2 { font-size: 0.85rem; letter-spacing: 3px; }
            .link-text { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo da Empresa (Circular) -->
        <div class="logo-container">
            <img src="logo.jpeg" alt="VKS Concept PDR Premium">
        </div>

        <!-- Descrição do Serviço -->
        <div class="header-text">
            <h1>Concept</h1>

        </div>

        <!-- Links -->
        <div class="links-container">
            
            <!-- WhatsApp (Destacado) -->
            <a href="https://wa.me/554187531001?text=ola%2C%20%C3%A9%20da%20vks%3F" target="_blank" class="link-card whatsapp-card">
                <i class="fa-brands fa-whatsapp link-icon"></i>
                <div class="link-text">
                    Fale Conosco no WhatsApp
                    <span>Orçamentos e Agendamentos</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/vks_martelinho?knvt=MTI4dWhiZWtyb29vYQ%3D%3D&utm_source=qr" target="_blank" class="link-card">
                <i class="fa-brands fa-instagram link-icon"></i>
                <div class="link-text">
                    Instagram
                    <span>@vks_martelinho</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1AKEpUnFFT/?mibextid=wwXIfr" target="_blank" class="link-card">
                <i class="fa-brands fa-facebook-f link-icon"></i>
                <div class="link-text">
                    Facebook
                    <span>VKS Martelinho</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@vks.martelinho" target="_blank" class="link-card">
                <i class="fa-brands fa-tiktok link-icon"></i>
                <div class="link-text">
                    TikTok
                    <span>@vks.martelinho</span>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

        </div>

        <!-- Rodapé -->
        <div class="footer">
            &copy; <span id="year"></span> VKS Concept. Todos os direitos reservados.
        </div>
    </div>

    <!-- Script para atualizar o ano automaticamente -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
