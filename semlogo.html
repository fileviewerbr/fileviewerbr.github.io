<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Logomarca - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
   
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
     
        }

        .container {
            width: 100%;
            max-width: 500px;
        
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100px;
            margin-bottom: 10px;
        }

        .header-left {
            width: 80%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 30px;
            border-radius: 0 8px 8px 0;
            margin-top: -48px;
        }

        .header-left h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 500;
            line-height: 1.2;
        }

        .header-left p {
            color: white;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .header-right {
            width: 20%;
            display: flex;
            justify-content: flex-end;
        }

        .logo-gerar {
            width: 100px;
            height: 100px;
            background-color: white;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }

        /* FORMULÁRIO */
        .form-section {
            margin: 60px auto;
            max-width: 800px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
        }

        .form-group label {
            color: #3A8F90;
            font-size: 1.2rem;
            font-weight: 600;
            width: 150px;
        }

        .form-group input {
            flex: 1;
            height: 40px;
            border: 2px solid #3A8F90;
            background-color: white;
            border-radius: 4px;
            padding: 0 15px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(58, 143, 144, 0.2);
        }

        /* BOTÃO PRINCIPAL */
        .btn-container {
            display: flex;
            justify-content: center;
            margin: 60px 0;
        }

        .btn-primary {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #3A8F90;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .btn-primary .emoji {
            font-size: 2rem;
        }

        .btn-primary .arrow {
            font-size: 2rem;
            line-height: 1;
        }

        /* LOADING */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #3A8F90;
            font-weight: bold;
        }

        /* ERROR */
        .error {
            display: none;
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            position: fixed;
            margin: 20px 0;
            margin-top: -200px;
            border-left: 4px solid #c53030;
        }

        /* RODAPÉ */
        .footer {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 60px;
            padding: 20px 0;
        }

        .footer-logo {
            width: 90px;
            height: 40px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            border-radius: 4px;
        }





        .bg-image {
    position: fixed;
    inset: 0;
    z-index: -1; /* fica atrás de tudo */
    display: flex;
    justify-content: center;
    align-items: center;
}


.bg-image img {
    width: 500px; /* controla manualmente */
    height: 700px;
  
}

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .header {
                height: 90px;
            }

            .header-left h1 {
                font-size: 1.5rem;
            }

            .header-left p {
                font-size: 0.9rem;
            }

            .logo-gerar {
                width: 70px;
                height: 70px;
            }

            .form-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                margin-bottom: 40px;
            }

            .form-group label {
                width: auto;
            }

            .form-group input {
                width: 100%;
            }

            .footer {
                gap: 30px;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .header-left {
                padding-left: 15px;
            }

            .header-left h1 {
                font-size: 1.2rem;
            }

            .btn-primary {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>


    <div class="bg-image">
    <img src="img.png" alt="background">
</div>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
          
         
        </header>

       

        <!-- BOTÃO -->
        <div class="btn-container">
            <button class="btn-primary">
                <span class="emoji">😟</span>
                <span>Ops! logo não disponível </span>
               
            </button>
        </div>

      
    </div>

    <script>
    </script>
</body>
</html>
