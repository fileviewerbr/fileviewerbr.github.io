<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Logomarca - Visualização</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    body {
   
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
     
        }

        .container {
            width: 100%;
            max-width: 500px;
        
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100px;
            margin-top: -100px;
            position: fixed;
        }

        .header-left {
            width: 80%;
            height: 100%;
            display: flex;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            padding-left: 30px;
            border-radius: 0 8px 8px 0;
            padding-top: 30px;
        }

        .header-left h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 500;
            line-height: 1.2;
        }

        .header-left p {
            color: white;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .header-right {
            width: 20%;
            display: flex;
            justify-content: flex-end;
        }

        .logo-gerar {
            opacity: 0;
            width: 100px;
            height: 100px;
            margin-left: 30px;
            background-color: white;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }

        /* INFORMAÇÕES DO CLIENTE */
        .client-info {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            text-align: left;
        }
        
        .client-info h3 {
            color: #2d3748;
            margin-bottom: 15px;
            border-bottom: 2px solid #3A8F90;
            padding-bottom: 5px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
        }
        
        .info-label {
            font-weight: 600;
            color: #4a5568;
        }
        
        .info-value {
            color: #2d3748;
            text-align: right;
        }

        /* CARDS DE VISUALIZAÇÃO */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 60px;
            margin: 90px 0;
            margin-top: 10px;
        }

        .card-row {
            display: flex;
            align-items: center;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preview-box {
            width: 350px;
            height: 350px;
            background-color: #5F5F5F;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .download-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #3A8F90;
            font-size: 1.2rem;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .download-btn .arrow {
            font-size: 2rem;
            line-height: 1;
        }

        /* BOTÃO CARTÃO DE VISITA */
        .cartao-btn-container {
            display: flex;
            justify-content: flex-end;
            margin: 0px 0;
        }

        .cartao-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #3A8F90;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .cartao-btn:hover {
            transform: scale(1.05);
        }

        .cartao-btn .arrow {
            font-size: 2rem;
            line-height: 1;
        }

        /* RODAPÉ */
        .footer {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 60px;
            padding: 20px 0;
        }

        .footer-logo {
            width: 90px;
            height: 40px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            border-radius: 4px;
        }

        /* LOADING TEMP */
        .loading-temp {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 10000;
        }



        

        .bg-image {
    position: fixed;
    inset: 0;
    z-index: -1; /* fica atrás de tudo */
    display: flex;
    justify-content: center;
    align-items: center;
}


.bg-image img {
    width: 500px; /* controla manualmente */
    height: 700px;
  
}

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .header {
                height: 50px;
            }

            .header-left h1 {
                font-size: 16px;
            }

            .header-left p {
                font-size: 10px;
            }

            .logo-gerar {
                width: 70px;
                height: 70px;
            }

            .preview-box {
                width: 130px;
                height: 130px;
            }

            .card-row {
                gap: 20px;
            }

            .footer {
                gap: 30px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

     <div class="bg-image">
    <img src="img2.png" alt="background">
</div>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <h1>Projeto Logomarca</h1>

                <p id="nomeAlunoHeader">Carregando...</p>
            </div>
            <div class="header-right">
                <div class="logo-gerar">GERAR</div>
            </div>
        </header>

        <!-- INFORMAÇÕES DO CLIENTE -->
        <div class="client-info" style="display: none;">
            <h3>📋 Dados do Cliente</h3>
            <div class="info-row">
                <span class="info-label">Nome:</span>
                <span class="info-value" id="clientName">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Empresa:</span>
                <span class="info-value" id="clientCompany">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email:</span>
                <span class="info-value" id="clientEmail">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Telefone:</span>
                <span class="info-value" id="clientPhone">-</span>
            </div>
        </div>

        <!-- CARDS DE VISUALIZAÇÃO -->
        <div class="cards-container">
            <!-- CARD 1 - LOGO COLORIDA -->
            <div class="card-row">
                <div class="preview-box" id="previewColorida">
                    <img id="logoColoridaImg" src="" alt="Logo Colorida" style="display: none;">
                </div>
                <button class="download-btn" onclick="baixarLogo('colorida')">
                    <span>Download Color</span>
                    <span class="arrow">▼</span>
                </button>
            </div>

            <!-- CARD 2 - LOGO PB -->
            <div class="card-row">
                <div class="preview-box" id="previewPB">
                    <img id="logoPBImg" src="" alt="Logo PB" style="display: none;">
                </div>
                <button class="download-btn" onclick="baixarLogo('pb')">
                    <span>Download PB</span>
                    <span class="arrow">▼</span>
                </button>
            </div>
        </div>

        <!-- BOTÃO CARTÃO DE VISITA -->
        <div class="cartao-btn-container">
            <button class="cartao-btn" onclick="irParaCartao()">
                <span>Cartão de Visita</span>
                <span class="arrow">▶</span>
            </button>
        </div>

        
    </div>

    <script>
        let clienteAtual = null;
        let logoPBBase64 = null;

        // Carregar dados do cliente
        document.addEventListener('DOMContentLoaded', function() {
            const clienteData = sessionStorage.getItem('clienteData');
            
            if (!clienteData) {

                alert('Nenhum dado de cliente encontrado. Volte para a tela inicial.');
                window.location.href = 'pag1.html';
                return;
            }

            clienteAtual = JSON.parse(clienteData);
            
            // Atualizar header
            document.getElementById('nomeAlunoHeader').textContent = clienteAtual.nome || 'Cliente';
            
            // Atualizar informações
            document.getElementById('clientName').textContent = clienteAtual.nome || 'Não informado';
            document.getElementById('clientCompany').textContent = clienteAtual.empresaNome || clienteAtual.nomeFantasia || 'Não informado';
            document.getElementById('clientEmail').textContent = clienteAtual.email || 'Não informado';
            document.getElementById('clientPhone').textContent = clienteAtual.telefone || 'Não informado';
            
            // Carregar logos
            carregarLogos();
        });

        // Converter para preto e branco
        async function converterParaPretoBranco(base64) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const red = data[i];
                        const green = data[i + 1];
                        const blue = data[i + 2];
                        
                        const gray = red * 0.299 + green * 0.587 + blue * 0.114;
                        
                        data[i] = gray;
                        data[i + 1] = gray;
                        data[i + 2] = gray;
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = base64;
            });
        }

        // Carregar logos
        async function carregarLogos() {
            const logoColoridaImg = document.getElementById('logoColoridaImg');
            const logoPBImg = document.getElementById('logoPBImg');
            
            if (clienteAtual.logoBase64) {
                // Mostrar logo colorida
                logoColoridaImg.src = clienteAtual.logoBase64;
                logoColoridaImg.style.display = 'block';
                
                // Converter e mostrar logo PB
                logoPBBase64 = await converterParaPretoBranco(clienteAtual.logoBase64);
                logoPBImg.src = logoPBBase64;
                logoPBImg.style.display = 'block';
            } else {
                // Não tem logo
                window.location.href = 'semlogo.html';

                
                // Mostrar texto nos previews
                document.getElementById('previewColorida').innerHTML = 'Sem logo';
                document.getElementById('previewPB').innerHTML = 'Sem logo';
            }
        }

        // Baixar logo
        function baixarLogo(tipo) {
            if (!clienteAtual) return;

            let dataUrl;
            let fileName;

            if (tipo === 'colorida') {
                if (!clienteAtual.logoBase64) {
                    alert('Logo colorida não disponível!');
                    return;
                }
                dataUrl = clienteAtual.logoBase64;
                fileName = `logo-colorida-${clienteAtual.nome || 'cliente'}.png`;
            } else {
                if (!logoPBBase64) {
                    alert('Logo PB não disponível!');
                    return;
                }
                dataUrl = logoPBBase64;
                fileName = `logo-pb-${clienteAtual.nome || 'cliente'}.png`;
            }

            const link = document.createElement('a');
            link.download = fileName;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Ir para tela do cartão
        function irParaCartao() {
            window.location.href = 'cartao.html';
        }
    </script>
</body>
</html>
