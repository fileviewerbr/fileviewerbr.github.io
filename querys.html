<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLR8</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset e configurações gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #0f4c75;
            --light-accent: #00b4d8;
            --text-color: #e6e6e6;
            --border-color: #2d4059;
            --success-color: #4CAF50;
            --sql-color: #00758f;
            --js-color: #f0db4f;
            --html-color: #e34c26;
            --css-color: #264de4;
            --text-type-color: #6c757d;
        }
        
        body {
            background-color: var(--primary-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Sidebar esquerda */
        .sidebar {
            width: 280px;
            background-color: var(--secondary-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .logo i {
            color: var(--light-accent);
            font-size: 24px;
        }
        
        .logo h1 {
            font-size: 20px;
        }
        
        .projects-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--light-accent);
        }
        
        .project-list {
            list-style: none;
            margin-bottom: 30px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .project-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .project-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .project-item.active {
            background-color: var(--accent-color);
            border-left: 4px solid var(--light-accent);
        }
        
        .project-name {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .project-count {
            background-color: var(--light-accent);
            color: var(--primary-color);
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .btn {
            padding: 12px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            background-color: var(--light-accent);
        }
        
        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
        }
        
        .btn-new-project {
            width: 100%;
            margin-bottom: 20px;
        }
        
        .btn-daily-report {
            width: 100%;
            margin-top: auto;
            background-color: #e67e22;
        }
        
        .btn-daily-report:hover {
            background-color: #d35400;
        }
        
        /* Área principal */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        
        .top-bar {
            padding: 20px;
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-section {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 600px;
        }
        
        .search-box, .filter-select, .sort-select {
            padding: 12px 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-color);
            font-size: 14px;
        }
        
        .search-box {
            flex-grow: 1;
        }
        
        .btn-new-entry {
            padding: 12px 20px;
        }
        
        /* Lista de registros */
        .entries-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .entries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .entries-header h2 {
            font-size: 18px;
        }
        
        .entries-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .entry-card {
            background-color: var(--secondary-color);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 250px;
        }
        
        .entry-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .entry-title {
            font-size: 18px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }
        
        .entry-type {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .entry-type.sql {
            background-color: var(--sql-color);
        }
        
        .entry-type.js {
            background-color: var(--js-color);
            color: #333;
        }
        
        .entry-type.html {
            background-color: var(--html-color);
        }
        
        .entry-type.css {
            background-color: var(--css-color);
        }
        
        .entry-type.text {
            background-color: var(--text-type-color);
        }
        
        .entry-content {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }
        
        .entry-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            max-height: 120px;
            overflow: hidden;
            color: #ccc;
        }
        
        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #aaa;
        }
        
        .entry-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .action-btn:hover {
            color: var(--light-accent);
        }
        
        /* Sidebar direita */
        .sidebar-right {
            width: 350px;
            background-color: var(--secondary-color);
            padding: 20px;
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .sidebar-right h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--light-accent);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title h3 {
            font-size: 16px;
            color: #ccc;
        }
        
        .activity-list, .case-list {
            list-style: none;
            margin-bottom: 30px;
        }
        
        .activity-item, .case-item {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .activity-item:hover, .case-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .activity-header, .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .activity-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .activity-checkbox input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .activity-title, .case-title {
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }
        
        .activity-description, .case-description {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .activity-actions, .case-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }
        
        .activity-completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        
        .empty-right {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background-color: var(--secondary-color);
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 20px;
            background-color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 20px;
        }
        
        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-color);
            font-size: 14px;
        }
        
        textarea.form-control {
            min-height: 150px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        
        .modal-footer {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .btn-cancel {
            background-color: #6c757d;
        }
        
        .btn-cancel:hover {
            background-color: #5a6268;
        }
        
        /* Modal de relatório diário */
        .daily-report-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        
        .date-display {
            font-size: 18px;
            font-weight: 600;
        }
        
        .daily-activities-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .daily-activity-card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        
        .daily-activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .daily-activity-title {
            font-weight: 600;
            font-size: 16px;
        }
        
        .daily-activity-time {
            font-size: 12px;
            color: #aaa;
        }
        
        .daily-activity-description {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }
        
        /* Status e mensagens */
        .status-message {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status-message.success {
            background-color: rgba(76, 175, 80, 0.2);
            border-left: 4px solid var(--success-color);
            display: block;
        }
        
        .status-message.error {
            background-color: rgba(220, 53, 69, 0.2);
            border-left: 4px solid #dc3545;
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--border-color);
        }
        
        .checkbox-done {
            color: var(--success-color);
        }
        
        /* Responsividade */
        @media (max-width: 1400px) {
            .sidebar-right {
                width: 300px;
            }
        }
        
        @media (max-width: 1200px) {
            body {
                flex-wrap: wrap;
            }
            
            .sidebar-right {
                width: 100%;
                order: 3;
            }
            
            .entries-list {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }
        
        @media (max-width: 900px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            
            .sidebar-right {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
            
            .project-list {
                max-height: 200px;
            }
            
            .top-bar {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .search-section {
                max-width: 100%;
                order: 2;
            }
            
            .btn-new-entry {
                order: 1;
            }
        }
        
        @media (max-width: 600px) {
            .entries-list {
                grid-template-columns: 1fr;
            }
            
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar com projetos -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <h1>XLR8</h1>
        </div>
        
        <button class="btn btn-new-project" id="newProjectBtn">
            <i class="fas fa-plus"></i> Novo Projeto
        </button>
        
        <div class="projects-section">
            <h2>Projetos</h2>
            <ul class="project-list" id="projectList">
                <!-- Projetos serão carregados aqui -->
            </ul>
        </div>
        
        <button class="btn btn-daily-report" id="dailyReportBtn">
            <i class="fas fa-calendar-check"></i> Relatório Diário
        </button>
        
        <div class="status-message" id="sidebarStatus"></div>
    </aside>
    
    <!-- Conteúdo principal -->
    <main class="main-content">
        <!-- Barra superior com busca e filtros -->
        <div class="top-bar">
            <div class="search-section">
                <input type="text" class="search-box" id="searchBox" placeholder="Buscar por título ou conteúdo...">
                <select class="filter-select" id="projectFilter">
                    <option value="all">Todos os projetos</option>
                </select>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Mais recentes</option>
                    <option value="oldest">Mais antigos</option>
                    <option value="title">A-Z (título)</option>
                </select>
            </div>
            
            <button class="btn btn-new-entry" id="newEntryBtn">
                <i class="fas fa-plus"></i> Nova Query
            </button>
        </div>
        
        <!-- Container de registros -->
        <div class="entries-container">
            <div class="entries-header">
                <h2 id="entriesTitle">Todas as queries</h2>
                <span id="entriesCount">0 registros</span>
            </div>
            
            <div class="status-message" id="entriesStatus"></div>
            
            <div class="entries-list" id="entriesList">
                <!-- Registros serão carregados aqui -->
            </div>
        </div>
    </main>
    
    <!-- Sidebar direita com atividades e cases -->
    <aside class="sidebar-right" id="sidebarRight">
        <h2>Atividades & Cases</h2>
        
        <!-- Seção de Atividades -->
        <div class="section-title">
            <h3>Atividades</h3>
            <button class="btn btn-small" id="newActivityBtn">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        <ul class="activity-list" id="activityList">
            <!-- Atividades serão carregadas aqui -->
        </ul>
        
        <!-- Seção de Cases -->
        <div class="section-title">
            <h3>Cases (Philips)</h3>
            <button class="btn btn-small" id="newCaseBtn">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        <ul class="case-list" id="caseList">
            <!-- Cases serão carregados aqui -->
        </ul>
    </aside>
    
    <!-- Modal para criar/editar projetos -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="projectModalTitle">Novo Projeto</h2>
                <button class="close-modal" id="closeProjectModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="projectName">Nome do Projeto</label>
                    <input type="text" class="form-control" id="projectName" placeholder="Digite o nome do projeto">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelProjectBtn">Cancelar</button>
                <button class="btn" id="saveProjectBtn">Salvar Projeto</button>
            </div>
        </div>
    </div>
    
    <!-- Modal para criar/editar queries -->
    <div class="modal" id="entryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="entryModalTitle">Nova Query</h2>
                <button class="close-modal" id="closeEntryModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="entryTitle">Título</label>
                    <input type="text" class="form-control" id="entryTitle" placeholder="Digite o título da query">
                </div>
                
                <div class="form-group">
                    <label for="entryType">Tipo de Conteúdo</label>
                    <select class="form-control" id="entryType">
                        <option value="SQL">SQL</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="HTML">HTML</option>
                        <option value="CSS">CSS</option>
                        <option value="Texto">Texto</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="entryProject">Projeto</label>
                    <select class="form-control" id="entryProject">
                        <!-- Projetos serão carregados aqui -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="entryContent">Conteúdo</label>
                    <textarea class="form-control" id="entryContent" placeholder="Cole ou digite seu código aqui..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelEntryBtn">Cancelar</button>
                <button class="btn" id="saveEntryBtn">Salvar Query</button>
            </div>
        </div>
    </div>
    
    <!-- Modal para atividades -->
    <div class="modal" id="activityModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="activityModalTitle">Nova Atividade</h2>
                <button class="close-modal" id="closeActivityModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="activityTitle">Título</label>
                    <input type="text" class="form-control" id="activityTitle" placeholder="Digite o título da atividade">
                </div>
                <div class="form-group">
                    <label for="activityDescription">Descrição</label>
                    <textarea class="form-control" id="activityDescription" placeholder="Descreva a atividade..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelActivityBtn">Cancelar</button>
                <button class="btn" id="saveActivityBtn">Salvar Atividade</button>
            </div>
        </div>
    </div>
    
    <!-- Modal para cases -->
    <div class="modal" id="caseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="caseModalTitle">Novo Case</h2>
                <button class="close-modal" id="closeCaseModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="caseTitle">Número do Case</label>
                    <input type="text" class="form-control" id="caseTitle" placeholder="Ex: CASE-12345">
                </div>
                <div class="form-group">
                    <label for="caseDescription">Descrição / Status</label>
                    <textarea class="form-control" id="caseDescription" placeholder="Ex: Philips respondeu que precisa de mais logs..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelCaseBtn">Cancelar</button>
                <button class="btn" id="saveCaseBtn">Salvar Case</button>
            </div>
        </div>
    </div>
    
    <!-- Modal para relatório diário -->
    <div class="modal" id="dailyReportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Relatório Diário</h2>
                <button class="close-modal" id="closeDailyReportModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="daily-report-navigation">
                    <button class="btn btn-small" id="prevDayBtn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="date-display" id="currentDateDisplay"></span>
                    <button class="btn btn-small" id="nextDayBtn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <div class="form-group">
                    <label for="dailyActivityTitle">Título da Atividade</label>
                    <input type="text" class="form-control" id="dailyActivityTitle" placeholder="O que você fez?">
                </div>
                
                <div class="form-group">
                    <label for="dailyActivityDescription">Descrição</label>
                    <textarea class="form-control" id="dailyActivityDescription" placeholder="Descreva a atividade..."></textarea>
                </div>
                
                <button class="btn" id="addDailyActivityBtn" style="width: 100%; margin-bottom: 20px;">
                    <i class="fas fa-plus"></i> Adicionar Atividade
                </button>
                
                <h3 style="margin-bottom: 15px;">Atividades do dia</h3>
                <div class="daily-activities-list" id="dailyActivitiesList">
                    <!-- Atividades do dia serão carregadas aqui -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configurações do Firebase
        const FIREBASE_URL = 'https://appatividades-7450d-default-rtdb.firebaseio.com/';
        
        // Estado da aplicação
        let state = {
            projects: {},
            entries: {},
            activities: {},
            cases: {},
            dailyReports: {},
            selectedProject: 'all',
            searchTerm: '',
            sortBy: 'newest',
            editingProjectId: null,
            editingEntryId: null,
            editingActivityId: null,
            editingCaseId: null,
            currentDailyDate: new Date().toISOString().split('T')[0]
        };
        
        // Elementos do DOM
        const projectList = document.getElementById('projectList');
        const entriesList = document.getElementById('entriesList');
        const entriesTitle = document.getElementById('entriesTitle');
        const entriesCount = document.getElementById('entriesCount');
        const searchBox = document.getElementById('searchBox');
        const projectFilter = document.getElementById('projectFilter');
        const sortSelect = document.getElementById('sortSelect');
        const newProjectBtn = document.getElementById('newProjectBtn');
        const newEntryBtn = document.getElementById('newEntryBtn');
        const dailyReportBtn = document.getElementById('dailyReportBtn');
        const sidebarRight = document.getElementById('sidebarRight');
        const activityList = document.getElementById('activityList');
        const caseList = document.getElementById('caseList');
        const newActivityBtn = document.getElementById('newActivityBtn');
        const newCaseBtn = document.getElementById('newCaseBtn');
        
        // Elementos de status
        const sidebarStatus = document.getElementById('sidebarStatus');
        const entriesStatus = document.getElementById('entriesStatus');
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadAllData();
            setupEventListeners();
        });
        
        // Carregar todos os dados
        async function loadAllData() {
            await loadProjects();
            await loadEntries();
            await loadActivities();
            await loadCases();
            await loadDailyReports();
        }
        
        // Configurar event listeners
        function setupEventListeners() {
            // Busca
            searchBox.addEventListener('input', (e) => {
                state.searchTerm = e.target.value.toLowerCase();
                renderEntries();
            });
            
            // Filtro por projeto
            projectFilter.addEventListener('change', (e) => {
                state.selectedProject = e.target.value;
                updateEntriesTitle();
                renderEntries();
                renderSidebarRight();
            });
            
            // Ordenação
            sortSelect.addEventListener('change', (e) => {
                state.sortBy = e.target.value;
                renderEntries();
            });
            
            // Botões principais
            newProjectBtn.addEventListener('click', () => openProjectModal());
            newEntryBtn.addEventListener('click', () => openEntryModal());
            dailyReportBtn.addEventListener('click', openDailyReportModal);
            newActivityBtn.addEventListener('click', () => openActivityModal());
            newCaseBtn.addEventListener('click', () => openCaseModal());
            
            // Modais
            document.getElementById('closeProjectModal').addEventListener('click', closeProjectModalHandler);
            document.getElementById('cancelProjectBtn').addEventListener('click', closeProjectModalHandler);
            document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
            
            document.getElementById('closeEntryModal').addEventListener('click', closeEntryModalHandler);
            document.getElementById('cancelEntryBtn').addEventListener('click', closeEntryModalHandler);
            document.getElementById('saveEntryBtn').addEventListener('click', saveEntry);
            
            document.getElementById('closeActivityModal').addEventListener('click', closeActivityModalHandler);
            document.getElementById('cancelActivityBtn').addEventListener('click', closeActivityModalHandler);
            document.getElementById('saveActivityBtn').addEventListener('click', saveActivity);
            
            document.getElementById('closeCaseModal').addEventListener('click', closeCaseModalHandler);
            document.getElementById('cancelCaseBtn').addEventListener('click', closeCaseModalHandler);
            document.getElementById('saveCaseBtn').addEventListener('click', saveCase);
            
            document.getElementById('closeDailyReportModal').addEventListener('click', closeDailyReportModalHandler);
            document.getElementById('prevDayBtn').addEventListener('click', () => changeDailyDate(-1));
            document.getElementById('nextDayBtn').addEventListener('click', () => changeDailyDate(1));
            document.getElementById('addDailyActivityBtn').addEventListener('click', addDailyActivity);
            
            // Fechar modais ao clicar fora
            window.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) {
                    closeAllModals();
                }
            });
        }
        
        // Carregar projetos
        async function loadProjects() {
            try {
                const response = await fetch(`${FIREBASE_URL}/projects.json`);
                const data = await response.json();
                state.projects = data || {};
                renderProjects();
                updateProjectFilter();
                updateEntryProjectSelect();
                
                if (Object.keys(state.projects).length === 0) {
                    await createDefaultProject();
                }
            } catch (error) {
                console.error('Erro ao carregar projetos:', error);
                showStatus(sidebarStatus, 'Erro ao carregar projetos', 'error');
            }
        }
        
        // Carregar queries
        async function loadEntries() {
            try {
                const response = await fetch(`${FIREBASE_URL}/entries.json`);
                const data = await response.json();
                state.entries = data || {};
                renderEntries();
            } catch (error) {
                console.error('Erro ao carregar queries:', error);
                showStatus(entriesStatus, 'Erro ao carregar queries', 'error');
            }
        }
        
        // Carregar atividades
        async function loadActivities() {
            try {
                const response = await fetch(`${FIREBASE_URL}/activities.json`);
                const data = await response.json();
                state.activities = data || {};
                renderSidebarRight();
            } catch (error) {
                console.error('Erro ao carregar atividades:', error);
            }
        }
        
        // Carregar cases
        async function loadCases() {
            try {
                const response = await fetch(`${FIREBASE_URL}/cases.json`);
                const data = await response.json();
                state.cases = data || {};
                renderSidebarRight();
            } catch (error) {
                console.error('Erro ao carregar cases:', error);
            }
        }
        
        // Carregar relatórios diários
        async function loadDailyReports() {
            try {
                const response = await fetch(`${FIREBASE_URL}/dailyReports.json`);
                const data = await response.json();
                state.dailyReports = data || {};
            } catch (error) {
                console.error('Erro ao carregar relatórios:', error);
            }
        }
        
        // Criar projeto padrão
        async function createDefaultProject() {
            const defaultProject = {
                name: "Projeto Principal",
                createdAt: Date.now()
            };
            
            try {
                await fetch(`${FIREBASE_URL}/projects.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(defaultProject)
                });
                await loadProjects();
                showStatus(sidebarStatus, 'Projeto padrão criado com sucesso', 'success');
            } catch (error) {
                console.error('Erro ao criar projeto padrão:', error);
            }
        }
        
        // Renderizar projetos
        function renderProjects() {
            projectList.innerHTML = '';
            
            const allProjectsItem = document.createElement('li');
            allProjectsItem.className = `project-item ${state.selectedProject === 'all' ? 'active' : ''}`;
            allProjectsItem.dataset.projectId = 'all';
            allProjectsItem.innerHTML = `
                <span class="project-name">Todos os projetos</span>
                <span class="project-count">${Object.keys(state.entries).length}</span>
            `;
            allProjectsItem.addEventListener('click', () => selectProject('all'));
            projectList.appendChild(allProjectsItem);
            
            Object.entries(state.projects).forEach(([projectId, project]) => {
                const entryCount = Object.values(state.entries).filter(entry => entry.projectId === projectId).length;
                
                const projectItem = document.createElement('li');
                projectItem.className = `project-item ${state.selectedProject === projectId ? 'active' : ''}`;
                projectItem.dataset.projectId = projectId;
                projectItem.innerHTML = `
                    <span class="project-name">${project.name}</span>
                    <span class="project-count">${entryCount}</span>
                `;
                projectItem.addEventListener('click', () => selectProject(projectId));
                projectItem.addEventListener('dblclick', () => editProject(projectId));
                projectList.appendChild(projectItem);
            });
            
            updateEntriesTitle();
        }
        
        // Selecionar projeto
        function selectProject(projectId) {
            state.selectedProject = projectId;
            projectFilter.value = projectId;
            renderProjects();
            renderEntries();
            renderSidebarRight();
        }
        
        // Renderizar sidebar direita
        function renderSidebarRight() {
            renderActivities();
            renderCases();
        }
        
        // Renderizar atividades
        function renderActivities() {
            activityList.innerHTML = '';
            
            const filteredActivities = Object.entries(state.activities).filter(([_, activity]) => {
                if (state.selectedProject === 'all') return true;
                return activity.projectId === state.selectedProject;
            });
            
            if (filteredActivities.length === 0) {
                activityList.innerHTML = '<div class="empty-right">Nenhuma atividade</div>';
                return;
            }
            
            filteredActivities.forEach(([activityId, activity]) => {
                const activityItem = document.createElement('li');
                activityItem.className = 'activity-item';
                activityItem.innerHTML = `
                    <div class="activity-header">
                        <div class="activity-checkbox">
                            <input type="checkbox" ${activity.completed ? 'checked' : ''} data-activity-id="${activityId}">
                            <span class="activity-title ${activity.completed ? 'activity-completed' : ''}">${activity.title}</span>
                        </div>
                        <div class="activity-actions">
                            <button class="action-btn edit-activity" data-activity-id="${activityId}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-activity" data-activity-id="${activityId}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    ${activity.description ? `<div class="activity-description">${activity.description}</div>` : ''}
                `;
                
                activityList.appendChild(activityItem);
            });
            
            // Event listeners para atividades
            document.querySelectorAll('.activity-checkbox input').forEach(checkbox => {
                checkbox.addEventListener('change', toggleActivityComplete);
            });
            
            document.querySelectorAll('.edit-activity').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const activityId = btn.dataset.activityId;
                    openActivityModal(activityId);
                });
            });
            
            document.querySelectorAll('.delete-activity').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const activityId = btn.dataset.activityId;
                    deleteActivity(activityId);
                });
            });
        }
        
        // Renderizar cases
        function renderCases() {
            caseList.innerHTML = '';
            
            const filteredCases = Object.entries(state.cases).filter(([_, caseItem]) => {
                if (state.selectedProject === 'all') return true;
                return caseItem.projectId === state.selectedProject;
            });
            
            if (filteredCases.length === 0) {
                caseList.innerHTML = '<div class="empty-right">Nenhum case</div>';
                return;
            }
            
            filteredCases.forEach(([caseId, caseItem]) => {
                const caseElement = document.createElement('li');
                caseElement.className = 'case-item';
                caseElement.innerHTML = `
                    <div class="case-header">
                        <span class="case-title">${caseItem.title}</span>
                        <div class="case-actions">
                            <button class="action-btn edit-case" data-case-id="${caseId}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-case" data-case-id="${caseId}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    ${caseItem.description ? `<div class="case-description">${caseItem.description}</div>` : ''}
                `;
                
                caseElement.addEventListener('click', () => openCaseDetailModal(caseItem));
                caseList.appendChild(caseElement);
            });
            
            // Event listeners para cases
            document.querySelectorAll('.edit-case').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const caseId = btn.dataset.caseId;
                    openCaseModal(caseId);
                });
            });
            
            document.querySelectorAll('.delete-case').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const caseId = btn.dataset.caseId;
                    deleteCase(caseId);
                });
            });
        }
        
        // Alternar checkbox de atividade
        async function toggleActivityComplete(e) {
            const activityId = e.target.dataset.activityId;
            const activity = state.activities[activityId];
            
            if (!activity) return;
            
            activity.completed = e.target.checked;
            
            try {
                await fetch(`${FIREBASE_URL}/activities/${activityId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: activity.completed })
                });
                
                await loadActivities();
            } catch (error) {
                console.error('Erro ao atualizar atividade:', error);
            }
        }
        
        // Abrir modal de atividade
        function openActivityModal(activityId = null) {
            if (!state.selectedProject || state.selectedProject === 'all') {
                alert('Selecione um projeto primeiro');
                return;
            }
            
            state.editingActivityId = activityId;
            const modal = document.getElementById('activityModal');
            const title = document.getElementById('activityModalTitle');
            
            if (activityId) {
                const activity = state.activities[activityId];
                title.textContent = 'Editar Atividade';
                document.getElementById('activityTitle').value = activity.title;
                document.getElementById('activityDescription').value = activity.description || '';
            } else {
                title.textContent = 'Nova Atividade';
                document.getElementById('activityTitle').value = '';
                document.getElementById('activityDescription').value = '';
            }
            
            modal.classList.add('active');
            document.getElementById('activityTitle').focus();
        }
        
        // Fechar modal de atividade
        function closeActivityModalHandler() {
            document.getElementById('activityModal').classList.remove('active');
            state.editingActivityId = null;
        }
        
        // Salvar atividade
        async function saveActivity() {
            const title = document.getElementById('activityTitle').value.trim();
            const description = document.getElementById('activityDescription').value.trim();
            
            if (!title) {
                alert('Digite um título para a atividade');
                return;
            }
            
            const activityData = {
                title,
                description,
                projectId: state.selectedProject,
                completed: state.editingActivityId ? state.activities[state.editingActivityId].completed : false,
                createdAt: state.editingActivityId ? state.activities[state.editingActivityId].createdAt : Date.now()
            };
            
            try {
                if (state.editingActivityId) {
                    await fetch(`${FIREBASE_URL}/activities/${state.editingActivityId}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(activityData)
                    });
                } else {
                    await fetch(`${FIREBASE_URL}/activities.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(activityData)
                    });
                }
                
                closeActivityModalHandler();
                await loadActivities();
            } catch (error) {
                console.error('Erro ao salvar atividade:', error);
            }
        }
        
        // Deletar atividade
        async function deleteActivity(activityId) {
            if (!confirm('Tem certeza que deseja excluir esta atividade?')) return;
            
            try {
                await fetch(`${FIREBASE_URL}/activities/${activityId}.json`, {
                    method: 'DELETE'
                });
                await loadActivities();
            } catch (error) {
                console.error('Erro ao deletar atividade:', error);
            }
        }
        
        // Abrir modal de case
        function openCaseModal(caseId = null) {
            if (!state.selectedProject || state.selectedProject === 'all') {
                alert('Selecione um projeto primeiro');
                return;
            }
            
            state.editingCaseId = caseId;
            const modal = document.getElementById('caseModal');
            const title = document.getElementById('caseModalTitle');
            
            if (caseId) {
                const caseItem = state.cases[caseId];
                title.textContent = 'Editar Case';
                document.getElementById('caseTitle').value = caseItem.title;
                document.getElementById('caseDescription').value = caseItem.description || '';
            } else {
                title.textContent = 'Novo Case';
                document.getElementById('caseTitle').value = '';
                document.getElementById('caseDescription').value = '';
            }
            
            modal.classList.add('active');
            document.getElementById('caseTitle').focus();
        }
        
        // Abrir modal de detalhes do case
        function openCaseDetailModal(caseItem) {
            const modal = document.getElementById('caseModal');
            document.getElementById('caseModalTitle').textContent = 'Detalhes do Case';
            document.getElementById('caseTitle').value = caseItem.title;
            document.getElementById('caseDescription').value = caseItem.description || '';
            modal.classList.add('active');
        }
        
        // Fechar modal de case
        function closeCaseModalHandler() {
            document.getElementById('caseModal').classList.remove('active');
            state.editingCaseId = null;
        }
        
        // Salvar case
        async function saveCase() {
            const title = document.getElementById('caseTitle').value.trim();
            const description = document.getElementById('caseDescription').value.trim();
            
            if (!title) {
                alert('Digite o número do case');
                return;
            }
            
            const caseData = {
                title,
                description,
                projectId: state.selectedProject,
                createdAt: state.editingCaseId ? state.cases[state.editingCaseId].createdAt : Date.now()
            };
            
            try {
                if (state.editingCaseId) {
                    await fetch(`${FIREBASE_URL}/cases/${state.editingCaseId}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(caseData)
                    });
                } else {
                    await fetch(`${FIREBASE_URL}/cases.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(caseData)
                    });
                }
                
                closeCaseModalHandler();
                await loadCases();
            } catch (error) {
                console.error('Erro ao salvar case:', error);
            }
        }
        
        // Deletar case
        async function deleteCase(caseId) {
            if (!confirm('Tem certeza que deseja excluir este case?')) return;
            
            try {
                await fetch(`${FIREBASE_URL}/cases/${caseId}.json`, {
                    method: 'DELETE'
                });
                await loadCases();
            } catch (error) {
                console.error('Erro ao deletar case:', error);
            }
        }
        
        // Abrir modal de relatório diário
        function openDailyReportModal() {
            const modal = document.getElementById('dailyReportModal');
            updateDailyReportDisplay();
            modal.classList.add('active');
        }
        
        // Fechar modal de relatório diário
        function closeDailyReportModalHandler() {
            document.getElementById('dailyReportModal').classList.remove('active');
        }
        
        // Mudar data do relatório diário
        function changeDailyDate(days) {
            const currentDate = new Date(state.currentDailyDate);
            currentDate.setDate(currentDate.getDate() + days);
            state.currentDailyDate = currentDate.toISOString().split('T')[0];
            updateDailyReportDisplay();
        }
        
        // Atualizar exibição do relatório diário
        function updateDailyReportDisplay() {
            document.getElementById('currentDateDisplay').textContent = formatDate(state.currentDailyDate);
            renderDailyActivities();
        }
        
        // Formatar data
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', {
                weekday: 'long',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }
        
        // Renderizar atividades diárias
        function renderDailyActivities() {
            const activitiesList = document.getElementById('dailyActivitiesList');
            activitiesList.innerHTML = '';
            
            const dailyReport = state.dailyReports[state.currentDailyDate];
            
            if (!dailyReport || !dailyReport.activities || Object.keys(dailyReport.activities).length === 0) {
                activitiesList.innerHTML = '<div class="empty-state"><i class="fas fa-calendar-day"></i><h3>Nenhuma atividade registrada</h3></div>';
                return;
            }
            
            Object.entries(dailyReport.activities).forEach(([activityId, activity]) => {
                const activityCard = document.createElement('div');
                activityCard.className = 'daily-activity-card';
                
                const time = new Date(activity.createdAt).toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                activityCard.innerHTML = `
                    <div class="daily-activity-header">
                        <span class="daily-activity-title">${activity.title}</span>
                        <div>
                            <span class="daily-activity-time">${time}</span>
                            <button class="action-btn delete-daily-activity" data-date="${state.currentDailyDate}" data-activity-id="${activityId}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    ${activity.description ? `<div class="daily-activity-description">${activity.description}</div>` : ''}
                `;
                
                activitiesList.appendChild(activityCard);
            });
            
            // Event listeners para deletar atividades diárias
            document.querySelectorAll('.delete-daily-activity').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const date = btn.dataset.date;
                    const activityId = btn.dataset.activityId;
                    await deleteDailyActivity(date, activityId);
                });
            });
        }
        
        // Adicionar atividade diária
        async function addDailyActivity() {
            const title = document.getElementById('dailyActivityTitle').value.trim();
            const description = document.getElementById('dailyActivityDescription').value.trim();
            
            if (!title) {
                alert('Digite um título para a atividade');
                return;
            }
            
            const activityData = {
                title,
                description,
                createdAt: Date.now()
            };
            
            try {
                await fetch(`${FIREBASE_URL}/dailyReports/${state.currentDailyDate}/activities.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(activityData)
                });
                
                document.getElementById('dailyActivityTitle').value = '';
                document.getElementById('dailyActivityDescription').value = '';
                
                await loadDailyReports();
                renderDailyActivities();
            } catch (error) {
                console.error('Erro ao adicionar atividade diária:', error);
            }
        }
        
        // Deletar atividade diária
        async function deleteDailyActivity(date, activityId) {
            if (!confirm('Tem certeza que deseja excluir esta atividade?')) return;
            
            try {
                await fetch(`${FIREBASE_URL}/dailyReports/${date}/activities/${activityId}.json`, {
                    method: 'DELETE'
                });
                
                await loadDailyReports();
                renderDailyActivities();
            } catch (error) {
                console.error('Erro ao deletar atividade diária:', error);
            }
        }
        
        // Fechar todos os modais
        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('active');
            });
        }
        
        // Restante das funções existentes (renderEntries, saveEntry, etc.)
        // ... (mantenha as funções existentes do código original)
        
        function renderEntries() {
            entriesList.innerHTML = '';
            
            let filteredEntries = Object.entries(state.entries);
            
            if (state.selectedProject !== 'all') {
                filteredEntries = filteredEntries.filter(([_, entry]) => entry.projectId === state.selectedProject);
            }
            
            if (state.searchTerm) {
                filteredEntries = filteredEntries.filter(([_, entry]) => {
                    return entry.title.toLowerCase().includes(state.searchTerm) || 
                           entry.content.toLowerCase().includes(state.searchTerm);
                });
            }
            
            filteredEntries.sort((a, b) => {
                const entryA = a[1];
                const entryB = b[1];
                
                switch (state.sortBy) {
                    case 'newest': return entryB.createdAt - entryA.createdAt;
                    case 'oldest': return entryA.createdAt - entryB.createdAt;
                    case 'title': return entryA.title.localeCompare(entryB.title);
                    default: return entryB.createdAt - entryA.createdAt;
                }
            });
            
            entriesCount.textContent = `${filteredEntries.length} registro${filteredEntries.length !== 1 ? 's' : ''}`;
            
            if (filteredEntries.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                
                if (state.searchTerm || state.selectedProject !== 'all') {
                    emptyState.innerHTML = '<i class="fas fa-search"></i><h3>Nenhum resultado encontrado</h3><p>Tente ajustar sua busca ou filtro</p>';
                } else {
                    emptyState.innerHTML = '<i class="fas fa-code"></i><h3>Nenhuma query salva ainda</h3><p>Clique em "Nova Query" para adicionar sua primeira query</p>';
                }
                
                entriesList.appendChild(emptyState);
                return;
            }
            
            filteredEntries.forEach(([entryId, entry]) => {
                const entryCard = document.createElement('div');
                entryCard.className = 'entry-card';
                
                const createdAt = new Date(entry.createdAt);
                const formattedDate = createdAt.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                
                let previewContent = entry.content;
                if (previewContent.length > 200) {
                    previewContent = previewContent.substring(0, 200) + '...';
                }
                
                entryCard.innerHTML = `
                    <div class="entry-header">
                        <div class="entry-title" title="${entry.title}">${entry.title}</div>
                        <div class="entry-type ${entry.type.toLowerCase()}">${entry.type}</div>
                    </div>
                    <div class="entry-content">
                        <pre>${previewContent}</pre>
                    </div>
                    <div class="entry-footer">
                        <div class="entry-date">${formattedDate}</div>
                        <div class="entry-actions">
                            <button class="action-btn" title="Copiar" data-action="copy" data-entry-id="${entryId}">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button class="action-btn" title="Editar" data-action="edit" data-entry-id="${entryId}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn" title="Excluir" data-action="delete" data-entry-id="${entryId}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                entriesList.appendChild(entryCard);
            });
            
            document.querySelectorAll('[data-action="copy"]').forEach(btn => {
                btn.addEventListener('click', copyEntryContent);
            });
            
            document.querySelectorAll('[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', editEntry);
            });
            
            document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', deleteEntry);
            });
        }
        
        function updateProjectFilter() {
            const currentValue = projectFilter.value;
            projectFilter.innerHTML = '<option value="all">Todos os projetos</option>';
            
            Object.entries(state.projects).forEach(([projectId, project]) => {
                const option = document.createElement('option');
                option.value = projectId;
                option.textContent = project.name;
                projectFilter.appendChild(option);
            });
            
            projectFilter.value = currentValue;
        }
        
        function updateEntryProjectSelect() {
            const currentValue = document.getElementById('entryProject').value;
            document.getElementById('entryProject').innerHTML = '';
            
            Object.entries(state.projects).forEach(([projectId, project]) => {
                const option = document.createElement('option');
                option.value = projectId;
                option.textContent = project.name;
                document.getElementById('entryProject').appendChild(option);
            });
            
            if (currentValue && state.projects[currentValue]) {
                document.getElementById('entryProject').value = currentValue;
            } else if (state.selectedProject !== 'all' && state.projects[state.selectedProject]) {
                document.getElementById('entryProject').value = state.selectedProject;
            }
        }
        
        function updateEntriesTitle() {
            if (state.selectedProject === 'all') {
                entriesTitle.textContent = 'Todas as queries';
            } else {
                const project = state.projects[state.selectedProject];
                entriesTitle.textContent = project ? `Queries: ${project.name}` : 'Queries';
            }
        }
        
        function openProjectModal(projectId = null) {
            state.editingProjectId = projectId;
            const modal = document.getElementById('projectModal');
            
            if (projectId) {
                document.getElementById('projectModalTitle').textContent = 'Editar Projeto';
                document.getElementById('projectName').value = state.projects[projectId].name;
            } else {
                document.getElementById('projectModalTitle').textContent = 'Novo Projeto';
                document.getElementById('projectName').value = '';
            }
            
            modal.classList.add('active');
            document.getElementById('projectName').focus();
        }
        
        function closeProjectModalHandler() {
            document.getElementById('projectModal').classList.remove('active');
            state.editingProjectId = null;
        }
        
        async function saveProject() {
            const projectName = document.getElementById('projectName').value.trim();
            
            if (!projectName) {
                alert('Por favor, digite um nome para o projeto');
                return;
            }
            
            const projectData = {
                name: projectName,
                createdAt: state.editingProjectId ? state.projects[state.editingProjectId].createdAt : Date.now()
            };
            
            try {
                if (state.editingProjectId) {
                    await fetch(`${FIREBASE_URL}/projects/${state.editingProjectId}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(projectData)
                    });
                    showStatus(sidebarStatus, 'Projeto atualizado com sucesso', 'success');
                } else {
                    await fetch(`${FIREBASE_URL}/projects.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(projectData)
                    });
                    showStatus(sidebarStatus, 'Projeto criado com sucesso', 'success');
                }
                
                closeProjectModalHandler();
                await loadProjects();
            } catch (error) {
                console.error('Erro ao salvar projeto:', error);
                showStatus(sidebarStatus, 'Erro ao salvar projeto', 'error');
            }
        }
        
        function editProject(projectId) {
            openProjectModal(projectId);
        }
        
        function openEntryModal(entryId = null) {
            state.editingEntryId = entryId;
            updateEntryProjectSelect();
            
            if (entryId) {
                document.getElementById('entryModalTitle').textContent = 'Editar Query';
                const entry = state.entries[entryId];
                document.getElementById('entryTitle').value = entry.title;
                document.getElementById('entryType').value = entry.type;
                document.getElementById('entryProject').value = entry.projectId;
                document.getElementById('entryContent').value = entry.content;
            } else {
                document.getElementById('entryModalTitle').textContent = 'Nova Query';
                document.getElementById('entryTitle').value = '';
                document.getElementById('entryType').value = 'SQL';
                document.getElementById('entryContent').value = '';
                
                if (state.selectedProject !== 'all' && state.projects[state.selectedProject]) {
                    document.getElementById('entryProject').value = state.selectedProject;
                }
            }
            
            document.getElementById('entryModal').classList.add('active');
            document.getElementById('entryTitle').focus();
        }
        
        function closeEntryModalHandler() {
            document.getElementById('entryModal').classList.remove('active');
            state.editingEntryId = null;
        }
        
        async function saveEntry() {
            const title = document.getElementById('entryTitle').value.trim();
            const type = document.getElementById('entryType').value;
            const projectId = document.getElementById('entryProject').value;
            const content = document.getElementById('entryContent').value.trim();
            
            if (!title || !projectId || !content) {
                alert('Preencha todos os campos obrigatórios');
                return;
            }
            
            const entryData = {
                title,
                type,
                projectId,
                content,
                createdAt: state.editingEntryId ? state.entries[state.editingEntryId].createdAt : Date.now()
            };
            
            try {
                if (state.editingEntryId) {
                    await fetch(`${FIREBASE_URL}/entries/${state.editingEntryId}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(entryData)
                    });
                    showStatus(entriesStatus, 'Query atualizada com sucesso', 'success');
                } else {
                    await fetch(`${FIREBASE_URL}/entries.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(entryData)
                    });
                    showStatus(entriesStatus, 'Query criada com sucesso', 'success');
                }
                
                closeEntryModalHandler();
                await loadEntries();
                await loadProjects();
            } catch (error) {
                console.error('Erro ao salvar query:', error);
                showStatus(entriesStatus, 'Erro ao salvar query', 'error');
            }
        }
        
        function copyEntryContent(e) {
            const entryId = e.currentTarget.dataset.entryId;
            const entry = state.entries[entryId];
            
            navigator.clipboard.writeText(entry.content)
                .then(() => {
                    const btn = e.currentTarget;
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    btn.style.color = '#4CAF50';
                    
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.style.color = '';
                    }, 1000);
                })
                .catch(err => {
                    console.error('Erro ao copiar:', err);
                });
        }
        
        function editEntry(e) {
            const entryId = e.currentTarget.dataset.entryId;
            openEntryModal(entryId);
        }
        
        async function deleteEntry(e) {
            const entryId = e.currentTarget.dataset.entryId;
            const entry = state.entries[entryId];
            
            if (!confirm(`Tem certeza que deseja excluir a query "${entry.title}"?`)) return;
            
            try {
                await fetch(`${FIREBASE_URL}/entries/${entryId}.json`, {
                    method: 'DELETE'
                });
                
                showStatus(entriesStatus, 'Query excluída com sucesso', 'success');
                await loadEntries();
                await loadProjects();
            } catch (error) {
                console.error('Erro ao excluir query:', error);
                showStatus(entriesStatus, 'Erro ao excluir query', 'error');
            }
        }
        
        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `status-message ${type}`;
            
            setTimeout(() => {
                element.className = 'status-message';
            }, 3000);
        }
    </script>
</body>
</html>
