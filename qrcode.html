<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Codes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
            font-weight: 600;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 5px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: #666;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .mode-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .whatsapp-preview {
            background: #f0fdf4;
            border: 2px solid #25D366;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .whatsapp-preview.show {
            display: block;
        }

        .whatsapp-link-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .whatsapp-link-text {
            flex: 1;
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #25D366;
            word-break: break-all;
            border: 1px solid #e0e0e0;
        }

        .copy-btn {
            background: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #128C7E;
        }

        .copied-message {
            color: #25D366;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .qr-container {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 30px;
            margin: 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            border: 2px dashed #d0d0d0;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .placeholder-text {
            color: #999;
            font-size: 1.1em;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            min-width: 150px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-download {
            background: #28a745;
            color: white;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .phone-preview {
            background: #f0f8ff;
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            display: none;
            font-size: 0.9em;
            color: #667eea;
        }

        .phone-preview.show {
            display: block;
        }

        footer {
            margin-top: 25px;
            color: #888;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Gerador de QR Code</h1>
        
        <!-- Seletor de modo -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="url" id="url-mode-btn">
                🔗 Link/URL
            </button>
            <button class="mode-btn" data-mode="whatsapp" id="whatsapp-mode-btn">
                📱 WhatsApp
            </button>
        </div>

        <!-- Input para URL (modo normal) -->
        <div class="input-group" id="url-input-group">
            <label for="url-input">Digite ou cole seu link:</label>
            <input 
                type="url" 
                id="url-input" 
                placeholder="https://exemplo.com"
                autocomplete="off"
            >
        </div>

        <!-- Input para WhatsApp -->
        <div class="input-group" id="whatsapp-input-group" style="display: none;">
            <label for="phone-input">Digite o número de telefone:</label>
            <input 
                type="tel" 
                id="phone-input" 
                placeholder="(11) 99999-9999"
                autocomplete="off"
            >
            <div class="phone-preview" id="phone-preview">
                Link gerado: <span id="phone-preview-link"></span>
            </div>
        </div>

        <div class="error-message" id="error-message">
            Por favor, insira uma URL válida
        </div>

        <!-- Preview do link WhatsApp -->
        <div class="whatsapp-preview" id="whatsapp-preview">
            <strong>📱 Link do WhatsApp:</strong>
            <div class="whatsapp-link-display">
                <div class="whatsapp-link-text" id="whatsapp-link-text"></div>
                <button class="copy-btn" id="copy-whatsapp-btn">📋 Copiar</button>
            </div>
            <div class="copied-message" id="copied-message">✅ Link copiado!</div>
        </div>

        <div class="qr-container" id="qr-container">
            <div id="qrcode">
                <div class="placeholder-text">
                    🔗 Aguardando link...
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-generate" id="generate-btn">
                Gerar QR Code
            </button>
            <button class="btn btn-download" id="download-btn" disabled>
                Baixar QR Code
            </button>
        </div>

        <footer>
            Coloque um link e clique em Gerar QR Code
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let currentQR = null;
        let qrImageUrl = null;
        let currentMode = 'url'; // 'url' ou 'whatsapp'

        // Elementos do DOM
        const urlInput = document.getElementById('url-input');
        const phoneInput = document.getElementById('phone-input');
        const generateBtn = document.getElementById('generate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const qrcodeDiv = document.getElementById('qrcode');
        const errorMessage = document.getElementById('error-message');
        const qrContainer = document.getElementById('qr-container');
        
        // Elementos dos modos
        const urlModeBtn = document.getElementById('url-mode-btn');
        const whatsappModeBtn = document.getElementById('whatsapp-mode-btn');
        const urlInputGroup = document.getElementById('url-input-group');
        const whatsappInputGroup = document.getElementById('whatsapp-input-group');
        
        // Elementos do WhatsApp
        const whatsappPreview = document.getElementById('whatsapp-preview');
        const whatsappLinkText = document.getElementById('whatsapp-link-text');
        const copyWhatsappBtn = document.getElementById('copy-whatsapp-btn');
        const copiedMessage = document.getElementById('copied-message');
        const phonePreview = document.getElementById('phone-preview');
        const phonePreviewLink = document.getElementById('phone-preview-link');

        // Função para alternar entre modos
        function switchMode(mode) {
            currentMode = mode;
            
            if (mode === 'url') {
                urlModeBtn.classList.add('active');
                whatsappModeBtn.classList.remove('active');
                urlInputGroup.style.display = 'block';
                whatsappInputGroup.style.display = 'none';
                whatsappPreview.classList.remove('show');
                phonePreview.classList.remove('show');
                errorMessage.style.display = 'none';
                generateBtn.disabled = true;
                
                // Limpa QR Code
                qrcodeDiv.innerHTML = '<div class="placeholder-text">🔗 Aguardando link...</div>';
                currentQR = null;
                qrImageUrl = null;
                downloadBtn.disabled = true;
                
                // Limpa inputs
                phoneInput.value = '';
                
            } else if (mode === 'whatsapp') {
                whatsappModeBtn.classList.add('active');
                urlModeBtn.classList.remove('active');
                urlInputGroup.style.display = 'none';
                whatsappInputGroup.style.display = 'block';
                errorMessage.style.display = 'none';
                generateBtn.disabled = true;
                
                // Limpa QR Code
                qrcodeDiv.innerHTML = '<div class="placeholder-text">📱 Aguardando número...</div>';
                currentQR = null;
                qrImageUrl = null;
                downloadBtn.disabled = true;
                
                // Limpa inputs
                urlInput.value = '';
                whatsappPreview.classList.remove('show');
            }
        }

        // Event listeners para os botões de modo
        urlModeBtn.addEventListener('click', () => switchMode('url'));
        whatsappModeBtn.addEventListener('click', () => switchMode('whatsapp'));

        // Função para formatar número de telefone (WhatsApp)
        function formatPhoneForWhatsApp(input) {
            let numbers = input.replace(/\D/g, '');
            
            // Adiciona 55 se não começar com código do país
            if (!numbers.startsWith('55')) {
                numbers = '55' + numbers;
            }
            
            return numbers;
        }

        // Validação do input de telefone em tempo real
        phoneInput.addEventListener('input', function() {
            if (currentMode !== 'whatsapp') return;
            
            const numbers = this.value.replace(/\D/g, '');
            
            if (numbers.length >= 8) {
                const formattedNumber = formatPhoneForWhatsApp(numbers);
                const whatsappLink = `https://wa.me/${formattedNumber}`;
                
                // Mostra preview
                phonePreviewLink.textContent = whatsappLink;
                phonePreview.classList.add('show');
                
                errorMessage.style.display = 'none';
                generateBtn.disabled = false;
            } else if (numbers.length === 0) {
                phonePreview.classList.remove('show');
                errorMessage.style.display = 'none';
                generateBtn.disabled = true;
            } else {
                phonePreview.classList.remove('show');
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Número muito curto. Digite pelo menos 8 dígitos.';
                generateBtn.disabled = true;
            }
        });

        // Validação de URL em tempo real
        urlInput.addEventListener('input', function() {
            if (currentMode !== 'url') return;
            
            const url = this.value.trim();
            
            if (url === '') {
                errorMessage.style.display = 'none';
                generateBtn.disabled = true;
                return;
            }

            if (!isValidURL(url)) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Por favor, insira uma URL válida';
                generateBtn.disabled = true;
            } else {
                errorMessage.style.display = 'none';
                generateBtn.disabled = false;
            }
        });

        // Função para validar URL
        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // Função para gerar QR Code
        function generateQRCode() {
            let qrContent = '';

            if (currentMode === 'url') {
                const url = urlInput.value.trim();

                if (!url) {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Por favor, insira um link';
                    return;
                }

                if (!isValidURL(url)) {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Por favor, insira uma URL válida (incluindo http:// ou https://)';
                    return;
                }

                qrContent = url;
                
            } else if (currentMode === 'whatsapp') {
                const phoneNumber = phoneInput.value.trim();
                const numbers = phoneNumber.replace(/\D/g, '');

                if (numbers.length < 8) {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Por favor, insira um número de telefone válido';
                    return;
                }

                const formattedNumber = formatPhoneForWhatsApp(numbers);
                qrContent = `https://wa.me/${formattedNumber}`;
                
                // Mostra preview do WhatsApp
                whatsappLinkText.textContent = qrContent;
                whatsappPreview.classList.add('show');
                copiedMessage.style.display = 'none';
            }

            // Limpar QR Code anterior
            qrcodeDiv.innerHTML = '';

            try {
                // Criar novo QR Code
                currentQR = new QRCode(qrcodeDiv, {
                    text: qrContent,
                    width: 250,
                    height: 250,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Aguardar um momento para o QR Code ser renderizado
                setTimeout(() => {
                    const qrImage = qrcodeDiv.querySelector('img');
                    if (qrImage) {
                        qrImageUrl = qrImage.src;
                        downloadBtn.disabled = false;
                        
                        // Adicionar animação suave
                        qrImage.style.animation = 'fadeIn 0.5s';
                    }
                }, 100);

                errorMessage.style.display = 'none';

            } catch (error) {
                console.error('Erro ao gerar QR Code:', error);
                qrcodeDiv.innerHTML = '<div class="placeholder-text">❌ Erro ao gerar QR Code</div>';
                downloadBtn.disabled = true;
            }
        }

        // Função para baixar QR Code
        function downloadQRCode() {
            if (!qrImageUrl) return;

            // Criar link de download
            const link = document.createElement('a');
            const prefix = currentMode === 'whatsapp' ? 'whatsapp' : 'url';
            link.download = `qrcode-${prefix}-${Date.now()}.png`;
            link.href = qrImageUrl;
            link.click();
        }

        // Função para copiar link do WhatsApp
        function copyWhatsAppLink() {
            const linkText = whatsappLinkText.textContent;
            if (!linkText) return;

            navigator.clipboard.writeText(linkText).then(() => {
                copiedMessage.style.display = 'block';
                copyWhatsappBtn.textContent = '✅';
                
                setTimeout(() => {
                    copiedMessage.style.display = 'none';
                    copyWhatsappBtn.textContent = '📋 Copiar';
                }, 2000);
            });
        }

        // Event listeners
        generateBtn.addEventListener('click', generateQRCode);
        downloadBtn.addEventListener('click', downloadQRCode);
        copyWhatsappBtn.addEventListener('click', copyWhatsAppLink);

        // Permitir gerar com Enter
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && currentMode === 'url') {
                e.preventDefault();
                if (!generateBtn.disabled) {
                    generateQRCode();
                }
            }
        });

        phoneInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && currentMode === 'whatsapp') {
                e.preventDefault();
                if (!generateBtn.disabled) {
                    generateQRCode();
                }
            }
        });

        // Limpar estado inicial
        generateBtn.disabled = true;

        // Adicionar CSS para animação
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
