<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Codes - WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
            font-weight: 600;
        }

        .whatsapp-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #25D366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
        }

        .phone-preview {
            background: #f0fdf4;
            border: 2px solid #25D366;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .phone-preview.show {
            display: block;
        }

        .phone-preview-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .phone-preview-icon {
            font-size: 2em;
        }

        .phone-preview-text {
            flex: 1;
            text-align: left;
        }

        .phone-preview-number {
            font-size: 1.1em;
            font-weight: 600;
            color: #075e54;
            margin-bottom: 5px;
        }

        .phone-preview-link {
            font-size: 0.9em;
            color: #25D366;
            word-break: break-all;
        }

        .copy-link-btn {
            background: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-link-btn:hover {
            background: #128C7E;
        }

        .qr-container {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 30px;
            margin: 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
            border: 2px dashed #d0d0d0;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .placeholder-text {
            color: #999;
            font-size: 1.1em;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            min-width: 150px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-download {
            background: #28a745;
            color: white;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        footer {
            margin-top: 25px;
            color: #888;
            font-size: 0.85em;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="whatsapp-icon">💬</div>
        <h1>Gerador de QR Code WhatsApp</h1>
        
        <div class="input-group">
            <label for="phone-input">Digite o número de telefone:</label>
            <input 
                type="tel" 
                id="phone-input" 
                placeholder="(11) 99999-9999"
                autocomplete="off"
            >
            <div class="error-message" id="error-message">
                Por favor, insira um número de telefone válido
            </div>
        </div>

        <!-- Preview do link do WhatsApp -->
        <div class="phone-preview" id="phone-preview">
            <div class="phone-preview-content">
                <div class="phone-preview-icon">📱</div>
                <div class="phone-preview-text">
                    <div class="phone-preview-number" id="preview-number"></div>
                    <div class="phone-preview-link" id="preview-link"></div>
                </div>
                <button class="copy-link-btn" id="copy-link-btn" title="Copiar link">
                    📋 Copiar
                </button>
            </div>
        </div>

        <!-- Mensagem de sucesso ao copiar -->
        <div class="success-message" id="success-message">
            ✅ Link copiado com sucesso!
        </div>

        <div class="qr-container" id="qr-container">
            <div id="qrcode">
                <div class="placeholder-text">
                    📱 Aguardando número...
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-generate" id="generate-btn">
                Gerar QR Code
            </button>
            <button class="btn btn-download" id="download-btn" disabled>
                Baixar QR Code
            </button>
        </div>

        <footer>
            Digite um número de telefone com DDD e clique em Gerar QR Code
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let currentQR = null;
        let qrImageUrl = null;
        let currentWhatsAppLink = '';

        // Elementos do DOM
        const phoneInput = document.getElementById('phone-input');
        const generateBtn = document.getElementById('generate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const qrcodeDiv = document.getElementById('qrcode');
        const errorMessage = document.getElementById('error-message');
        const qrContainer = document.getElementById('qr-container');
        const phonePreview = document.getElementById('phone-preview');
        const previewNumber = document.getElementById('preview-number');
        const previewLink = document.getElementById('preview-link');
        const copyLinkBtn = document.getElementById('copy-link-btn');
        const successMessage = document.getElementById('success-message');

        // Função para formatar número de telefone
        function formatPhoneNumber(input) {
            // Remove todos os caracteres não numéricos
            let numbers = input.replace(/\D/g, '');
            
            // Adiciona 55 se não começar com código do país
            if (!numbers.startsWith('55')) {
                numbers = '55' + numbers;
            }
            
            // Remove zeros extras após o código do país
            if (numbers.length > 2 && numbers[2] === '0') {
                numbers = numbers.substring(0, 2) + numbers.substring(3);
            }
            
            return numbers;
        }

        // Função para criar link do WhatsApp
        function createWhatsAppLink(phoneNumber) {
            return `https://wa.me/${phoneNumber}`;
        }

        // Função para formatar número para exibição
        function formatForDisplay(phoneNumber) {
            // Remove o 55 do início para exibição
            let displayNumber = phoneNumber.substring(2);
            
            if (displayNumber.length === 11) {
                // Celular com 9 dígitos: (XX) 9XXXX-XXXX
                return `(${displayNumber.substring(0, 2)}) ${displayNumber.substring(2, 7)}-${displayNumber.substring(7)}`;
            } else if (displayNumber.length === 10) {
                // Telefone fixo: (XX) XXXX-XXXX
                return `(${displayNumber.substring(0, 2)}) ${displayNumber.substring(2, 6)}-${displayNumber.substring(6)}`;
            } else {
                return phoneNumber;
            }
        }

        // Validação do número de telefone em tempo real
        phoneInput.addEventListener('input', function() {
            let value = this.value;
            
            // Remove caracteres não numéricos para validação
            let numbers = value.replace(/\D/g, '');
            
            // Se o número tiver pelo menos 8 dígitos (sem contar o 55)
            let localNumber = numbers;
            if (numbers.startsWith('55')) {
                localNumber = numbers.substring(2);
            }
            
            if (localNumber.length >= 8 && localNumber.length <= 11) {
                errorMessage.style.display = 'none';
                generateBtn.disabled = false;
                
                // Formata e mostra preview
                const formattedNumber = formatPhoneNumber(numbers);
                const whatsappLink = createWhatsAppLink(formattedNumber);
                
                currentWhatsAppLink = whatsappLink;
                
                // Atualiza preview
                previewNumber.textContent = `📞 ${formatForDisplay(formattedNumber)}`;
                previewLink.textContent = whatsappLink;
                phonePreview.classList.add('show');
                
                // Limpa QR Code anterior se houver
                if (currentQR) {
                    qrcodeDiv.innerHTML = '<div class="placeholder-text">📱 Aguardando número...</div>';
                    currentQR = null;
                    qrImageUrl = null;
                    downloadBtn.disabled = true;
                }
            } else if (numbers.length === 0) {
                errorMessage.style.display = 'none';
                generateBtn.disabled = true;
                phonePreview.classList.remove('show');
            } else {
                errorMessage.style.display = 'block';
                generateBtn.disabled = true;
                phonePreview.classList.remove('show');
            }
        });

        // Função para gerar QR Code
        function generateQRCode() {
            const phoneNumber = phoneInput.value.trim();

            if (!phoneNumber) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Por favor, insira um número de telefone';
                return;
            }

            // Formata o número
            const numbers = phoneNumber.replace(/\D/g, '');
            const localNumber = numbers.startsWith('55') ? numbers.substring(2) : numbers;
            
            if (localNumber.length < 8 || localNumber.length > 11) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Por favor, insira um número de telefone válido (8-11 dígitos)';
                return;
            }

            const formattedNumber = formatPhoneNumber(numbers);
            const whatsappLink = createWhatsAppLink(formattedNumber);
            currentWhatsAppLink = whatsappLink;

            // Atualiza preview
            previewNumber.textContent = `📞 ${formatForDisplay(formattedNumber)}`;
            previewLink.textContent = whatsappLink;
            phonePreview.classList.add('show');

            // Limpar QR Code anterior
            qrcodeDiv.innerHTML = '';

            try {
                // Criar novo QR Code com tamanho maior para melhor qualidade
                currentQR = new QRCode(qrcodeDiv, {
                    text: whatsappLink,
                    width: 250,
                    height: 250,
                    colorDark: "#075e54",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Aguardar um momento para o QR Code ser renderizado
                setTimeout(() => {
                    const qrImage = qrcodeDiv.querySelector('img');
                    if (qrImage) {
                        qrImageUrl = qrImage.src;
                        downloadBtn.disabled = false;
                        
                        // Adicionar animação suave
                        qrImage.style.animation = 'fadeIn 0.5s';
                    }
                }, 100);

            } catch (error) {
                console.error('Erro ao gerar QR Code:', error);
                qrcodeDiv.innerHTML = '<div class="placeholder-text">❌ Erro ao gerar QR Code</div>';
                downloadBtn.disabled = true;
            }
        }

        // Função para copiar link
        function copyWhatsAppLink() {
            if (!currentWhatsAppLink) return;
            
            navigator.clipboard.writeText(currentWhatsAppLink).then(() => {
                // Mostra mensagem de sucesso
                successMessage.classList.add('show');
                
                // Esconde após 2 segundos
                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 2000);
                
                // Muda o texto do botão temporariamente
                const originalText = copyLinkBtn.textContent;
                copyLinkBtn.textContent = '✅ Copiado!';
                copyLinkBtn.style.backgroundColor = '#28a745';
                
                setTimeout(() => {
                    copyLinkBtn.textContent = originalText;
                    copyLinkBtn.style.backgroundColor = '#25D366';
                }, 1500);
            }).catch(err => {
                console.error('Erro ao copiar:', err);
            });
        }

        // Função para baixar QR Code
        function downloadQRCode() {
            if (!qrImageUrl) return;

            // Criar link de download
            const link = document.createElement('a');
            link.download = `whatsapp-qrcode-${Date.now()}.png`;
            link.href = qrImageUrl;
            link.click();
        }

        // Event listeners
        generateBtn.addEventListener('click', generateQRCode);
        downloadBtn.addEventListener('click', downloadQRCode);
        copyLinkBtn.addEventListener('click', copyWhatsAppLink);

        // Permitir gerar com Enter
        phoneInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!generateBtn.disabled) {
                    generateQRCode();
                }
            }
        });

        // Limpar estado inicial
        generateBtn.disabled = true;

        // Adicionar CSS para animação
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
